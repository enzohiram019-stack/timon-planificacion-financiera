const icon = (name, size = 16, sw = 1.8) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
const CHIP_ICON = { good: 'check', warn: 'alert', crit: 'alert', info: 'info' };
const chip = (kind, text) => `<span class="chip chip-${kind}">${CHIP_ICON[kind] ? icon(CHIP_ICON[kind], 12, 2.2) : ''}${esc(text)}</span>`;
const seg = (action, current, opts) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button type="button" data-action="${action}" data-v="${esc(v)}" aria-pressed="${String(v) === String(current)}">${esc(l)}</button>`).join('')}</div>`;
const pageHead = (title, lede, tools = '') => `<div class="page-head"><div><h1>${esc(title)}</h1>${lede ? `<p class="lede">${lede}</p>` : ''}</div>${tools ? `<div class="toolbar">${tools}</div>` : ''}</div>`;
const tabs = (action, current, opts) => `<div class="tabs" role="tablist">${opts.map(([v, l]) => `<button type="button" role="tab" data-action="${action}" data-v="${v}" aria-selected="${v === current}">${esc(l)}</button>`).join('')}</div>`;
const numCell = (v, opts = {}) => `<td class="${opts.cls || 'n'}${v < -0.5 ? ' neg' : ''}">${fmt(v, { dash: true, paren: opts.paren })}</td>`;

/* ---------- Tablero ---------- */
function viewTablero(M) {
  const cm = M.cal.midx.has(M.curMonth) ? M.curMonth : (M.curMonth < M.months[0] ? M.months[0] : M.months[M.nM - 1]);
  const mi = M.cal.midx.get(cm);
  const anio = cm.slice(0, 4);
  const mesesAnio = M.months.map((m, i) => [m, i]).filter(([m]) => m.startsWith(anio)).map(([, i]) => i);
  const k = [];
  if (M.ultimaCerrada >= 0) {
    const w = M.weeks[M.ultimaCerrada];
    k.push({ lbl: `Caja al cierre de ${weekLabel(w)}`, val: M.saldo.eff.fin[M.ultimaCerrada], sub: `Última semana cerrada (${w.rango})` });
  } else {
    k.push({ lbl: 'Saldo inicial del período', val: S.config.saldoInicial, sub: `Al ${fmtDate(M.cal.start)} · todavía no hay semanas cerradas` });
  }
  const finMes = M.saldo.eff.fin[mi * 4 + 3];
  k.push({ lbl: `Saldo proyectado a fin de ${MES_LARGO[Number(cm.slice(5, 7)) - 1]}`, val: finMes, sub: 'Real cargado + proyección' });
  if (M.minIdx >= 0) {
    const v = M.saldo.eff.fin[M.minIdx];
    k.push({ lbl: 'Saldo mínimo proyectado', val: v, sub: `${v < 0 ? chip('crit', 'Negativo') : chip('good', 'Positivo')} ${weekLabel(M.weeks[M.minIdx])} · ${M.weeks[M.minIdx].rango}` });
  }
  const vr = M.ventasReal[mi], vp = M.eerr.ppto.ventas[mi];
  const cumpl = vp > 0.5 ? vr / vp : null;
  k.push({ lbl: `Ventas de ${MES_LARGO[Number(cm.slice(5, 7)) - 1]}`, val: vr, sub: `${cumpl != null ? `<span>${fmtPct(cumpl, 0)} de ${fmt(vp)} presupuestado</span>` : '<span>Sin presupuesto este mes</span>'}`, meter: cumpl });
  const porCobrar = sum(M.cuentas.map((c) => Math.max(0, c.saldo) * c.f));
  const vencido = sum(M.cuentas.map((c) => c.vencido * c.f));
  k.push({ lbl: 'Cuentas por cobrar', val: porCobrar, sub: vencido > 0.5 ? `${chip('crit', 'Vencido')} ${fmt(vencido)}` : chip('good', 'Sin vencidos') });
  const rnAnio = sum(mesesAnio.map((i) => M.eerr.proy.rn[i]));
  const rnPpto = sum(mesesAnio.map((i) => M.eerr.ppto.rn[i]));
  k.push({ lbl: `Resultado neto ${anio} (proyección)`, val: rnAnio, sub: `Presupuesto: ${fmt(rnPpto)}` });

  const strip = `<div class="strip ${k.length === 4 ? 'c4' : ''}">${k.map((x) => `<div><span class="lbl">${esc(x.lbl)}</span><span class="val${x.val < -0.5 ? ' neg' : ''}">${money(x.val)}</span>${x.meter != null ? `<div class="meter" aria-hidden="true"><span style="width:${Math.max(0, Math.min(100, x.meter * 100)).toFixed(0)}%"></span></div>` : ''}<span class="sub">${x.sub}</span></div>`).join('')}</div>`;

  const alertas = M.alerts.map((a) => {
    if (a.tipo === 'cierre') {
      const ws = a.idx.map((i) => M.weeks[i]);
      const txt = ws.length <= 3 ? ws.map(weekLabel).join(', ') : `${weekLabel(ws[0])} a ${weekLabel(ws[ws.length - 1])}`;
      return `<div class="alert">${chip('warn', 'Pendiente')}<div class="grow">${a.n === 1 ? 'Hay 1 semana anterior a hoy sin cerrar' : `Hay ${a.n} semanas anteriores a hoy sin cerrar`} (${esc(txt)}). Cargá los montos reales y cerrala para que el saldo refleje la caja real.</div><button class="btn btn-sm" data-action="ir-semana" data-w="${a.idx[0]}">Ir al flujo</button></div>`;
    }
    if (a.tipo === 'negativo') return `<div class="alert">${chip('crit', 'Caja')}<div class="grow">El saldo proyectado queda negativo en ${esc(weekLabel(M.weeks[a.idx]))} (${esc(M.weeks[a.idx].rango)}): <b class="neg">${money(a.valor)}</b>. Revisá cobranzas, pagos o financiamiento para esa semana.${(() => { const w = M.weeks[a.idx]; const docs = M.cuentas.filter((c) => c.saldo > 0.004 && c.cuotas.some((q) => q.monto - q.cobrado > 0.004 && q.vence > w.end)); if (!docs.length) return ''; const tot = sum(docs.map((c) => sum(c.cuotas.filter((q) => q.monto - q.cobrado > 0.004 && q.vence > w.end).map((q) => q.monto - q.cobrado)) * c.f)); return ` Hay ${docs.length} ${docs.length === 1 ? 'documento' : 'documentos'} por cobrar que vencen después (${money(tot)}) y se podrían descontar antes de esa semana.`; })()}</div><button class="btn btn-sm" data-action="ir-semana" data-w="${a.idx}">Ver semana</button>${M.cuentas.some((c) => c.saldo > 0.004 && c.cuotas.some((q) => q.monto - q.cobrado > 0.004 && q.vence > M.weeks[a.idx].end)) ? '<button class="btn btn-sm" data-action="ir" data-v="ventas">Descontar documentos</button>' : ''}</div>`;
    if (a.tipo === 'vencidas') return `<div class="alert">${chip('crit', 'Cobranzas')}<div class="grow">${money(a.valor)} vencidos sin cobrar en ${a.n} ${a.n === 1 ? 'cliente' : 'clientes'}. En la proyección se esperan para esta semana: registrá el cobro o reprogramá el vencimiento.</div><button class="btn btn-sm" data-action="ir" data-v="ventas">Ver cuentas</button></div>`;
    if (a.tipo === 'pagar') return `<div class="alert">${chip('warn', 'Proveedores')}<div class="grow">${money(a.valor)} vencidos sin pagar a ${a.n} ${a.n === 1 ? 'proveedor' : 'proveedores'}. En la proyección se pagan esta semana: registrá el pago o cambiá el vencimiento.</div><button class="btn btn-sm" data-action="ir" data-v="compras">Ver cuentas por pagar</button></div>`;
    if (a.tipo === 'inventario') return `<div class="alert">${chip('warn', 'Inventario')}<div class="grow">El inventario proyectado queda negativo en ${esc(mLabel(M.months[a.mi]))} (${money(a.valor)}). Revisá el costo unitario de los productos o las compras de materia prima.</div><button class="btn btn-sm" data-action="ir" data-v="balance">Ver balance</button></div>`;
    if (a.tipo === 'balance') return `<div class="alert">${chip('warn', 'Balance')}<div class="grow">El balance inicial no cuadra: activo − pasivo − patrimonio = ${money(a.valor)}.</div><button class="btn btn-sm" data-action="balance-editar">Revisar</button></div>`;
    return '';
  }).join('');

  const proxCobros = M.cuentas.filter((c) => c.saldo > 0.004).flatMap((c) => c.cuotas.filter((q) => q.monto - q.cobrado > 0.004).map((q) => ({ c, q, rem: q.monto - q.cobrado })))
    .filter((x) => x.q.vence <= addDays(M.HOY, 14)).sort((a, b) => a.q.vence.localeCompare(b.q.vence)).slice(0, 8);
  const cobrosHtml = proxCobros.length ? `<div class="tbl-wrap"><table class="list"><thead><tr><th>Vence</th><th>Cliente</th><th class="n">Saldo</th><th></th></tr></thead><tbody>${proxCobros.map((x) => `<tr><td>${fmtDate(x.q.vence)} ${x.q.vence < M.HOY ? chip('crit', 'Vencido') : ''}</td><td class="wrap">${esc(nombreCliente(x.c.v.clienteId))}</td><td class="n">${fmtDoc(x.rem, x.c.v)}</td><td class="act"><button class="btn btn-sm" data-action="cobro-nuevo" data-id="${x.c.v.id}">Cobrar</button></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">No hay cobros previstos en los próximos 14 días.</div>`;

  const w0 = Math.max(0, Math.min(M.curC, M.nW - 1));
  const pagos = [];
  for (const x of M.lines) {
    if (x.sec === 'ing') continue;
    for (let i = w0; i < Math.min(M.nW, w0 + 2); i++) {
      const v = M.closed[i] ? 0 : x.proj[i] - (x.hasReal[i] ? x.real[i] : 0);
      if (v > 0.5 && !x.hasReal[i]) pagos.push({ x, i, v });
    }
  }
  for (const c of M.cuentasPagar) {
    if (c.saldo <= 0.004) continue;
    for (const q of c.cuotas) {
      const rem = (q.monto - q.cobrado) * c.f;
      if (rem <= 0.5) continue;
      const i = Math.max(M.wOf(q.vence), w0);
      if (i >= w0 && i < Math.min(M.nW, w0 + 2)) pagos.push({ x: { l: { nombre: `${nombreProveedor(c.v.proveedorId)}${c.v.factura ? ` · ${c.v.factura}` : ''}` }, g: { nombre: q.vence < M.HOY ? 'Proveedor · vencido' : 'Proveedor' } }, i, v: rem });
    }
  }
  pagos.sort((a, b) => b.v - a.v);
  const pagosHtml = pagos.length ? `<div class="tbl-wrap"><table class="list"><thead><tr><th>Semana</th><th>Concepto</th><th class="n">Proyectado</th></tr></thead><tbody>${pagos.slice(0, 8).map((p) => `<tr><td>${esc(weekLabel(M.weeks[p.i]))}</td><td class="wrap">${esc(p.x.l.nombre)} <span class="muted small">· ${esc(p.x.g.nombre)}</span></td><td class="n">${fmt(p.v)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">No hay pagos proyectados pendientes para esta semana y la próxima.</div>`;

  return `
  ${pageHead('Tablero', `Situación al ${fmtDate(M.HOY)}. Todo se recalcula con cada venta, cobro o monto que se carga.`)}
  ${strip}
  ${alertas ? `<section class="panel"><div class="panel-head"><h2>Para atender</h2></div><div class="panel-body"><div class="alerts">${alertas}</div></div></section>` : ''}
  <div class="cols">
    <section class="panel"><div class="panel-head"><div><h2>Saldo de caja semanal</h2><div class="sub">Cierre de cada semana en ${esc(S.empresa.simbolo)}: real en semanas cerradas, proyección en el resto</div></div><button class="btn btn-sm btn-ghost" data-action="tabla-toggle" data-t="ch-saldo">${icon('table', 14)}Ver tabla</button></div><div class="panel-body">${chartSaldo(M, 'ch-saldo')}</div></section>
    <section class="panel"><div class="panel-head"><div><h2>Ventas por mes</h2><div class="sub">Presupuesto del plan comercial contra lo vendido; el pendiente del plan se proyecta hasta fin de mes</div></div><button class="btn btn-sm btn-ghost" data-action="tabla-toggle" data-t="ch-ventas">${icon('table', 14)}Ver tabla</button></div><div class="panel-body">${chartVentas(M, 'ch-ventas')}</div></section>
  </div>
  <div class="cols">
    <section class="panel"><div class="panel-head"><div><h2>Cobros de los próximos 14 días</h2><div class="sub">Incluye los vencidos que siguen sin cobrar</div></div><button class="btn btn-sm" data-action="ir" data-v="ventas">Cuentas por cobrar</button></div><div class="panel-body">${cobrosHtml}</div></section>
    <section class="panel"><div class="panel-head"><div><h2>Pagos proyectados sin registrar</h2><div class="sub">Esta semana y la próxima, de mayor a menor</div></div><button class="btn btn-sm" data-action="ir-semana" data-w="${w0}">Abrir flujo</button></div><div class="panel-body">${pagosHtml}</div></section>
  </div>
  <section class="panel"><div class="panel-head"><h2>Cómo se usa cada semana</h2></div><div class="panel-body"><ol class="steps">
    <li><span>Registrá cada venta con su condición de cobro: el cobro se agenda solo en el flujo y la venta suma al EERR.</span></li>
    <li><span>Registrá los cobros cuando entran: pasan de proyectado a real y se actualiza la caja.</span></li>
    <li><span>En el flujo semanal, cargá los pagos reales de la semana y cerrala. Ajustá la proyección de las próximas si cambió algo.</span></li>
    <li><span>Revisá el EERR y el balance proyectado: se recalculan con cada dato y se comparan con el presupuesto aprobado.</span></li>
  </ol></div></section>`;
}

/* ---------- Flujo de caja ---------- */
function flujoMesesVisibles(M) {
  let start = UI.flujoMes && M.cal.midx.has(UI.flujoMes) ? UI.flujoMes : (M.cal.midx.has(M.curMonth) ? M.curMonth : M.months[0]);
  const n = Math.max(1, Math.min(3, UI.flujoN));
  let si = M.cal.midx.get(start);
  si = Math.max(0, Math.min(si, M.nM - n));
  UI.flujoMes = M.months[si];
  return M.months.slice(si, si + n);
}

function viewFlujo(M) {
  const modo = UI.flujoModo;
  let tools = seg('flujo-modo', modo, [['semanal', 'Semanal'], ['mensual', 'Mensual']]);
  if (modo === 'semanal') {
    const vis = flujoMesesVisibles(M);
    const lbl = vis.length === 1 ? mLabel(vis[0], true) : `${mLabel(vis[0])} – ${mLabel(vis[vis.length - 1])}`;
    tools += `<div class="monthnav"><button class="btn btn-icon btn-sm" data-action="flujo-mes" data-d="-1" aria-label="Mes anterior">${icon('left', 15)}</button><span class="lbl">${esc(lbl)}</span><button class="btn btn-icon btn-sm" data-action="flujo-mes" data-d="1" aria-label="Mes siguiente">${icon('right', 15)}</button></div>`;
    tools += seg('flujo-n', UI.flujoN, [[1, '1 mes'], [2, '2 meses'], [3, '3 meses']]);
    tools += `<button class="btn btn-sm" data-action="flujo-hoy">Hoy</button>`;
  } else {
    tools += seg('flujo-capa', UI.flujoCapa, [['eff', 'Real + proyección'], ['proj', 'Proyectado'], ['real', 'Real']]);
  }
  const keys = `<div class="toolbar small"><span class="key"><i style="background:var(--input)"></i>Monto cargado (editable)</span><span class="key"><i style="background:var(--link)"></i>Viene de ventas y cobros</span><span class="key"><i style="background:var(--closed-bg);border:1px solid var(--rule-strong)"></i>Semana cerrada</span><span class="key muted">Se aceptan fórmulas: =2500000/TC</span></div>`;
  const lede = modo === 'semanal'
    ? 'Cada semana tiene su proyección y su real. Las cobranzas se completan solas con las ventas registradas y el plan comercial. Al cerrar una semana, el saldo pasa a usar solo el real.'
    : (UI.flujoCapa === 'proj' ? 'Vista mensual de la proyección. Un monto cargado acá se reparte en partes iguales entre las semanas abiertas del mes.' : 'Vista mensual con la misma estructura de la planilla original. Para cargar reales, usá la vista semanal.');
  return `${pageHead('Flujo de caja', lede, tools)}${keys}${modo === 'semanal' ? gridSemanal(M) : gridMensual(M)}`;
}

function grpBadge(auto, calc) {
  if (auto) return ` <span class="grp-badge">${auto === 'cxc' ? 'desde ventas' : auto === 'cxp' ? 'desde compras' : auto === 'mrp' ? 'desde producción' : 'desde plan'}</span>`;
  if (calc) return ' <span class="grp-badge">calculado</span>';
  return '';
}
function cellInput(fk, v, raw, { ro = false, label = '', formula = '' } = {}) {
  const show = v == null ? '' : fmt(v);
  return `<input class="cell" type="text" inputmode="decimal" autocomplete="off" data-cell="${esc(fk)}" data-fk="${esc(fk)}" value="${esc(show)}" data-raw="${esc(raw)}"${ro ? ' readonly tabindex="-1"' : ''}${formula ? ` title="${esc(formula)}"` : ''} aria-label="${esc(label)}">`;
}

function gridSemanal(M) {
  const meses = flujoMesesVisibles(M);
  const cols = meses.map((m) => ({ m, ws: [0, 1, 2, 3].map((k) => M.cal.midx.get(m) * 4 + k) }));
  const nCols = 1 + cols.length * 10;
  let h1 = `<tr class="h1"><th class="lbl">Concepto</th>`, h2 = `<tr class="h2"><th class="lbl"></th>`;
  for (const c of cols) {
    for (const i of c.ws) {
      const w = M.weeks[i];
      let st = '';
      if (M.closed[i]) st = `<span class="chip chip-good">${icon('lock', 11, 2.2)}Cerrada</span><button class="lockbtn" data-action="semana-abrir" data-w="${i}" title="Reabrir semana" aria-label="Reabrir ${esc(weekLabel(w))}">${icon('unlock', 14)}</button>`;
      else if (i === M.cur) st = `<span class="chip chip-info">Actual</span><button class="lockbtn" data-action="semana-cerrar" data-w="${i}" title="Cerrar semana" aria-label="Cerrar ${esc(weekLabel(w))}">${icon('lock', 14)}</button>`;
      else if (i < M.cur) st = `<span class="chip chip-warn">Sin cerrar</span><button class="lockbtn" data-action="semana-cerrar" data-w="${i}" title="Cerrar semana" aria-label="Cerrar ${esc(weekLabel(w))}">${icon('lock', 14)}</button>`;
      else st = `<span class="chip">Proyección</span>`;
      h1 += `<th colspan="2" class="wk${i === M.cur ? ' cur' : ''}"><div class="wk-head"><span class="t">S${w.i} · ${esc(w.rango)}</span><span class="r">${st}</span></div></th>`;
      h2 += `<th class="wk">Proy.</th><th>Real</th>`;
    }
    h1 += `<th colspan="2" class="wk mt"><div class="wk-head"><span class="t">Total ${esc(mLabel(c.m))}</span></div></th>`;
    h2 += `<th class="wk mt">Proy.</th><th class="mt">Real</th>`;
  }
  h1 += '</tr>'; h2 += '</tr>';
  const valCell = (v, cls = '') => `<td class="v${cls}${v < -0.5 ? ' neg' : ''}">${fmt(v, { dash: true })}</td>`;
  let body = '';
  for (const sec of ['ing', 'egr', 'fin']) {
    body += `<tr class="sec"><td class="lbl">${SECCIONES[sec]}</td><td colspan="${nCols - 1}"></td></tr>`;
    for (const g of M.grupos.filter((x) => x.sec === sec)) {
      const visibles = cols.flatMap((c) => c.ws);
      const items = grupoItems(M, g).filter((it) => !(it.auto || it.calc) || visibles.some((i) => Math.abs(it.proj[i]) > 0.004 || Math.abs(it.real[i]) > 0.004));
      const abierto = !UI.colapsados[g.id];
      const gp = addArr(items.map((x) => x.proj), M.nW), gr = addArr(items.map((x) => x.real), M.nW);
      let tr = `<tr class="grp"><td class="lbl"><button class="grp-toggle" data-action="toggle-grupo" data-g="${g.id}" aria-expanded="${abierto}">${icon('down', 14)}${esc(g.nombre)}</button>${grpBadge(g.auto, g.calc)}</td>`;
      for (const c of cols) {
        for (const i of c.ws) tr += valCell(gp[i], ` wk${M.closed[i] ? ' closed' : ''}`) + valCell(gr[i], M.closed[i] ? ' closed' : '');
        tr += valCell(sum(c.ws.map((i) => gp[i])), ' wk mt') + valCell(sum(c.ws.map((i) => gr[i])), ' mt');
      }
      body += tr + '</tr>';
      if (!abierto) continue;
      if (!items.length) {
        body += `<tr class="line"><td class="lbl muted">${g.auto === 'cxc' ? 'Sin cobros en estas semanas' : g.auto === 'cxp' ? 'Sin pagos en estas semanas' : g.auto === 'plan' ? 'Sin plan pendiente en estas semanas' : g.auto === 'mrp' ? 'Sin compras planificadas en estas semanas' : 'Sin líneas'}</td><td colspan="${nCols - 1}"></td></tr>`;
        continue;
      }
      for (const it of items) {
        let r = `<tr class="line"><td class="lbl" title="${esc(it.label)}">${esc(it.label)}</td>`;
        for (const c of cols) {
          for (const i of c.ws) {
            const w = M.weeks[i];
            const cl = M.closed[i] ? ' closed' : '';
            if (it.auto) {
              const btn = (v, capa) => (Math.abs(v) > 0.004 ? `<button class="cell-auto" data-action="detalle-auto" data-auto="${it.auto}" data-cliente="${it.clienteId}" data-w="${i}" data-capa="${capa}">${fmt(v)}</button>` : '');
              r += `<td class="c wk${cl}">${btn(it.proj[i], 'p')}</td><td class="c${cl}">${it.auto !== 'plan' ? btn(it.real[i], 'r') : ''}</td>`;
            } else if (it.calc) {
              const cv = (S.valores[it.id] || {})[w.key] || {};
              const rv = isNum(cv.r) ? cv.r : null;
              r += `<td class="v wk${cl} calc" title="Calculado">${fmt(it.proj[i], { dash: true })}</td>`;
              r += `<td class="c${cl}">${cellInput(`${it.id}|${w.key}|r`, rv, rawNum(rv), { ro: M.closed[i], label: `${it.label}, ${weekLabel(w)}, real` })}</td>`;
            } else {
              const cv = (S.valores[it.id] || {})[w.key] || {};
              const pv = isNum(cv.p) ? cv.p : null, rv = isNum(cv.r) ? cv.r : null;
              const mi = Math.floor(i / 4);
              const desc = it.descontado && it.descontado[mi] > 0.004 ? `Compras registradas descuentan ${fmt(it.descontado[mi])} de la proyección de ${mLabel(w.m)}` : '';
              r += `<td class="c wk${cl}${desc ? ' desc' : ''}">${cellInput(`${it.id}|${w.key}|p`, pv ? pv : null, cv.pf || rawNum(pv), { ro: M.closed[i], label: `${it.label}, ${weekLabel(w)}, proyectado`, formula: cv.pf || desc })}</td>`;
              r += `<td class="c${cl}">${cellInput(`${it.id}|${w.key}|r`, rv, cv.rf || rawNum(rv), { ro: M.closed[i], label: `${it.label}, ${weekLabel(w)}, real`, formula: cv.rf })}</td>`;
            }
          }
          const tp = sum(c.ws.map((i) => it.proj[i])), trr = sum(c.ws.map((i) => it.real[i]));
          if (!it.auto && !it.calc && !c.ws.every((i) => M.closed[i])) r += `<td class="c wk mt">${cellInput(`${it.id}|M:${c.m}|p`, tp ? tp : null, rawNum(tp), { label: `${it.label}, total ${mLabel(c.m)}, proyectado` })}</td>`;
          else r += valCell(tp, ' wk mt');
          r += valCell(trr, ' mt');
        }
        body += r + '</tr>';
      }
    }
    const tp = M.secTot[sec].proj, trr = M.secTot[sec].real;
    let tr = `<tr class="tot"><td class="lbl">Total ${SECCIONES[sec].toLowerCase()}</td>`;
    for (const c of cols) {
      for (const i of c.ws) tr += valCell(tp[i], ` wk${M.closed[i] ? ' closed' : ''}`) + valCell(trr[i], M.closed[i] ? ' closed' : '');
      tr += valCell(sum(c.ws.map((i) => tp[i])), ' wk mt') + valCell(sum(c.ws.map((i) => trr[i])), ' mt');
    }
    body += tr + '</tr>';
  }
  const np = M.saldo.proj.net, nr = M.saldo.real.net;
  let trn = `<tr class="tot"><td class="lbl">Flujo neto de la semana</td>`;
  for (const c of cols) {
    for (const i of c.ws) trn += valCell(np[i], ` wk${M.closed[i] ? ' closed' : ''}`) + valCell(nr[i], M.closed[i] ? ' closed' : '');
    trn += valCell(sum(c.ws.map((i) => np[i])), ' wk mt') + valCell(sum(c.ws.map((i) => nr[i])), ' mt');
  }
  body += trn + '</tr>';
  const saldoRow = (label, arr, fin) => {
    let r = `<tr class="saldo"><td class="lbl">${label}</td>`;
    for (const c of cols) {
      for (const i of c.ws) r += `<td colspan="2" class="v wk${arr[i] < -0.5 ? ' neg' : ''}${M.closed[i] ? '' : ' proj-eff'}">${fmt(arr[i])}</td>`;
      const mv = fin ? arr[c.ws[3]] : arr[c.ws[0]];
      r += `<td colspan="2" class="v wk mt${mv < -0.5 ? ' neg' : ''}">${fmt(mv)}</td>`;
    }
    return r + '</tr>';
  };
  body += saldoRow('Saldo inicial', M.saldo.eff.ini, false);
  body += saldoRow('Saldo final (real + proyección)', M.saldo.eff.fin, true);
  return `<div class="grid-wrap" data-scroll="flujo-sem"><table class="grid"><thead>${h1}${h2}</thead><tbody>${body}</tbody></table></div>
  <p class="small muted">En semanas cerradas el saldo usa solo el real. En semanas abiertas usa el real si ya se cargó y, si no, la proyección (en cursiva). Los cobros vencidos sin registrar se esperan en la semana actual.</p>`;
}

function gridMensual(M) {
  const capa = UI.flujoCapa;
  const rows = flujoMensualRows(M, capa);
  const editable = capa === 'proj';
  let h = `<tr class="h1"><th class="lbl">Concepto</th>${M.months.map((m) => `<th class="${m === M.curMonth ? 'cur' : ''}">${esc(mLabel(m))}</th>`).join('')}<th class="mt">Total</th></tr>`;
  let body = '';
  const td = (v, cls = '') => `<td class="v${cls}${v < -0.5 ? ' neg' : ''}">${fmt(v, { dash: true })}</td>`;
  for (const r of rows) {
    if (r.kind === 'sec') { body += `<tr class="sec"><td class="lbl">${esc(r.label)}</td><td colspan="${M.nM + 1}"></td></tr>`; continue; }
    if (r.kind === 'line' && UI.colapsados[r.gid]) continue;
    const cls = r.kind === 'grp' ? 'grp' : r.kind === 'line' ? 'line' : r.kind === 'tot' ? 'tot' : 'saldo';
    let label = esc(r.label);
    if (r.kind === 'grp') label = `<button class="grp-toggle" data-action="toggle-grupo" data-g="${r.gid}" aria-expanded="${!UI.colapsados[r.gid]}">${icon('down', 14)}${esc(r.label)}</button>${grpBadge(r.auto, r.calc)}`;
    let tr = `<tr class="${cls}"><td class="lbl" title="${esc(r.label)}">${label}</td>`;
    r.vals.forEach((v, mi) => {
      const mk = M.months[mi];
      if (editable && r.kind === 'line' && !r.auto && !r.calc) {
        const closedAll = [0, 1, 2, 3].every((k) => M.closed[mi * 4 + k]);
        if (!closedAll) { tr += `<td class="c">${cellInput(`${r.id}|M:${mk}|p`, v ? v : null, rawNum(v), { label: `${r.label}, ${mLabel(mk)}, proyectado` })}</td>`; return; }
      }
      tr += td(v);
    });
    tr += td(r.total, ' mt');
    body += tr + '</tr>';
  }
  const nota = capa === 'eff'
    ? 'Real en semanas cerradas y proyección en el resto. Es la vista que alimenta el EERR proyectado y el balance.'
    : capa === 'real' ? 'Solo montos reales cargados y cobros registrados. El saldo acumula desde el saldo inicial del período.' : 'Proyección original de cada línea. Las cobranzas muestran los vencimientos de las cuentas por cobrar y el plan pendiente.';
  return `<div class="grid-wrap" data-scroll="flujo-mes"><table class="grid"><thead>${h}</thead><tbody>${body}</tbody></table></div><p class="small muted">${nota}</p>`;
}
/* =====================================================================
   Pantallas: ventas y cobranzas, compras y pagos (misma lógica de cartera)
   ===================================================================== */

function condicionTexto(v) {
  const n = (v.cuotas || []).length;
  if (v.origen === 'saldo_inicial') return 'Saldo inicial';
  const plazo = daysBetween(v.fecha, (v.cuotas[0] || {}).vence || v.fecha);
  if (n <= 1) return plazo <= 0 ? 'Contado' : `Crédito ${plazo} días`;
  return `${n} cuotas`;
}
function estadoChip(c, HOY, pagar) {
  if (c.estado === 'cobrado') return chip('good', pagar ? 'Pagado' : 'Cobrado');
  if (c.estado === 'vencido') return chip('crit', `Vencido ${daysBetween(c.cuotas.find((q) => q.monto - q.cobrado > 0.004 && q.vence < HOY)?.vence || HOY, HOY)} d`);
  if (c.cobrado > 0.004) return chip('info', pagar ? 'Pago parcial' : 'Cobro parcial');
  return chip('warn', pagar ? 'Por pagar' : 'Por cobrar');
}
/* Monto en la moneda del documento: con símbolo solo si no es la moneda base. */
const fmtDoc = (n, d, opts) => (d.moneda && d.moneda !== monedaBase() ? moneyIn(n, d.moneda, opts) : fmt(n, opts));
const netoDoc = (d) => d.monto || 0;
const totalDoc = (d) => sum((d.cuotas || []).map((q) => q.monto));

const CARTERA = {
  ventas: {
    titulo: 'Ventas y cobranzas', pagar: false,
    lede: 'Cada venta agenda su cobro en el flujo según la condición (contado, crédito o cuotas) y suma al EERR del mes. El IVA de la venta va a la liquidación mensual. Cada cobro pasa ese monto de proyectado a real.',
    docs: () => S.ventas, pagos: () => S.cobros, fk: 'ventaId', parte: 'clienteId', nombre: (id) => nombreCliente(id),

function viewCartera(M, key) {
  const K = CARTERA[key];
  const HOY = M.HOY;
  const lista = K.lista(M);
  const tab = K.tabs.some(([v]) => v === UI[K.tabKey]) ? UI[K.tabKey] : 'pend';
  const mesTxt = MES_LARGO[Number(M.curMonth.slice(5, 7)) - 1];
  const porSaldar = sum(lista.map((c) => Math.max(0, c.saldo) * c.f));
  const vencido = sum(lista.map((c) => c.vencido * c.f));
  const docById = new Map(K.docs().map((d) => [d.id, d]));
  const pagadoMes = sum(K.pagos().filter((p) => monthOf(p.fecha) === M.curMonth).map((p) => { const d = docById.get(p[K.fk]); return d ? p.monto * factorBase(d.moneda, p.tc || d.tc) : 0; }));
  const movMes = sum(K.docs().filter((d) => d.origen !== 'saldo_inicial' && monthOf(d.fecha) === M.curMonth).map((d) => netoDoc(d) * factorBase(d.moneda, d.tc)));
  const aging = [0, 0, 0, 0, 0];
  for (const c of lista) for (const q of c.cuotas) {
    const rem = q.monto - q.cobrado;
    if (rem <= 0.004) continue;
    const d = daysBetween(q.vence, HOY);
    aging[d <= 0 ? 0 : d <= 30 ? 1 : d <= 60 ? 2 : d <= 90 ? 3 : 4] += rem * c.f;
  }
  const strip = `<div class="strip c4">
    <div><span class="lbl">${K.txt.pendiente}</span><span class="val">${money(porSaldar)}</span><span class="sub">${lista.filter((c) => c.saldo > 0.004).length} documentos pendientes</span></div>
    <div><span class="lbl">Vencido</span><span class="val${vencido > 0.5 ? ' neg' : ''}">${money(vencido)}</span><span class="sub">${vencido > 0.5 ? chip('crit', 'Requiere gestión') : chip('good', 'Al día')}</span></div>
    <div><span class="lbl">${K.txt.pagado} en ${esc(mesTxt)}</span><span class="val">${money(pagadoMes)}</span><span class="sub">${K.pagar ? 'Pagos' : 'Cobros'} registrados en el mes</span></div>
    <div><span class="lbl">${K.pagar ? 'Comprado' : 'Vendido'} en ${esc(mesTxt)}</span><span class="val">${money(movMes)}</span><span class="sub">Neto de IVA, en ${esc(S.empresa.simbolo)}</span></div>
  </div>`;
  const tools = `<button class="btn" data-action="${K.a.saldoIni}">${icon('plus', 15)}Saldo inicial de ${K.txt.parte.toLowerCase()}</button><button class="btn btn-primary" data-action="${K.a.nuevo}">${icon('plus', 15)}${K.txt.nuevo}</button>`;
  const f = norm(UI[K.filtroKey]);
  const pasa = (d) => !f || norm(K.nombre(d[K.parte])).includes(f) || norm(d.factura).includes(f) || norm(d.concepto || nombreProducto(d.productoId)).includes(f);
  let contenido = '';
  if (tab === 'pend') {
    const filas = lista.filter((c) => pasa(c.v) && (UI.verCobradas || c.saldo > 0.004))
      .sort((a, b) => (a.saldo > 0.004 ? 0 : 1) - (b.saldo > 0.004 ? 0 : 1) || (a.proximo || '9999').localeCompare(b.proximo || '9999'));
    const agingHtml = `<div class="toolbar small">${[['Por vencer', aging[0]], ['1–30 días', aging[1]], ['31–60 días', aging[2]], ['61–90 días', aging[3]], ['Más de 90 días', aging[4]]].map(([l, v], k) => `<span class="chip ${k > 0 && v > 0.5 ? 'chip-crit' : ''}">${esc(l)}: ${fmt(v)}</span>`).join('')}<span class="spacer"></span><label class="check small"><input type="checkbox" data-action="ver-cobradas" ${UI.verCobradas ? 'checked' : ''}> Mostrar documentos ${K.pagar ? 'pagados' : 'cobrados'}</label></div>`;
    contenido = agingHtml + (filas.length ? `<div class="tbl-wrap"><table class="list"><thead><tr><th>${K.txt.parte}</th><th>Documento</th><th>Emitido</th><th>Próx. vencimiento</th><th class="n">Total</th><th class="n">${K.txt.pagado}</th><th class="n">Saldo</th><th>Estado</th><th></th></tr></thead><tbody>${filas.map((c) => `<tr>
      <td class="wrap">${esc(K.nombre(c.v[K.parte]))}</td>
      <td>${esc(c.v.factura || '—')}${c.v.origen === 'saldo_inicial' ? ' <span class="muted small">(saldo inicial)</span>' : ''}</td>
      <td>${c.v.origen === 'saldo_inicial' ? '—' : fmtDate(c.v.fecha)}</td>
      <td>${c.proximo ? fmtDate(c.proximo) : '—'}${c.cuotas.length > 1 ? ` <span class="muted small">(${c.cuotas.filter((q) => q.monto - q.cobrado <= 0.004).length}/${c.cuotas.length} cuotas)</span>` : ''}</td>
      <td class="n">${fmtDoc(c.total, c.v)}</td><td class="n">${fmt(c.cobrado, { dash: true })}</td><td class="n"><b>${fmtDoc(c.saldo, c.v, { dash: true })}</b></td>
      <td>${estadoChip(c, HOY, K.pagar)}</td>
      <td class="act">${c.saldo > 0.004 ? `<button class="btn btn-sm" data-action="${K.a.pagar}" data-id="${c.v.id}">${icon('coin', 14)}${K.txt.verbo}</button>${!K.pagar ? `<button class="btn btn-sm btn-ghost" data-action="descontar" data-id="${c.v.id}" title="Descontar documento o cheque diferido">Descontar</button>` : ''}<button class="btn btn-sm btn-ghost" data-action="${K.a.reprogramar}" data-id="${c.v.id}" title="Cambiar vencimiento" aria-label="Cambiar vencimiento">${icon('calendar', 14)}</button>` : ''}<button class="btn btn-sm btn-ghost" data-action="${K.a.editar}" data-id="${c.v.id}" title="Editar" aria-label="Editar">${icon('edit', 14)}</button></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">No hay cuentas ${K.pagar ? 'por pagar' : 'por cobrar'}${f ? ' que coincidan con la búsqueda' : ' pendientes'}.</div>`);
  } else if (tab === 'docs') {
    const docs = K.docs().filter((d) => d.origen !== 'saldo_inicial' && pasa(d)).sort((a, b) => b.fecha.localeCompare(a.fecha));
    const head = K.pagar
      ? '<th>Fecha</th><th>Proveedor</th><th>Destino</th><th>Concepto</th><th class="n">Neto</th><th class="n">IVA</th><th class="n">Total</th><th>Condición</th><th>Descuenta de</th><th>Factura</th><th></th>'
      : '<th>Fecha</th><th>Cliente</th><th>Producto</th><th class="n">Cantidad</th><th class="n">Precio</th><th class="n">Neto</th><th class="n">IVA</th><th class="n">Total</th><th>Condición</th><th>Plan</th><th>Factura</th><th></th>';
    const lineaNombre = (id) => { const l = S.lineas.find((x) => x.id === id); return l ? l.nombre : ''; };
    contenido = docs.length ? `<div class="tbl-wrap"><table class="list"><thead><tr>${head}</tr></thead><tbody>${docs.map((d) => {
      const total = totalDoc(d), neto = netoDoc(d);
      const comunes = `<td class="n">${fmtDoc(neto, d)}</td><td class="n">${fmt(total - neto, { dash: true })}</td><td class="n"><b>${fmtDoc(total, d)}</b></td><td>${esc(condicionTexto(d))}</td>`;
      const acts = `<td class="act"><button class="btn btn-sm btn-ghost" data-action="${K.a.editar}" data-id="${d.id}" aria-label="Editar">${icon('edit', 14)}</button><button class="btn btn-sm btn-ghost btn-danger" data-action="${K.a.eliminar}" data-id="${d.id}" aria-label="Eliminar">${icon('trash', 14)}</button></td>`;
      if (K.pagar) return `<tr><td>${fmtDate(d.fecha)}</td><td class="wrap">${esc(nombreProveedor(d.proveedorId))}</td><td class="wrap">${esc(DESTINO_LABEL[d.destino] || DESTINO_LABEL.compra)}</td><td class="wrap">${esc(d.concepto || '—')}</td>${comunes}<td class="wrap">${d.lineaId ? esc(lineaNombre(d.lineaId)) : '<span class="muted">—</span>'}</td><td>${esc(d.factura || '—')}</td>${acts}</tr>`;
      return `<tr><td>${fmtDate(d.fecha)}</td><td class="wrap">${esc(nombreCliente(d.clienteId))}</td><td class="wrap">${esc(nombreProducto(d.productoId))}</td><td class="n">${isNum(d.cantidad) ? fmt(d.cantidad, { dec: Number.isInteger(d.cantidad) ? 0 : 2 }) : '—'}</td><td class="n">${isNum(d.precio) ? fmt(d.precio, { dec: Number.isInteger(d.precio) ? 0 : 2 }) : '—'}</td>${comunes}<td>${d.planMes ? esc(mLabel(d.planMes)) : '<span class="muted">No planificada</span>'}</td><td>${esc(d.factura || '—')}</td>${acts}</tr>`;
    }).join('')}</tbody></table></div>` : `<div class="empty">Todavía no hay ${K.pagar ? 'compras' : 'ventas'} registradas${f ? ' que coincidan con la búsqueda' : ''}. Usá «${K.txt.nuevo}».</div>`;
  } else if (tab === 'pagos') {
    const pagos = K.pagos().filter((p) => { const d = docById.get(p[K.fk]); return d && pasa(d); }).sort((a, b) => b.fecha.localeCompare(a.fecha));
    contenido = pagos.length ? `<div class="tbl-wrap"><table class="list"><thead><tr><th>Fecha</th><th>${K.txt.parte}</th><th>Documento</th><th class="n">Monto</th><th class="n">En ${esc(S.empresa.simbolo)}</th><th>Nota</th><th></th></tr></thead><tbody>${pagos.map((p) => { const d = docById.get(p[K.fk]); return `<tr><td>${fmtDate(p.fecha)}</td><td class="wrap">${esc(K.nombre(d[K.parte]))}</td><td>${esc(d.factura || '—')}</td><td class="n"><b>${fmtDoc(p.monto, d)}</b>${d.moneda && d.moneda !== monedaBase() ? ` <span class="muted small">TC ${fmt(p.tc || d.tc)}</span>` : ''}</td><td class="n">${fmt(p.monto * factorBase(d.moneda, p.tc || d.tc))}</td><td class="wrap">${p.costo ? `${chip('info', 'Descuento')} ${esc(p.entidad || '')} · costo ${fmtDoc(p.costo, d)}, neto ${fmtDoc(p.monto - p.costo, d)}${p.nota ? ` · ${esc(p.nota)}` : ''}` : esc(p.nota || '')}</td><td class="act"><button class="btn btn-sm btn-ghost btn-danger" data-action="${K.a.eliminarPago}" data-id="${p.id}" aria-label="Eliminar">${icon('trash', 14)}</button></td></tr>`; }).join('')}</tbody></table></div>` : `<div class="empty">No hay ${K.txt.pagos} registrados${f ? ' que coincidan con la búsqueda' : ''}.</div>`;
  } else {
    const comprasPor = groupBy(S.compras.filter((c) => c.origen !== 'saldo_inicial'), 'proveedorId');
    const saldoPor = new Map();
    for (const c of lista) saldoPor.set(c.v.proveedorId, (saldoPor.get(c.v.proveedorId) || 0) + Math.max(0, c.saldo) * c.f);
    const provs = S.proveedores.slice().sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    contenido = `<div class="toolbar"><p class="small muted" style="margin-right:auto">El plazo de pago del proveedor se propone al registrar sus compras.</p><button class="btn btn-primary" data-action="proveedor-nuevo">${icon('plus', 15)}Agregar proveedor</button></div>
    ${provs.length ? `<div class="tbl-wrap"><table class="list"><thead><tr><th>Proveedor</th><th>RUC</th><th class="n">Plazo de pago</th><th class="n">Compras registradas</th><th class="n">Por pagar</th><th></th></tr></thead><tbody>${provs.map((p) => `<tr><td class="wrap">${esc(p.nombre)}</td><td>${esc(p.ruc || '—')}</td><td class="n">${p.plazo ? `${p.plazo} días` : 'Contado'}</td><td class="n">${fmt(sum((comprasPor.get(p.id) || []).map((c) => netoDoc(c) * factorBase(c.moneda, c.tc))), { dash: true })}</td><td class="n">${fmt(saldoPor.get(p.id) || 0, { dash: true })}</td><td class="act"><button class="btn btn-sm btn-ghost" data-action="proveedor-editar" data-id="${p.id}" aria-label="Editar">${icon('edit', 14)}</button><button class="btn btn-sm btn-ghost btn-danger" data-action="proveedor-eliminar" data-id="${p.id}" aria-label="Eliminar">${icon('trash', 14)}</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No hay proveedores cargados.</div>'}`;
  }
  return `${pageHead(K.titulo, K.lede, tools)}
  ${strip}
  <section class="panel"><div class="panel-body" style="padding-top:12px">
    <div class="toolbar">${tabs(`tab-${key}`, tab, K.tabs)}<span class="spacer"></span>${tab !== 'prov' ? `<input type="text" id="${K.buscarId}" placeholder="Buscar ${K.txt.parte.toLowerCase()}, concepto o factura" value="${esc(UI[K.filtroKey])}" style="max-width:280px" aria-label="Buscar">` : ''}</div>
    ${contenido}
  </div></section>`;
}
const viewVentas = (M) => viewCartera(M, 'ventas');
const viewCompras = (M) => viewCartera(M, 'compras');

/* ---------- Plan comercial ---------- */
function planMesesVisibles(M) {
  if (UI.planAnio === 'todos') return M.months;
  const ms = M.months.filter((m) => m.startsWith(UI.planAnio));
  return ms.length ? ms : M.months;
}
function viewPlan(M) {
  const anios = Array.from(new Set(M.months.map((m) => m.slice(0, 4))));
  let contenido = '';
  if (UI.planTab === 'plan') {
    const ms = planMesesVisibles(M);
    const mis = ms.map((m) => M.cal.midx.get(m));
    const verMonto = UI.planVer === 'monto';
    const tools = `<div class="toolbar">${seg('plan-anio', UI.planAnio, [['todos', 'Todo el período'], ...anios.map((a) => [a, a])])}${seg('plan-ver', UI.planVer, [['cant', 'Cantidades'], ['monto', `Montos (${S.empresa.simbolo})`]])}<span class="spacer"></span><button class="btn btn-primary" data-action="plan-linea-nueva">${icon('plus', 15)}Agregar línea al plan</button></div>`;
    const filas = M.planFilas.slice().sort((a, b) => nombreCliente(a.p.clienteId).localeCompare(nombreCliente(b.p.clienteId), 'es') || nombreProducto(a.p.productoId).localeCompare(nombreProducto(b.p.productoId), 'es'));
    let body = '';
    for (const f of filas) {

      const prod = p.productoId ? S.productos.find((x) => x.id === p.productoId) : null;
      let tr = `<tr><td class="lbl"><div style="display:flex;flex-direction:column;gap:2px"><span>${esc(nombreCliente(p.clienteId))}</span><span class="muted small">${esc(nombreProducto(p.productoId))} · ${fmt(p.precio, { dec: Number.isInteger(p.precio) ? 0 : 2 })}${prod && prod.unidad ? ` por ${esc(prod.unidad)}` : ''} · ${p.plazo ? `${p.plazo} días` : 'contado'}${Number(p.iva) ? ` · IVA ${fmt(p.iva)} %` : ''}</span></div></td>`;
      for (const mi of mis) {
        const mk = M.months[mi];
        if (verMonto) tr += `<td>${f.monto[mi] ? fmt(f.monto[mi]) : '<span class="muted">–</span>'}</td>`;
        else { const q = Number(p.cant[mk]) || 0; tr += `<td style="padding:2px 4px"><input class="plan-in" type="text" inputmode="decimal" data-plan="${p.id}|${mk}" data-fk="plan|${p.id}|${mk}" value="${q ? esc(fmt(q, { dec: Number.isInteger(q) ? 0 : 2 })) : ''}" data-raw="${esc(rawNum(q || null))}" aria-label="${esc(nombreCliente(p.clienteId))}, ${esc(mLabel(mk))}, cantidad"></td>`; }
      }
      const totQ = sum(mis.map((mi) => Number(p.cant[M.months[mi]]) || 0)), totM = sum(mis.map((mi) => f.monto[mi]));
      tr += `<td class="yr"><b>${verMonto ? fmt(totM) : fmt(totQ, { dec: Number.isInteger(totQ) ? 0 : 2 })}</b></td><td class="act"><button class="btn btn-sm btn-ghost" data-action="plan-linea-editar" data-id="${p.id}" aria-label="Editar línea">${icon('edit', 14)}</button><button class="btn btn-sm btn-ghost btn-danger" data-action="plan-linea-eliminar" data-id="${p.id}" aria-label="Eliminar línea">${icon('trash', 14)}</button></td></tr>`;
      body += tr;
    }
    const tot = (arr) => `${mis.map((mi) => `<td>${fmt(arr[mi], { dash: true })}</td>`).join('')}<td class="yr">${fmt(sum(mis.map((mi) => arr[mi])), { dash: true })}</td><td></td>`;
    const cum = mis.map((mi) => (M.pptoVentas[mi] > 0.5 ? M.ventasReal[mi] / M.pptoVentas[mi] : null));
    const foot = `<tr class="sub"><td class="lbl">Presupuesto de ventas (${esc(S.empresa.simbolo)})</td>${tot(M.pptoVentas)}</tr><tr><td class="lbl">Vendido</td>${tot(M.ventasReal)}</tr><tr><td class="lbl">Pendiente del plan</td>${tot(M.pendVentas)}</tr><tr class="pct"><td class="lbl">Cumplimiento</td>${cum.map((c) => `<td>${c == null ? '–' : fmtPct(c, 0)}</td>`).join('')}<td class="yr">${(() => { const a = sum(mis.map((mi) => M.pptoVentas[mi])); return a > 0.5 ? fmtPct(sum(mis.map((mi) => M.ventasReal[mi])) / a, 0) : '–'; })()}</td><td></td></tr>`;
    const head = `<tr><th class="lbl">Cliente · producto · precio · plazo</th>${ms.map((m) => `<th class="${m === M.curMonth ? 'cur' : ''}">${esc(mLabel(m))}</th>`).join('')}<th class="yr">Total</th><th></th></tr>`;
    contenido = `${tools}${filas.length ? `<div class="tbl-wrap" data-scroll="plan"><table class="rep"><thead>${head}</thead><tbody>${body}${foot}</tbody></table></div>` : `<div class="empty">El plan está vacío. Agregá una línea por cliente y producto con su precio y plazo de cobro, y cargá las cantidades por mes.</div>`}
    <p class="small muted">La venta de cada mes se proyecta repartida en las cuatro semanas y su cobro se agenda según el plazo de la línea. Cuando se registra una venta del cliente, descuenta lo pendiente del plan de ese mes (primero el mismo producto).</p>`;
  } else if (UI.planTab === 'avance') {
    const filas = M.months.map((m, mi) => ({ m, mi, ppto: M.eerr.ppto.ventas[mi], real: M.ventasReal[mi], pend: M.pendVentas[mi] }));
    const anioSel = anios.includes(UI.planAnio) ? UI.planAnio : (anios.includes(M.curMonth.slice(0, 4)) ? M.curMonth.slice(0, 4) : anios[0]);
    const misA = M.months.map((m, i) => [m, i]).filter(([m]) => m.startsWith(anioSel)).map(([, i]) => i);
    const cli = [];
    for (const [cid, x] of M.ventasCliMes) {

    cli.sort((a, b) => b.pp + b.re - (a.pp + a.re));
    contenido = `<section class="panel" style="border:0"><div class="panel-head" style="padding-left:0;padding-right:0"><div><h2>Presupuesto contra vendido</h2><div class="sub">El presupuesto sale del plan comercial${S.presupuesto ? ` aprobado el ${fmtDate(S.presupuesto.fecha)}` : ''}</div></div><button class="btn btn-sm btn-ghost" data-action="tabla-toggle" data-t="ch-avance">${icon('table', 14)}Ver tabla</button></div>${chartVentas(M, 'ch-avance')}</section>
    <div class="cols">
      <div class="tbl-wrap"><table class="list"><thead><tr><th>Mes</th><th class="n">Presupuesto</th><th class="n">Vendido</th><th class="n">Pendiente</th><th class="n">Proyección</th><th class="n">Cumplimiento</th></tr></thead><tbody>${filas.map((r) => `<tr><td>${esc(mLabel(r.m))}${r.m === M.curMonth ? ' ' + chip('info', 'Actual') : ''}</td><td class="n">${fmt(r.ppto, { dash: true })}</td><td class="n">${fmt(r.real, { dash: true })}</td><td class="n">${fmt(r.pend, { dash: true })}</td><td class="n"><b>${fmt(r.real + r.pend, { dash: true })}</b></td><td class="n">${r.ppto > 0.5 ? fmtPct(r.real / r.ppto, 0) : '–'}</td></tr>`).join('')}</tbody></table></div>
      <div class="panel" style="border:0;gap:8px"><div class="toolbar"><h2 style="margin-right:auto">Por cliente</h2>${seg('plan-anio', anioSel, anios.map((a) => [a, a]))}</div>

    </div>`;
  } else if (UI.planTab === 'clientes') {
    const ventasPor = groupBy(S.ventas.filter((v) => v.origen !== 'saldo_inicial'), 'clienteId');
    const saldoPor = new Map();
    for (const c of M.cuentas) saldoPor.set(c.v.clienteId, (saldoPor.get(c.v.clienteId) || 0) + Math.max(0, c.saldo) * c.f);
    const lista = S.clientes.slice().sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    contenido = `<div class="toolbar"><p class="small muted" style="margin-right:auto">El plazo de cobro del cliente se propone al registrar sus ventas y al agregarlo al plan.</p><button class="btn btn-primary" data-action="cliente-nuevo">${icon('plus', 15)}Agregar cliente</button></div>
    ${lista.length ? `<div class="tbl-wrap"><table class="list"><thead><tr><th>Cliente</th><th>RUC</th><th class="n">Plazo de cobro</th><th class="n">Ventas registradas</th><th class="n">Por cobrar</th><th></th></tr></thead><tbody>${lista.map((c) => `<tr><td class="wrap">${esc(c.nombre)}</td><td>${esc(c.ruc || '—')}</td><td class="n">${c.plazo ? `${c.plazo} días` : 'Contado'}</td><td class="n">${fmt(sum((ventasPor.get(c.id) || []).map((v) => v.monto)), { dash: true })}</td><td class="n">${fmt(saldoPor.get(c.id) || 0, { dash: true })}</td><td class="act"><button class="btn btn-sm btn-ghost" data-action="cliente-editar" data-id="${c.id}" aria-label="Editar">${icon('edit', 14)}</button><button class="btn btn-sm btn-ghost" data-action="cliente-unificar" data-id="${c.id}">Unificar</button><button class="btn btn-sm btn-ghost btn-danger" data-action="cliente-eliminar" data-id="${c.id}" aria-label="Eliminar">${icon('trash', 14)}</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No hay clientes cargados.</div>'}`;
  } else {
    const lista = S.productos.slice().sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    contenido = `<div class="toolbar"><p class="small muted" style="margin-right:auto">El costo unitario define el costo de ventas del EERR y el consumo de inventario del balance. Sin costo, se usa ${fmt(S.config.costoPct)} % de la venta.</p><button class="btn btn-primary" data-action="producto-nuevo">${icon('plus', 15)}Agregar producto</button></div>
    ${lista.length ? `<div class="tbl-wrap"><table class="list"><thead><tr><th>Producto</th><th>Unidad</th><th class="n">Precio de lista</th><th class="n">Costo unitario</th><th class="n">Margen</th><th></th></tr></thead><tbody>${lista.map((p) => `<tr><td class="wrap">${esc(p.nombre)}</td><td>${esc(p.unidad || '—')}</td><td class="n">${fmt(p.precio, { dec: Number.isInteger(p.precio) ? 0 : 2 })}</td><td class="n">${isNum(p.costo) && p.costo > 0 ? fmt(p.costo, { dec: Number.isInteger(p.costo) ? 0 : 2 }) : '<span class="muted">Sin cargar</span>'}</td><td class="n">${p.precio > 0 && p.costo > 0 ? fmtPct((p.precio - p.costo) / p.precio) : '–'}</td><td class="act"><button class="btn btn-sm btn-ghost" data-action="producto-editar" data-id="${p.id}" aria-label="Editar">${icon('edit', 14)}</button><button class="btn btn-sm btn-ghost btn-danger" data-action="producto-eliminar" data-id="${p.id}" aria-label="Eliminar">${icon('trash', 14)}</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No hay productos cargados. Las ventas y el plan pueden cargarse sin producto (monto global).</div>'}`;
  }
  return `${pageHead('Plan comercial', 'Presupuesto de ventas por cliente y producto: cantidades por mes, precio y plazo de cobro. Alimenta las ventas proyectadas del flujo y el presupuesto del EERR.')}
  <section class="panel"><div class="panel-body" style="padding-top:12px">${tabs('plan-tab', UI.planTab, [['plan', 'Plan de ventas'], ['avance', 'Avance contra lo vendido'], ['clientes', 'Clientes'], ['productos', 'Productos']])}${contenido}</div></section>`;
}
/* =====================================================================
   Pantallas: presupuesto EERR, balance proyectado y configuración
   ===================================================================== */

function columnasConAnios(M) {
  // Meses con subtotal al final de cada año calendario.
  const out = [];
  let anio = null, acc = [];
  M.months.forEach((m, mi) => {
    const y = m.slice(0, 4);
    if (anio && y !== anio) { out.push({ tipo: 'anio', anio, idx: acc }); acc = []; }
    anio = y; acc.push(mi);
    out.push({ tipo: 'mes', mi, m });
  });
  if (acc.length) out.push({ tipo: 'anio', anio, idx: acc });
  return out;
}

function eerrDetalle(M, r, vista) {
  const capa = vista === 'ppto' ? 'proj' : vista === 'real' ? 'real' : 'eff';
  if (r.detalle === 'ventas') {
    const rows = [];
    for (const [cid, x] of M.ventasCliMes) {
      const vals = vista === 'ppto' ? x.ppto : vista === 'real' ? x.real : x.real.map((v, i) => v + x.pend[i]);
      if (hasAny(vals)) rows.push({ label: nombreCliente(cid), vals });
    }
    return rows.sort((a, b) => sum(b.vals) - sum(a.vals));
  }
  const signo = r.detalle === 'otros_ingresos' ? 1 : -1;
  const out = M.lines.filter((x) => x.tipo === r.detalle).map((x) => ({ label: `${x.l.nombre}`, vals: M.lineaMes.get(x.l.id)[capa].map((v) => v * signo) })).filter((d) => hasAny(d.vals));
  if (vista !== 'ppto' && M.compraDest[r.detalle] && hasAny(M.compraDest[r.detalle])) out.push({ label: 'Compras registradas', vals: M.compraDest[r.detalle].map((v) => -v) });
  return out;
}

function viewEERR(M) {
  const vista = UI.eerrVista;
  const aprobado = !!S.presupuesto;
  const estado = aprobado ? `${chip('good', `Presupuesto aprobado el ${fmtDate(S.presupuesto.fecha)}`)} <button class="btn btn-sm" data-action="ppto-borrador">Volver a borrador</button>` : `${chip('warn', 'Presupuesto en borrador')} <button class="btn btn-sm" data-action="ppto-aprobar">Aprobar presupuesto</button>`;
  const tools = `${seg('eerr-vista', vista, [['proy', 'Proyección'], ['ppto', 'Presupuesto'], ['real', 'Real'], ['comp', 'Comparativo']])}`;
  const lede = 'Ventas y costo de ventas salen del plan comercial y de las ventas registradas. Los gastos salen de las líneas del flujo según su tipo (base caja); la compra de materia prima va a inventario y el costo se reconoce al vender. La depreciación y el IRE se calculan.';
  const vistaTxt = {
    proy: 'Real de las semanas cerradas y ventas registradas, más la proyección de lo que falta. Se actualiza con cada venta.',
    ppto: aprobado ? 'Presupuesto aprobado: queda fijo para comparar contra la proyección.' : 'Borrador: sigue los cambios del plan comercial y de la proyección del flujo hasta que se aprueba.',
    real: 'Solo lo registrado: ventas, costo de esas ventas y montos reales del flujo.',
    comp: 'Presupuesto contra real y proyección del período elegido.',
  }[vista];
  let tabla = '';
  if (vista !== 'comp') {
    const e = M.eerr[vista];
    const cols = columnasConAnios(M);
    const head = `<tr><th class="lbl">Concepto</th>${cols.map((c) => (c.tipo === 'mes' ? `<th class="${c.m === M.curMonth ? 'cur' : ''}">${esc(mLabel(c.m))}</th>` : `<th class="yr">Total ${c.anio}</th>`)).join('')}<th class="yr">Total período</th></tr>`;
    const celdas = (vals, isPct, total) => cols.map((c) => {
      if (c.tipo === 'mes') { const v = vals[c.mi]; return isPct ? `<td>${v == null ? '–' : fmtPct(v)}</td>` : `<td>${fmt(v, { dash: true, paren: true })}</td>`; }
      if (isPct) return `<td class="yr">–</td>`;
      return `<td class="yr">${fmt(sum(c.idx.map((i) => vals[i])), { dash: true, paren: true })}</td>`;
    }).join('') + (isPct ? `<td class="yr">${total == null ? '–' : fmtPct(total)}</td>` : `<td class="yr">${fmt(total, { dash: true, paren: true })}</td>`);
    let body = '';
    for (const r of eerrRows(M, e)) {
      const cls = r.kind === 'sub' ? 'sub' : r.kind === 'big' ? 'big' : r.kind === 'pct' ? 'pct' : '';
      const puedeDetalle = r.detalle && !(vista === 'ppto' && aprobado);
      const abierto = puedeDetalle && UI.eerrDetalle[r.key];
      const label = puedeDetalle ? `<button class="grp-toggle" data-action="eerr-det" data-k="${r.key}" aria-expanded="${!!abierto}">${icon('down', 14)}${esc(r.label)}</button>` : esc(r.label);
      body += `<tr class="${cls}"><td class="lbl">${label}</td>${celdas(r.vals, r.kind === 'pct', r.total)}</tr>`;
      if (abierto) for (const d of eerrDetalle(M, r, vista)) body += `<tr class="det"><td class="lbl" title="${esc(d.label)}">${esc(d.label)}</td>${celdas(d.vals, false, sum(d.vals))}</tr>`;
    }
    tabla = `<div class="tbl-wrap" data-scroll="eerr"><table class="rep"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  } else {
    const anios = Array.from(new Set(M.months.map((m) => m.slice(0, 4))));
    const opciones = [['todo', 'Todo el período'], ...anios.map((a) => [`a${a}`, `Año ${a}`]), ...M.months.map((m) => [`m${m}`, mLabel(m, true)])];
    if (!UI.eerrComp || !opciones.some(([v]) => v === UI.eerrComp)) UI.eerrComp = anios.includes(M.curMonth.slice(0, 4)) ? `a${M.curMonth.slice(0, 4)}` : 'todo';
    const sel = UI.eerrComp;
    const idx = sel === 'todo' ? M.months.map((m, i) => i) : sel[0] === 'a' ? M.months.map((m, i) => [m, i]).filter(([m]) => m.startsWith(sel.slice(1))).map(([, i]) => i) : [M.cal.midx.get(sel.slice(1))];
    const tot = (vals) => sum(idx.map((i) => vals[i] || 0));
    const rp = eerrRows(M, M.eerr.ppto), rr = eerrRows(M, M.eerr.real), ry = eerrRows(M, M.eerr.proy);
    const ventasP = tot(M.eerr.ppto.ventas), ventasR = tot(M.eerr.real.ventas), ventasY = tot(M.eerr.proy.ventas);
    let body = '';
    rp.forEach((r, k) => {
      if (r.kind === 'pct') {
        const base = { mb: 'ub', mebitda: 'ebitda', mn: 'rn' }[r.key];
        const f = (rows, v) => { const x = rows.find((z) => z.key === base); return v > 0.5 ? tot(x.vals) / v : null; };
        body += `<tr class="pct"><td class="lbl">${esc(r.label)}</td><td>${fmtPct(f(rp, ventasP))}</td><td>${fmtPct(f(rr, ventasR))}</td><td>${fmtPct(f(ry, ventasY))}</td><td></td><td></td></tr>`;
        return;
      }
      const p = tot(r.vals), re = tot(rr[k].vals), y = tot(ry[k].vals);
      const dv = y - p;
      const favorable = dv >= 0;
      const cls = r.kind === 'sub' ? 'sub' : r.kind === 'big' ? 'big' : '';
      body += `<tr class="${cls}"><td class="lbl">${esc(r.label)}</td><td>${fmt(p, { dash: true, paren: true })}</td><td>${fmt(re, { dash: true, paren: true })}</td><td><b>${fmt(y, { dash: true, paren: true })}</b></td><td class="${Math.abs(dv) > 0.5 ? (favorable ? 'pos' : 'neg') : ''}">${fmt(dv, { dash: true, sign: true })}</td><td>${Math.abs(p) > 0.5 && Math.abs(dv) > 0.5 ? fmtPct(dv / Math.abs(p)) : '–'}</td></tr>`;
    });
    tabla = `<div class="toolbar"><label for="eerr-comp" class="small ink2">Período</label><select id="eerr-comp" style="max-width:260px">${opciones.map(([v, l]) => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
    <div class="tbl-wrap"><table class="rep"><thead><tr><th class="lbl">Concepto</th><th>Presupuesto</th><th>Real</th><th>Proyección</th><th>Variación proy. − ppto.</th><th>Variación %</th></tr></thead><tbody>${body}</tbody></table></div>
    <p class="small muted">Variación positiva = mejor que el presupuesto (más ingresos o menos gastos). Los gastos se muestran entre paréntesis.</p>`;
  }
  return `${pageHead('Presupuesto EERR', lede, tools)}
  <div class="toolbar">${estado}<span class="spacer"></span><span class="small ink2">${esc(vistaTxt)}</span></div>
  ${tabla}`;
}

function viewBalance(M) {
  const rows = balanceRows(M);
  const dif = M.balMes.length ? M.balMes[M.balMes.length - 1].dif : 0;
  const cuadra = Math.abs(M.balIni.dif) < 1 && Math.abs(dif) < 1;
  const estado = cuadra ? chip('good', 'Activo = pasivo + patrimonio en todos los meses') : chip('crit', `Diferencia ${fmt(M.balIni.dif)} desde el balance inicial`);
  const tools = `<button class="btn" data-action="balance-editar">${icon('edit', 15)}Balance inicial</button>`;
  const head = `<tr><th class="lbl">Rubro</th><th class="yr">Inicial<br><span class="muted" style="font-weight:500">${fmtDate(addDays(M.cal.start, -1))}</span></th>${M.months.map((m) => `<th class="${m === M.curMonth ? 'cur' : ''}">${esc(mLabel(m))}</th>`).join('')}</tr>`;
  let body = '';
  for (const r of rows) {
    if (r.kind === 'head') { body += `<tr class="head"><td class="lbl">${esc(r.label)}</td><td colspan="${M.nM + 1}"></td></tr>`; continue; }
    const cls = r.kind === 'sub' ? 'sub' : r.kind === 'big' ? 'big' : r.kind === 'tot' ? 'tot' : '';
    const cell = (v, k) => {
      if (r.kind === 'ratio') return `<td class="${k === 0 ? 'yr' : ''}">${v == null ? '–' : fmt(v, { dec: 2 })}</td>`;
      if (r.kind === 'check') return `<td class="${k === 0 ? 'yr' : ''}">${Math.abs(v) < 1 ? '<span class="muted">0</span>' : `<b class="neg">${fmt(v)}</b>`}</td>`;
      return `<td class="${k === 0 ? 'yr' : ''}${v < -0.5 ? ' neg' : ''}">${fmt(v, { dash: true })}</td>`;
    };
    body += `<tr class="${cls}"><td class="lbl"${r.fuente ? ` title="${esc(r.fuente)}"` : ''}>${esc(r.label)}${r.fuente ? `<div class="muted small" style="font-weight:400">${esc(r.fuente)}</div>` : ''}</td>${r.vals.map(cell).join('')}</tr>`;
  }
  return `${pageHead('Balance proyectado', 'Balance al cierre de cada mes, armado con el flujo (real + proyección), las cuentas por cobrar y el EERR proyectado. Estructura base: se puede adaptar al formato de balance de la empresa.', tools)}
  <div class="toolbar">${estado}<span class="spacer"></span><span class="small ink2">Préstamos: la porción corriente son las amortizaciones de capital previstas en los 12 meses siguientes.</span></div>
  <div class="tbl-wrap" data-scroll="balance"><table class="rep"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

  } else if (tab === 'estructura') {

const SISTEMAS = { frances: 'Francés (cuota fija)', aleman: 'Alemán (capital fijo)', final: 'Al vencimiento (capital al final)' };
const FRECUENCIAS = { 1: 'Mensual', 3: 'Trimestral', 6: 'Semestral', 12: 'Anual' };

function viewPrestamos(M) {
  const HOY = M.HOY;
  const tools = `<button class="btn btn-primary" data-action="prestamo-nuevo">${icon('plus', 15)}Agregar préstamo</button>`;
  const info = M.prestamosInfo;
  const saldoA = (x, fecha) => Math.max(0, (Number(x.p.monto) || 0) - sum(x.cr.filter((q) => q.fecha <= fecha).map((q) => q.capital)));
  const totalHoy = sum(info.filter((x) => x.p.fecha <= HOY).map((x) => saldoA(x, HOY) * x.f));
  const cuotasMes = sum(info.flatMap((x) => x.cr.filter((q) => monthOf(q.fecha) === M.curMonth).map((q) => (q.capital + q.interes) * x.f)));
  const intAnio = sum(info.flatMap((x) => x.cr.filter((q) => q.fecha.startsWith(M.curMonth.slice(0, 4))).map((q) => q.interes * x.f)));
  const strip = `<div class="strip">
    <div><span class="lbl">Deuda de préstamos hoy</span><span class="val">${money(totalHoy)}</span><span class="sub">${info.length} ${info.length === 1 ? 'préstamo' : 'préstamos'} con cronograma</span></div>
    <div><span class="lbl">Cuotas de ${esc(MES_LARGO[Number(M.curMonth.slice(5, 7)) - 1])}</span><span class="val">${money(cuotasMes)}</span><span class="sub">Capital + intereses</span></div>
    <div><span class="lbl">Intereses ${esc(M.curMonth.slice(0, 4))}</span><span class="val">${money(intAnio)}</span><span class="sub">Van al EERR como gastos financieros</span></div>
  </div>`;
  let lista = '<div class="empty">No hay préstamos cargados. Agregá cada préstamo con su monto, tasa y cantidad de cuotas: el cronograma genera solo las cuotas de capital e intereses en el flujo, el EERR y el balance.</div>';
  if (info.length) {
    lista = `<div class="tbl-wrap"><table class="list"><thead><tr><th>Préstamo</th><th>Desembolso</th><th class="n">Monto</th><th class="n">Tasa anual</th><th>Cuotas</th><th>Sistema</th><th class="n">Saldo hoy</th><th>Próxima cuota</th><th></th></tr></thead><tbody>${info.map((x) => {
      const p = x.p;
      const prox = x.cr.find((q) => q.fecha >= HOY);
      const mon = p.moneda || monedaBase();
      return `<tr><td class="wrap"><b>${esc(p.nombre || 'Préstamo')}</b>${p.entidad ? `<div class="muted small">${esc(p.entidad)}</div>` : ''}</td><td>${fmtDate(p.fecha)}</td><td class="n">${moneyIn(p.monto, mon)}</td><td class="n">${fmt(p.tasa, { dec: 2 })} %</td><td>${p.cuotas} · ${esc((FRECUENCIAS[p.frecuencia] || `cada ${p.frecuencia} meses`).toLowerCase())}${p.gracia ? ` · ${p.gracia} de gracia` : ''}</td><td>${esc(SISTEMAS[p.sistema] || SISTEMAS.frances)}</td><td class="n"><b>${moneyIn(p.fecha <= HOY ? saldoA(x, HOY) : 0, mon)}</b></td><td>${prox ? `${fmtDate(prox.fecha)} · ${moneyIn(prox.capital + prox.interes, mon)}` : '<span class="muted">Cancelado</span>'}</td><td class="act"><button class="btn btn-sm" data-action="prestamo-ver" data-id="${p.id}">Cronograma</button><button class="btn btn-sm btn-ghost" data-action="prestamo-editar" data-id="${p.id}" aria-label="Editar">${icon('edit', 14)}</button><button class="btn btn-sm btn-ghost btn-danger" data-action="prestamo-eliminar" data-id="${p.id}" aria-label="Eliminar">${icon('trash', 14)}</button></td></tr>`;
    }).join('')}</tbody></table></div>`;
  }
  const sel = info.find((x) => x.p.id === UI.prestamoSel) || info[0];
  let crono = '';
  if (sel) {
    const mon = sel.p.moneda || monedaBase();
    crono = `<section class="panel"><div class="panel-head"><div><h2>Cronograma · ${esc(sel.p.nombre || 'Préstamo')}</h2><div class="sub">${esc(SISTEMAS[sel.p.sistema] || SISTEMAS.frances)} · montos en ${esc(MONEDAS[mon])}. Las filas dentro del período aparecen en el flujo; el pago real se carga en la columna Real o al cerrar la semana.</div></div></div><div class="panel-body"><div class="tbl-wrap" style="max-height:420px"><table class="list"><thead><tr><th>Cuota</th><th>Vence</th><th class="n">Capital</th><th class="n">Intereses</th><th class="n">Cuota total</th><th class="n">Saldo</th><th></th></tr></thead><tbody>${sel.cr.map((q) => `<tr><td>${q.n}</td><td>${fmtDate(q.fecha)}</td><td class="n">${fmt(q.capital)}</td><td class="n">${fmt(q.interes)}</td><td class="n"><b>${fmt(q.capital + q.interes)}</b></td><td class="n">${fmt(q.saldo)}</td><td>${q.fecha < HOY ? chip('good', 'Vencida') : q.fecha < M.cal.start || q.fecha > M.cal.end ? '<span class="muted small">Fuera del período</span>' : ''}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2"><b>Total</b></td><td class="n"><b>${fmt(sum(sel.cr.map((q) => q.capital)))}</b></td><td class="n"><b>${fmt(sum(sel.cr.map((q) => q.interes)))}</b></td><td class="n"><b>${fmt(sum(sel.cr.map((q) => q.capital + q.interes)))}</b></td><td></td><td></td></tr></tfoot></table></div></div></section>`;
  }
  return `${pageHead('Préstamos', 'Cada préstamo genera su cronograma de cuotas. El desembolso entra al flujo si ocurre dentro del período; las cuotas de capital bajan la deuda del balance y los intereses van al EERR. Un préstamo anterior al período entra al balance inicial por su saldo pendiente.', tools)}
  ${strip}${lista}${crono}`;
}

/* ---------- Escenarios ---------- */
function viewEscenarios(M) {
  const act = S.escenarios.activo;
  const res = {};
  for (const k of Object.keys(ESCENARIOS)) res[k] = k === M.esc.k ? M : compute(S, { escenario: k });
  const anio = M.curMonth.slice(0, 4);
  const idxAnio = M.months.map((m, i) => [m, i]).filter(([m]) => m.startsWith(anio)).map(([, i]) => i);
  const met = (R) => {
    const f = R.saldo.eff.fin;
    let mi = -1;
    for (let i = Math.min(R.curC, R.nW - 1); i < R.nW; i++) if (mi < 0 || f[i] < f[mi]) mi = i;
    return {
      ventas: sum(R.ventasProy), ventasAnio: sum(idxAnio.map((i) => R.ventasProy[i])),
      rn: sum(R.eerr.proy.rn), rnAnio: sum(idxAnio.map((i) => R.eerr.proy.rn[i])),
      min: mi >= 0 ? f[mi] : null, minW: mi >= 0 ? weekLabel(R.weeks[mi]) : '', fin: f[R.nW - 1],
      cxc: R.balMes[R.nM - 1].cxc, semNeg: f.slice(R.curC).filter((v) => v < -0.5).length,
    };
  };
  const m = {}; for (const k of Object.keys(res)) m[k] = met(res[k]);
  const campo = (k, c) => `<input type="text" inputmode="decimal" class="money" style="width:84px" data-esc="${k}.${c}" value="${esc(rawNum(S.escenarios[k][c]))}" aria-label="${esc(ESCENARIOS[k])} ${c}">`;
  const params = `<div class="tbl-wrap"><table class="list"><thead><tr><th>Supuesto</th><th>Base</th><th>Optimista</th><th>Pesimista</th></tr></thead><tbody>
    <tr><td class="wrap">Volumen de lo que falta vender (%)</td><td>0</td><td>${campo('opt', 'vol')}</td><td>${campo('pes', 'vol')}</td></tr>
    <tr><td class="wrap">Precio de lo que falta vender (%)</td><td>0</td><td>${campo('opt', 'precio')}</td><td>${campo('pes', 'precio')}</td></tr>
    <tr><td class="wrap">Días de cobro de lo pendiente (+ más tarde, − antes)</td><td>0</td><td>${campo('opt', 'dias')}</td><td>${campo('pes', 'dias')}</td></tr>
  </tbody></table></div>`;
  const fila = (label, f, cls = '') => `<tr><td class="wrap">${label}</td>${Object.keys(ESCENARIOS).map((k) => { const v = f(m[k]); return `<td class="n ${cls}${typeof v === 'number' && v < -0.5 ? ' neg' : ''}${k === act ? ' sel' : ''}">${typeof v === 'number' ? fmt(v) : v}</td>`; }).join('')}</tr>`;
  const comp = `<div class="tbl-wrap"><table class="list"><thead><tr><th>Resultado (${esc(S.empresa.simbolo)})</th>${Object.entries(ESCENARIOS).map(([k, l]) => `<th class="n${k === act ? ' sel' : ''}">${esc(l)}${k === act ? ' · en uso' : ''}</th>`).join('')}</tr></thead><tbody>
    ${fila(`Ventas ${anio}`, (x) => x.ventasAnio)}
    ${fila('Ventas del período', (x) => x.ventas)}
    ${fila(`Resultado neto ${anio}`, (x) => x.rnAnio)}
    ${fila('Resultado neto del período', (x) => x.rn)}
    ${fila('Saldo de caja mínimo desde hoy', (x) => x.min)}
    ${fila('Semana del saldo mínimo', (x) => x.minW)}
    ${fila('Semanas con saldo negativo', (x) => String(x.semNeg))}
    ${fila(`Saldo de caja al ${fmtDate(M.cal.end)}`, (x) => x.fin)}
    ${fila('Cuentas por cobrar al cierre', (x) => x.cxc)}
  </tbody></table></div>`;
  const series = [
    { k: 'base', label: 'Base', color: 'var(--chart-1)', vals: res.base.saldo.eff.fin },
    { k: 'opt', label: 'Optimista', color: 'var(--s-opt)', vals: res.opt.saldo.eff.fin },
    { k: 'pes', label: 'Pesimista', color: 'var(--s-pes)', vals: res.pes.saldo.eff.fin },
  ];
  return `${pageHead('Escenarios', 'Compará cómo cambian la caja y el resultado si lo que falta vender del plan cambia en volumen o precio, o si los clientes pagan antes o después. Los gastos proyectados y lo ya registrado no cambian.', seg('escenario-activo', act, Object.entries(ESCENARIOS)))}
  <div class="inline-note">El escenario <b>${esc(ESCENARIOS[act])}</b> es el que se usa en el tablero, el flujo, el EERR y el balance. Cambialo con los botones de arriba.</div>
  <div class="cols">
    <section class="panel"><div class="panel-head"><h2>Supuestos</h2></div><div class="panel-body">${params}</div></section>
    <section class="panel"><div class="panel-head"><h2>Resultados</h2></div><div class="panel-body">${comp}</div></section>
  </div>
  <section class="panel"><div class="panel-head"><div><h2>Saldo de caja semanal por escenario</h2><div class="sub">Real en semanas cerradas y proyección en el resto</div></div></div><div class="panel-body">${chartLineas(M, 'ch-esc', series)}</div></section>`;
}

/* Gráfico de líneas para comparar series semanales (hasta tres). */
function chartLineas(M, id, series) {
  const W = 1100, H = 280, ml = 58, mr = 18, mt = 16, mb = 30;
  const n = M.nW;
  const all = series.flatMap((s) => s.vals);
  const { lo, hi, ticks } = niceTicks(Math.min(0, ...all), Math.max(0, ...all), 4);
  const x = (i) => ml + (n <= 1 ? 0 : (i * (W - ml - mr)) / (n - 1));
  const y = (v) => mt + ((hi - v) * (H - mt - mb)) / (hi - lo || 1);
  let g = '';
  for (const t of ticks) g += `<line x1="${ml}" x2="${W - mr}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="${t === 0 ? 'var(--chart-axis)' : 'var(--chart-grid)'}" stroke-width="1"/><text x="${ml - 8}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end">${fmtCompact(t)}</text>`;
  const step = n > 52 ? 12 : n > 26 ? 8 : 4;
  M.weeks.forEach((w, i) => { if (w.i === 1 && (i / 4) % (step / 4) === 0) g += `<text x="${x(i).toFixed(1)}" y="${H - 10}">${mLabelShort(w.m)}</text>`; });
  if (M.cur >= 0 && M.cur < n) g += `<line x1="${x(M.cur).toFixed(1)}" x2="${x(M.cur).toFixed(1)}" y1="${mt}" y2="${H - mb}" stroke="var(--ink-2)" stroke-width="1"/><text x="${(x(M.cur) + 4).toFixed(1)}" y="${H - mb - 6}" class="lab">hoy</text>`;
  for (const s of series) g += `<path d="${s.vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  g += `<g class="hover" visibility="hidden"><line class="hx" y1="${mt}" y2="${H - mb}" stroke="var(--ink-2)" stroke-width="1"/></g><rect class="hit" x="${ml}" y="${mt}" width="${W - ml - mr}" height="${H - mt - mb}" fill="transparent"/>`;
  CHARTS.set(id, { type: 'lineas', W, H, x, n, series, M });
  const legend = `<div class="legend">${series.map((s) => `<span><i class="line" style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')}</div>`;
  return `${legend}<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo de caja semanal por escenario">${g}</svg><div class="tip" hidden></div></div>`;
}

        ${filaT('Compras registradas', x.comprasReg)}

      <div class="tbl-wrap"><table class="rep"><thead><tr><th class="lbl">Toneladas</th>${colsHead}</tr></thead><tbody>
        ${filaT('Ventas (registradas + plan)', x.venta)}

      </tbody></table></div></section>`).join('') + '<p class="small muted">El costo de materia prima usa el costo promedio de cada insumo en el mes y es el que toma el EERR como costo de ventas de estos productos. La conversión (energía, mano de obra, envase) se paga con las líneas del flujo: para verla dentro del margen bruto, poné esas líneas con el tipo «Costo de producción».</p>';

    ${lista.length ? `<div class="tbl-wrap"><table class="list"><thead><tr><th>Insumo</th><th class="n">Precio / t</th><th>Proveedor</th><th class="n">Plazo</th><th class="n">IVA</th><th class="n">Stock inicial (t)</th><th class="n">Stock mínimo (t)</th><th class="n">Anticipo de compra</th><th></th></tr></thead><tbody>${lista.map((i) => `<tr><td class="wrap">${esc(i.nombre)}</td><td class="n">${fmt(i.precio, { dec: 2 })}</td><td class="wrap">${i.proveedorId ? esc(nombreProveedor(i.proveedorId)) : '<span class="muted">—</span>'}</td><td class="n">${i.plazo || 0} días</td><td class="n">${fmt(i.iva || 0)} %</td><td class="n">${fmtT(Number(i.stockInicial) || 0)}</td><td class="n">${fmtT(Number(i.stockMin) || 0)}</td><td class="n">${i.anticipo ? `${i.anticipo} ${i.anticipo === 1 ? 'mes' : 'meses'}` : 'Mismo mes'}</td><td class="act"><button class="btn btn-sm btn-ghost" data-action="insumo-editar" data-id="${i.id}" aria-label="Editar">${icon('edit', 14)}</button><button class="btn btn-sm btn-ghost btn-danger" data-action="insumo-eliminar" data-id="${i.id}" aria-label="Eliminar">${icon('trash', 14)}</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No hay insumos cargados.</div>'}`;

    ${prods.length ? `<div class="tbl-wrap"><table class="list"><thead><tr><th>Producto</th><th>Receta (t de insumo por t)</th><th class="n">Conversión / t</th><th class="n">Costo total / t</th><th class="n">Precio / t</th><th class="n">Margen</th><th class="n">Stock inicial (t)</th><th></th></tr></thead><tbody>${prods.map((p) => { const c = tieneReceta(p) ? costoEstandar(p, M.insById) : null; return `<tr><td class="wrap">${esc(p.nombre)}</td><td class="wrap">${tieneReceta(p) ? p.receta.filter((r) => r.insumoId && r.t > 0).map((r) => `${esc(nombreInsumo(r.insumoId))} ${fmt(r.t, { dec: 3 })}`).join(' · ') : '<span class="muted">Sin receta</span>'}</td><td class="n">${fmt(p.conversion || 0, { dash: true })}</td><td class="n">${c != null ? fmt(c, { dec: 2 }) : '–'}</td><td class="n">${fmt(p.precio)}</td><td class="n">${c != null && p.precio > 0 ? fmtPct((p.precio - c) / p.precio) : '–'}</td><td class="n">${fmtT(Number(p.stockInicial) || 0)}</td><td class="act"><button class="btn btn-sm" data-action="receta-editar" data-id="${p.id}">Editar receta</button></td></tr>`; }).join('')}</tbody></table></div>` : '<div class="empty">Primero cargá los productos en Plan comercial → Productos.</div>'}`;
  }
  const manualesMP = M.lines.filter((x) => x.tipo === 'compra' && !x.calc && x.proj.some((v, i) => i >= M.curC * 1 && v > 0.5));
  const aviso = conReceta.length && manualesMP.length ? `<div class="inline-note">${chip('warn', 'Revisar')} Hay ${manualesMP.length} líneas manuales de compras con proyección futura en el flujo (por ejemplo «${esc(manualesMP[0].l.nombre)}»). Si esas compras ya las calcula la receta, borrá su proyección para no contarlas dos veces.</div>` : '';
  return `${pageHead('Producción y stock', 'Con la receta de cada producto y el plan comercial, calcula en toneladas cuánto producir, cuánta materia prima consumir y cuánto comprar cada mes, con su costo promedio.', `<label class="small ink2" for="cfg-adelanto">Producir con anticipación de</label><select id="cfg-adelanto" data-cfg="config.prodAdelanto" style="width:auto">${[0, 1, 2, 3].map((n) => `<option value="${n}" ${Number(S.config.prodAdelanto || 0) === n ? 'selected' : ''}>${n === 0 ? 'mismo mes de la venta' : `${n} ${n === 1 ? 'mes' : 'meses'}`}</option>`).join('')}</select>`)}
