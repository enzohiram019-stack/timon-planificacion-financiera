let xlsxPromise = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (xlsxPromise) return xlsxPromise;
  xlsxPromise = new Promise((resolve, reject) => {
    const tryUrl = (k) => {
      if (k >= APP.xlsxUrls.length) { xlsxPromise = null; reject(new Error('No se pudo cargar el lector de Excel. Revisá la conexión a internet e intentá de nuevo.')); return; }
      const s = document.createElement('script');
      s.src = APP.xlsxUrls[k];
      s.async = true;
      s.onload = () => (window.XLSX ? resolve(window.XLSX) : tryUrl(k + 1));
      s.onerror = () => { s.remove(); tryUrl(k + 1); };
      document.head.appendChild(s);
    };
    tryUrl(0);
  });
  return xlsxPromise;
}

/* ---------- lectura de la planilla ---------- */
const MES_IDX = {
  ene: 1, enero: 1, jan: 1, feb: 2, febrero: 2, mar: 3, marzo: 3, abr: 4, abril: 4, apr: 4, may: 5, mayo: 5, jun: 6, junio: 6,
  jul: 7, julio: 7, ago: 8, agosto: 8, aug: 8, sep: 9, set: 9, sept: 9, septiembre: 9, setiembre: 9, oct: 10, octubre: 10,
  nov: 11, noviembre: 11, dic: 12, diciembre: 12, dec: 12,
};

function leerHoja(XLSX, ws, nombre) {
  if (!ws || !ws['!ref']) return null;
  const ref = XLSX.utils.decode_range(ws['!ref']);
  const cell = (r, c) => ws[XLSX.utils.encode_cell({ r, c })];
  const text = (r, c) => { const x = cell(r, c); return x && x.v != null ? String(x.v).trim() : ''; };
  let year = null;
  for (let r = ref.s.r; r <= Math.min(ref.e.r, ref.s.r + 5) && !year; r++) {
    for (let c = 0; c <= Math.min(ref.e.c, 3) && !year; c++) { const m = /(20\d\d)/.exec(text(r, c)); if (m) year = Number(m[1]); }
  }
  if (!year) { const m = /(20\d\d)/.exec(nombre); if (m) year = Number(m[1]); }
  let hdr = -1, cols = [];
  for (let r = ref.s.r; r <= Math.min(ref.e.r, ref.s.r + 10) && hdr < 0; r++) {
    const found = [];
    for (let c = 1; c <= ref.e.c; c++) {
      const t = norm(text(r, c)).split(' ')[0];
      if (MES_IDX[t]) found.push({ c, m: MES_IDX[t] });
    }
    if (found.length >= 2) { hdr = r; cols = found; }
  }
  if (hdr < 0 || !year) return null;
  let y = year, prev = 0;
  for (const col of cols) { if (col.m < prev) y++; prev = col.m; col.mk = `${y}-${pad(col.m)}`; }
  const rows = [];
  for (let r = hdr + 1; r <= ref.e.r; r++) {
    const label = text(r, 0);
    if (!label) continue;
    const vals = {}, forms = {};
    for (const col of cols) {
      const x = cell(r, col.c);
      vals[col.mk] = x && typeof x.v === 'number' && Number.isFinite(x.v) ? x.v : 0;
      forms[col.mk] = x && x.f ? String(x.f) : '';
    }
    rows.push({ r, label: label.replace(/\s+/g, ' '), n: norm(label), vals, forms });
  }
  return { nombre, year, cols, rows, months: cols.map((c) => c.mk) };
}

const GRUPO_ACENTOS = [[/\bamortizacion/g, 'amortización'], [/\binversion(es)?\b/g, (m) => m.replace('inversion', 'inversión').replace('inversiónes', 'inversiones')], [/\bprestamo/g, 'préstamo'], [/\bcomercializacion/g, 'comercialización'], [/\bviaticos/g, 'viáticos'], [/\bconsumicion/g, 'consumición'], [/\bcapital operativo/g, 'capital operativo']];
function nombreGrupo(label) {
  let s = label.trim().replace(/\s+/g, ' ').toLowerCase();
  for (const [re, rep] of GRUPO_ACENTOS) s = s.replace(re, rep);
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function tipoGrupoEgreso(n) {
  if (/materia prima|insumo|mercader|compra|envase|stock/.test(n)) return 'compra';
  if (/inversion|activo fijo|maquinaria|horno|equipo/.test(n)) return 'inversion';
  if (/impuesto|ire\b|iva\b/.test(n)) return 'impuesto';
  if (/retiro|dividendo/.test(n)) return 'retiro';
  if (/comision|venta|comercial|flete/.test(n)) return 'gasto_comercial';
  if (/produccion|fabrica|planta/.test(n)) return 'costo_produccion';
  return 'gasto_admin';
}
function tipoLineaGasto(n, tipoGrupo) {
  if (!['gasto_comercial', 'gasto_admin', 'costo_produccion'].includes(tipoGrupo)) return tipoGrupo;
  if (/comision|viatico|combustible|flete|venta|comercial|publicidad|marketing/.test(n)) return 'gasto_comercial';
  if (/salario|sueldo|honorario|consumicion|desarrollo|insumo|alquiler|servicio|oficina|operativ/.test(n)) return 'gasto_admin';
  return tipoGrupo;
}
function claveCliente(nombre) {
  return norm(nombre).replace(/\b(s a|sa|s r l|srl|e a s|eas|ltda|unipersonal|y cia|cia|s a e c a|saeca)\b/g, ' ').replace(/\s+/g, ' ').trim();
}

/* Estructura de una hoja: grupos (filas con SUMA), subtotales, y líneas de detalle. */
function estructuraHoja(h) {
  const rowNum = new Map(h.rows.map((x) => [x.r, x]));
  const info = new Map();
  for (const row of h.rows) {
    const cnt = new Map();
    let refsRow = null;
    for (const mk of h.months) {
      const f = (row.forms[mk] || '').replace(/\s+/g, '').replace(/^\+/, '');
      const m = /^SUM\(\$?[A-Z]+\$?(\d+):\$?[A-Z]+\$?(\d+)\)/i.exec(f);
      if (m) { const k = `${Number(m[1]) - 1}:${Number(m[2]) - 1}`; cnt.set(k, (cnt.get(k) || 0) + 1); continue; }
      if (!refsRow && /^[A-Z]+\d+([+-]\+?[A-Z]+\d+)+$/i.test(f)) refsRow = f.split(/[+-]\+?/).map((t) => Number(t.replace(/^[A-Z]+/i, '')) - 1);
    }
    let best = null;
    for (const [k, v] of cnt) if (!best || v > best[1]) best = [k, v];
    const n = row.n;
    let kind = 'leaf';
    if (/^saldo inicial/.test(n)) kind = 'saldo';
    else if (n === 'ingresos') kind = 'sec-ing';
    else if (n === 'egresos') kind = 'sec-egr';
    else if (/^amortizaciones? (de )?financiamientos?$|^financiamientos?$|^amortizaciones financiamientos/.test(n)) kind = 'sec-fin';
    else if (/^total|^flujo de caja|^flujo neto|^saldo final|^flujo economico|^flujo financiero/.test(n)) kind = 'total';
    else if (best) kind = 'group';
    else if (refsRow) kind = 'refs';
    const i = { row, kind };
    if (best) { const [a, b] = best[0].split(':').map(Number); i.a = a; i.b = b; }
    if (refsRow) i.refs = refsRow;
    info.set(row.r, i);
  }
  // Filas que suman grupos (p. ej. "MATERIA PRIMA E INSUMOS" = Materia prima + Insumos) son contenedores.
  for (const i of info.values()) {
    if (i.kind === 'refs' && i.refs.every((r) => info.get(r) && info.get(r).kind === 'group')) i.kind = 'super';
  }
  let sec = null;
  const out = [];
  for (const row of h.rows) {
    const i = info.get(row.r);
    if (i.kind === 'sec-ing') { sec = 'ing'; continue; }
    if (i.kind === 'sec-egr') { sec = 'egr'; continue; }
    if (i.kind === 'sec-fin') { sec = 'fin'; continue; }
    i.sec = sec;
    out.push(i);
  }
  const groups = out.filter((i) => i.kind === 'group');
  for (const i of out) {
    if (i.kind !== 'leaf' && i.kind !== 'refs') continue;
    i.kind = 'leaf';
    let parent = null;
    const r = i.row.r;
    for (const g of groups) if (r >= g.a && r <= g.b && (!parent || g.b - g.a < parent.b - parent.a)) parent = g;
    i.parent = parent;
  }
  return { items: out, rowNum };
}

function leerPlanillaFlujo(XLSX, wb) {
  const hojas = [];
  for (const nombre of wb.SheetNames) {
    const h = leerHoja(XLSX, wb.Sheets[nombre], nombre);
    if (h && h.rows.length > 5) hojas.push(h);
  }
  if (!hojas.length) throw new Error('No encontré una hoja con meses en columnas (ene, feb, mar…) y conceptos en la columna A.');
  hojas.sort((a, b) => a.months[0].localeCompare(b.months[0]));
  const entradas = new Map();   // clave -> {sec, grupo, tipoGrupo, auto, linea, tipo, vals, forms}
  const ajustes = [];
  let saldoInicial = null, saldoFinalPlanilla = null, mesFinal = null;
  const mesesSet = new Set();
  for (const h of hojas) {
    h.months.forEach((m) => mesesSet.add(m));
    const { items } = estructuraHoja(h);
    for (const i of items) {
      if (i.kind === 'saldo' && saldoInicial == null) saldoInicial = i.row.vals[h.months[0]] || 0;
      if (i.kind === 'total' && /^flujo de caja financiero|^saldo final|^flujo financiero/.test(i.row.n)) {
        const last = h.months[h.months.length - 1];
        if (!mesFinal || last >= mesFinal) { mesFinal = last; saldoFinalPlanilla = i.row.vals[last]; }
      }
    }
    const grupoDe = (g, sec) => {
      const n = g.row.n;
      if (sec === 'ing' && /deudas? (a|por) cobrar|cuentas (a|por) cobrar|cobranza/.test(n)) return { nombre: 'Deudas a cobrar', auto: 'cxc' };
      if (sec === 'ing' && /ventas?/.test(n)) return { nombre: 'Ventas proyectadas', auto: 'plan' };
      if (sec === 'ing') return { nombre: nombreGrupo(g.row.label), tipo: /prestamo|credito|descuento/.test(n) ? 'prestamo' : 'otros_ingresos' };
      if (sec === 'fin') return { nombre: nombreGrupo(g.row.label), tipo: /interes/.test(n) ? 'interes' : 'amortizacion' };
      return { nombre: nombreGrupo(g.row.label), tipo: tipoGrupoEgreso(n) };
    };
    const agregar = (sec, gi, lineaLabel, tipo, vals, forms) => {
      const clave = `${sec}|${norm(gi.nombre)}|${norm(lineaLabel)}`;
      if (!entradas.has(clave)) entradas.set(clave, { sec, grupo: gi.nombre, auto: gi.auto || null, tipoGrupo: gi.tipo || null, linea: lineaLabel, tipo, vals: {}, forms: {} });
      const e = entradas.get(clave);
      for (const mk of Object.keys(vals)) { e.vals[mk] = (e.vals[mk] || 0) + (vals[mk] || 0); if (forms && forms[mk]) e.forms[mk] = forms[mk]; }
    };
    for (const i of items) {
      if (!i.sec) continue;
      if (i.kind === 'leaf') {
        const label = i.row.label;
        let gi;
        if (i.parent) gi = grupoDe(i.parent, i.sec);
        else if (i.sec === 'ing') gi = /prestamo|credito|descuento/.test(i.row.n) ? { nombre: 'Préstamos recibidos', tipo: 'prestamo' } : { nombre: 'Otros ingresos', tipo: 'otros_ingresos' };
        else if (i.sec === 'fin') gi = { nombre: 'Otros financiamientos', tipo: /interes/.test(i.row.n) ? 'interes' : 'amortizacion' };
        else gi = { nombre: nombreGrupo(label), tipo: tipoGrupoEgreso(i.row.n) };
        const tipo = gi.auto ? null : i.sec === 'egr' ? tipoLineaGasto(i.row.n, gi.tipo) : gi.tipo;
        agregar(i.sec, gi, label, tipo, i.row.vals, i.row.forms);
      }
    }
    // Diferencias entre el total de un grupo y la suma de su detalle (montos cargados directo en el total).
    for (const g of items.filter((x) => x.kind === 'group' && x.sec)) {
      const hijos = items.filter((x) => x.kind === 'leaf' && x.parent === g);
      const gi = grupoDe(g, g.sec);
      const dif = {};
      let hay = false;
      for (const mk of h.months) {
        const d = r6((g.row.vals[mk] || 0) - sum(hijos.map((x) => x.row.vals[mk] || 0)));
        if (Math.abs(d) > 0.005) { dif[mk] = d; hay = true; ajustes.push({ grupo: gi.nombre, mes: mk, monto: d }); }
      }
      if (hay) {
        const label = gi.auto ? 'Sin detalle de cliente' : `${gi.nombre} (sin detalle)`;
        agregar(g.sec, gi, label, gi.auto ? null : gi.tipo, dif, {});
      }
    }
  }
  const meses = Array.from(mesesSet).sort();
  return { hojas: hojas.map((h) => h.nombre), meses, entradas: Array.from(entradas.values()), ajustes, saldoInicial: saldoInicial || 0, saldoFinalPlanilla, mesFinal };
}

/* Cantidad × precio a partir de una fórmula simple de la planilla (p. ej. "99*650"). */
function cantidadPrecio(f, v) {
  const m = /^\+?\(?\s*(\d+(?:\.\d+)?)\s*\*\s*(\d+(?:\.\d+)?)\s*\)?$/.exec(String(f || '').replace(/\s+/g, ''));
  if (m) {
    const a = Number(m[1]), b = Number(m[2]);
    if (Math.abs(a * b - v) < 0.01) return { cant: a, precio: b };
  }
  return null;
}

function construirDesdePlanilla(pl, opts) {
  const st = emptyState();
  const primer = pl.meses[0], ultimo = pl.meses[pl.meses.length - 1];
  st.meta = { origen: 'excel', archivo: opts.archivo || '', importado: hoy(), creado: hoy(), notas: [] };
  st.empresa = { nombre: opts.nombre || 'Mi empresa', simbolo: opts.simbolo || 'US$', tc: opts.tc || 6000 };
  st.periodo = { inicio: primer, meses: monthDiff(primer, ultimo) + 1 };
  st.config.saldoInicial = r6(pl.saldoInicial);
  st.config.hoy = S && S.config && S.config.hoy ? S.config.hoy : '';
  const corte = opts.realAntesDe || '0000-00';
  const vence = (mk) => (opts.diaCobro === '15' ? `${mk}-15` : monthEnd(mk));
  const cal = buildCalendar(st.periodo);
  st.grupos = [
    { id: 'g_cxc', sec: 'ing', nombre: 'Deudas a cobrar', tipo: null, auto: 'cxc' },
    { id: 'g_plan', sec: 'ing', nombre: 'Ventas proyectadas', tipo: null, auto: 'plan' },
  ];
  st.lineas = [];
  const grupoId = new Map();
  const clientes = new Map();
  const cliente = (nombre) => {
    const k = claveCliente(nombre) || norm(nombre);
    if (!clientes.has(k)) { const c = { id: uid('c'), nombre: nombre.trim(), plazo: 0, ruc: '', nota: '' }; clientes.set(k, c); st.clientes.push(c); }
    return clientes.get(k);
  };
  const orden = { ing: 0, egr: 1, fin: 2 };
  const entradas = pl.entradas.slice().sort((a, b) => orden[a.sec] - orden[b.sec]);
  const res = { lineas: 0, cuentas: 0, montoCxc: 0, cobradasImport: 0, planFilas: 0, montoPlan: 0, ventasPasadas: 0 };
  const dia0 = addDays(cal.start, -1);
  for (const e of entradas) {
    if (e.auto === 'cxc') {
      const c = cliente(e.linea);
      for (const mk of Object.keys(e.vals).sort()) {
        const v = r6(e.vals[mk]);
        if (Math.abs(v) < 0.000001) continue;
        if (v < 0) { ajusteNegativo(e, mk, v); continue; }
        const venta = { id: uid('v'), origen: 'saldo_inicial', fecha: dia0, clienteId: c.id, productoId: null, cantidad: null, precio: null, costoUnit: null, monto: v, cuotas: [{ vence: vence(mk), monto: v }], factura: 'Saldo inicial', planMes: null, nota: `Deuda a cobrar de la planilla (${mLabel(mk)})` };
        st.ventas.push(venta);
        res.cuentas++; res.montoCxc += v;
        if (mk < corte) { st.cobros.push({ id: uid('cb'), ventaId: venta.id, fecha: vence(mk), monto: v, nota: 'Cobrado según planilla' }); res.cobradasImport += v; }
      }
      continue;
    }
    if (e.auto === 'plan') {
      const c = cliente(e.linea);
      for (const mk of Object.keys(e.vals).sort()) {
        const v = r6(e.vals[mk]);
        if (Math.abs(v) < 0.000001) continue;
        if (v < 0) { ajusteNegativo(e, mk, v); continue; }
        const cp = cantidadPrecio(e.forms[mk], v) || { cant: v, precio: 1 };
        let fila = st.plan.find((p) => p.clienteId === c.id && !p.productoId && p.precio === cp.precio && p.plazo === 0);
        if (!fila) { fila = { id: uid('pl'), clienteId: c.id, productoId: null, precio: cp.precio, plazo: 0, cant: {} }; st.plan.push(fila); res.planFilas++; }
        fila.cant[mk] = r6((fila.cant[mk] || 0) + cp.cant);
        res.montoPlan += v;
        if (mk < corte) {
          const fecha = vence(mk);
          const venta = { id: uid('v'), origen: 'venta', fecha, clienteId: c.id, productoId: null, cantidad: cp.cant, precio: cp.precio, costoUnit: null, monto: v, cuotas: [{ vence: fecha, monto: v }], factura: '', planMes: mk, nota: 'Venta de la planilla' };
          st.ventas.push(venta);
          st.cobros.push({ id: uid('cb'), ventaId: venta.id, fecha, monto: v, nota: 'Cobrado según planilla' });
          res.ventasPasadas += v;
        }
      }
      continue;
    }
    const l = lineaPara(e.sec, e.grupo, e.tipoGrupo, e.linea, e.tipo);
    for (const mk of Object.keys(e.vals).sort()) cargarMes(l.id, mk, e.vals[mk]);
  }
  function lineaPara(sec, grupo, tipoGrupo, nombre, tipo) {
    const kg = `${sec}|${norm(grupo)}`;
    if (!grupoId.has(kg)) {
      const g = { id: uid('g'), sec, nombre: grupo, tipo: tipoValido(tipoGrupo, sec) };
      st.grupos.push(g); grupoId.set(kg, g.id);
    }
    const gid = grupoId.get(kg);
    let l = st.lineas.find((x) => x.grupoId === gid && norm(x.nombre) === norm(nombre));
    if (!l) { l = { id: uid('l'), grupoId: gid, nombre: nombre.trim(), tipo: tipoValido(tipo || tipoGrupo, sec) }; st.lineas.push(l); res.lineas++; }
    return l;
  }
  function cargarMes(lineaId, mk, v) {
    v = r6(v || 0);
    if (!v || !cal.midx.has(mk)) return;
    distribuir(v, opts.dist || 'eq').forEach((x, k) => {
      if (!x) return;
      const wk = `${mk}#${k + 1}`;
      const prev = (st.valores[lineaId] && st.valores[lineaId][wk] && st.valores[lineaId][wk].p) || 0;
      setValor(st, lineaId, wk, 'p', prev + x);
      if (mk < corte) setValor(st, lineaId, wk, 'r', prev + x);
    });
  }
  function ajusteNegativo(e, mk, v) {
    const l = lineaPara('ing', 'Otros ingresos', 'otros_ingresos', `Ajuste de cobranzas (${e.linea})`, 'otros_ingresos');
    cargarMes(l.id, mk, v);
  }
  for (const w of cal.weeks) if (w.m < corte) st.cerradas[w.key] = true;
  // Balance inicial estimado: deuda financiera = amortizaciones previstas en el período.
  const amort = sum(st.lineas.filter((l) => l.tipo === 'amortizacion').map((l) => sum(Object.values(st.valores[l.id] || {}).map((c) => c.p || 0))));
  st.balanceInicial = emptyBalance();
  st.balanceInicial.prestamos = r6(amort);
  const ar0 = sum(st.ventas.filter((v) => v.origen === 'saldo_inicial').map((v) => v.monto));
  st.balanceInicial.resultadosAcumulados = r6(st.config.saldoInicial + ar0 - st.balanceInicial.prestamos);
  st.meta.notas = [
    'Las «Deudas a cobrar» se cargaron como saldo inicial de cuentas por cobrar, con vencimiento ' + (opts.diaCobro === '15' ? 'el día 15' : 'el último día') + ' de cada mes.',
    'Las «Ventas proyectadas» se cargaron en el plan comercial (cantidad × precio cuando la celda tenía esa fórmula).',
    'El balance inicial es estimado: la deuda financiera es la suma de amortizaciones del período y el patrimonio se ajustó para cuadrar.',
  ];
  if (pl.ajustes.length) st.meta.notas.push(`Se agregaron líneas «sin detalle» donde el total de un grupo no coincidía con la suma de su detalle (${pl.ajustes.map((a) => `${a.grupo} ${mLabel(a.mes)}: ${fmt(a.monto, { dec: 2 })}`).join('; ')}).`);
  res.clientes = st.clientes.length;
  res.meses = [primer, ultimo];
  res.saldoInicial = st.config.saldoInicial;
  res.saldoFinalPlanilla = pl.saldoFinalPlanilla;
  res.ajustes = pl.ajustes;
  res.hojas = pl.hojas;
  st.meta.resumen = res;
  return st;
}

/* ---------- respaldo JSON ---------- */
function slug(s) { return norm(s).replace(/\s+/g, '-').slice(0, 40) || 'empresa'; }
/* Descarga un archivo. Dentro del visor de Claude usa el permiso de descargas;
   publicado en Render o abierto como archivo, usa la descarga normal del navegador.
   Devuelve true si el archivo se entregó. */
async function descargar(nombre, contenido, tipo) {
  const blob = contenido instanceof Blob ? contenido : new Blob([contenido], { type: tipo || 'application/octet-stream' });
  const visor = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads').catch(() => null) : null;
  if (visor) {
    try { await visor.save({ filename: nombre, data: blob }); return true; } catch (e) {
      if (e && e.code === 'declined') toast('Descarga cancelada.');
      else if (e && e.code === 'rate_limited') toast('Ya hay una descarga esperando confirmación.', true);
      else toast('No se pudo descargar el archivo en esta vista.', true);
      return false;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}
function respaldoJSON() { return JSON.stringify({ app: 'timon-financiero', ...S }, null, 1); }
async function exportarJSON() {
  if (await descargar(`timon-${slug(S.empresa.nombre)}-${hoy()}.json`, respaldoJSON(), 'application/json')) toast('Respaldo descargado.');
}
function leerRespaldo(texto) {
  let o;
  try { o = JSON.parse(texto); } catch (e) { throw new Error('El archivo no es un JSON válido.'); }
  if (o && o.tipo === 'timon-respaldo-total') throw new Error(SERVIDOR ? 'Este es un respaldo total (todas las empresas y usuarios): restauralo desde el menú del usuario → Usuarios y empresas → Restaurar respaldo total.' : 'Este es un respaldo total del servidor: solo se puede restaurar en la versión con usuarios.');
  if (!o || typeof o !== 'object' || !Array.isArray(o.grupos) || !Array.isArray(o.lineas) || !o.periodo) throw new Error('El archivo no parece un respaldo de esta herramienta (faltan el período o la estructura del flujo).');
  delete o.app;
  return normalizeState(o);
}

      const x = ws[XLSX.utils.encode_cell({ r, c })];
      if (x && x.t === 'n') x.z = '#,##0';

const colL = (c) => { let s = ''; c += 1; while (c > 0) { const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = Math.floor((c - 1) / 26); } return s; };
const tipoDesdeTexto = (t, sec) => {
  const n = norm(t);
  if (!n) return null;
  for (const [k, v] of Object.entries(TIPO_CORTO)) if (norm(v) === n || norm(k) === n || norm(TIPOS[k].label) === n) return tipoValido(k, sec);
  return null;
};
const secDesdeTexto = (t) => { const n = norm(t); return n.startsWith('ing') ? 'ing' : n.startsWith('egr') ? 'egr' : n.startsWith('fin') ? 'fin' : null; };

async function descargarPlantilla(conDatos) {
  let XLSX;
  try { XLSX = await loadXLSX(); } catch (e) { toast(e.message, true); return; }
  const wb = construirPlantilla(XLSX, conDatos);
  const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  if (await descargar(`plantilla-${slug(S.empresa.nombre)}${conDatos ? '' : '-vacia'}.xlsx`, blob)) toast('Plantilla descargada.');
}

function construirPlantilla(XLSX, conDatos) {
  const M = model();
  const wb = XLSX.utils.book_new();
  const meses = M.months, semanas = M.weeks;
  const hoja = (nombre, filas, anchos, formatos) => {
    const ws = XLSX.utils.aoa_to_sheet(filas);
    const ref = XLSX.utils.decode_range(ws['!ref']);
    for (let r = 1; r <= ref.e.r; r++) for (let c = 0; c <= ref.e.c; c++) {
      const x = ws[XLSX.utils.encode_cell({ r, c })];
      if (x && x.t === 'n') x.z = formatos && formatos[c] ? formatos[c] : '#,##0.##';
    }
    ws['!cols'] = anchos;
    XLSX.utils.book_append_sheet(wb, ws, nombre);
    return ws;
  };
  // Instrucciones
  hoja('Instrucciones', [
    [PLANTILLA_MARCA], [],
    ['Cómo usar esta plantilla'],
    ['1. Completá las hojas de carga en este orden: Configuración, Clientes, Productos, Proveedores, Plan comercial, Flujo de caja, Gastos variables, Saldos iniciales, Préstamos, Balance inicial, Cuentas, Insumos y Recetas. Las que no uses pueden quedar vacías.'],
    ['2. No cambies los títulos de las columnas ni el nombre de las hojas. Podés agregar filas.'],
    ['3. Montos sin separador de miles o con formato numérico de Excel. Fechas como AAAA-MM-DD o con formato de fecha de Excel.'],
    ['4. En la herramienta: Datos y respaldos → Importar Excel. Podés reemplazar todo o actualizar plan y proyecciones sin perder ventas, compras ni reales.'],
    ['5. La hoja «Presupuesto EERR» se calcula sola con el plan comercial y el flujo de caja: no se importa.'], [],
    ['Flujo de caja'],
    ['Una fila por concepto. Sección: Ingresos, Egresos o Financiamiento. Grupo: agrupador del concepto (por ejemplo, Materia prima). Tipo: define su efecto en el EERR y el balance.'],
    ['Las columnas son semanas (S1 = días 1 a 7, S2 = 8 a 14, S3 = 15 a 21, S4 = 22 a fin de mes). También se aceptan columnas mensuales (por ejemplo «oct 2026»): el monto se reparte en las 4 semanas.'],
    ['Las cobranzas de clientes, los pagos a proveedores, las cuotas de préstamos y el IVA no se cargan acá: salen de las ventas, compras, préstamos y del plan comercial.'], [],
    ['Tipos válidos'],
    ...Object.entries(TIPO_CORTO).map(([k, v]) => [v, `${SECCIONES[TIPOS[k].dir === 'in' ? 'ing' : 'egr']}${TIPOS[k].dir === 'out' && (k === 'amortizacion' || k === 'interes') ? ' o Financiamiento' : ''}`, TIPOS[k].label]),
    [], ['Préstamos: Sistema = frances, aleman o final. Frecuencia en meses: 1, 3, 6 o 12. Gracia = cantidad de períodos en que solo se pagan intereses.'],
    ['Saldos iniciales: deudas de clientes (Tipo = Cobrar) y con proveedores (Tipo = Pagar) anteriores al primer mes.'],
    ['Gastos variables: conceptos de Egresos que son un porcentaje de las ventas (comisiones, fletes). Mes de pago 0 = fin del mismo mes, 1 = fin del mes siguiente. Su proyección se calcula sola: lo que tengan en «Flujo de caja» no se usa.'],
    ['Cuentas: caja y cuentas bancarias con su moneda y saldo al inicio, para la conciliación semanal.'],
    ['Insumos y Recetas: materias primas en toneladas y cuántas toneladas de cada una lleva una tonelada de producto. El plan comercial de esos productos tiene que estar en toneladas.'],
  ], [{ wch: 36 }, { wch: 28 }, { wch: 60 }]);
  // Configuración
  const get = (path) => { const [a, b] = path.split('.'); return S[a][b]; };
  hoja('Configuración', [['Campo', 'Valor'], ...CONFIG_FILAS.map(([l, p, t]) => [l, conDatos || t !== 'texto' || p === 'empresa.moneda' ? get(p) : ''])], [{ wch: 44 }, { wch: 20 }]);
  // Catálogos
  hoja('Clientes', [['Nombre', 'RUC', 'Plazo de cobro (días)'], ...(conDatos ? S.clientes.map((c) => [c.nombre, c.ruc || '', c.plazo || 0]) : [])], [{ wch: 40 }, { wch: 16 }, { wch: 20 }]);
  hoja('Productos', [['Nombre', 'Unidad', 'Precio sin IVA', 'Costo unitario', 'IVA %'], ...(conDatos ? S.productos.map((p) => [p.nombre, p.unidad || '', p.precio || 0, isNum(p.costo) ? p.costo : null, isNum(p.iva) ? p.iva : S.config.ivaVentas]) : [])], [{ wch: 36 }, { wch: 10 }, { wch: 14 }, { wch: 14 }, { wch: 8 }]);

  // Plan comercial

  const planRows = conDatos ? S.plan.map((p) => [nombreCliente(p.clienteId), p.productoId ? nombreProducto(p.productoId) : '', p.precio, p.plazo || 0, Number(p.iva) || 0, ...meses.map((m) => Number(p.cant[m]) || null)]) : [];

  }
  hoja('Flujo de caja', [flujoHead, ...flujoRows], [{ wch: 14 }, { wch: 28 }, { wch: 36 }, { wch: 22 }, ...semanas.map(() => ({ wch: 10 }))]);
  // Presupuesto EERR con fórmulas (y su valor calculado para que se vea al abrir)
  construirPresupuestoFormulas(XLSX, wb, meses, planRows, flujoRows);
  // Saldos iniciales
  const saldoRows = conDatos ? [
    ...S.ventas.filter((v) => v.origen === 'saldo_inicial').map((v) => ['Cobrar', nombreCliente(v.clienteId), v.factura || '', v.moneda || monedaBase(), v.tc || null, r2(totalDoc(v)), v.cuotas[0].vence]),
    ...S.compras.filter((c) => c.origen === 'saldo_inicial').map((c) => ['Pagar', nombreProveedor(c.proveedorId), c.factura || '', c.moneda || monedaBase(), c.tc || null, r2(totalDoc(c)), c.cuotas[0].vence]),
  ] : [];
  hoja('Saldos iniciales', [['Tipo (Cobrar o Pagar)', 'Cliente o proveedor', 'Documento', 'Moneda (USD o PYG)', 'Tipo de cambio', 'Monto', 'Vencimiento (AAAA-MM-DD)'], ...saldoRows], [{ wch: 20 }, { wch: 36 }, { wch: 18 }, { wch: 16 }, { wch: 14 }, { wch: 14 }, { wch: 22 }]);
  // Préstamos
  hoja('Préstamos', [['Nombre', 'Entidad', 'Moneda (USD o PYG)', 'Tipo de cambio', 'Monto', 'Fecha de desembolso (AAAA-MM-DD)', 'Tasa anual %', 'Cuotas', 'Frecuencia (meses)', 'Sistema (frances, aleman o final)', 'Gracia (períodos)'],
    ...(conDatos ? S.prestamos.map((p) => [p.nombre, p.entidad || '', p.moneda || monedaBase(), p.tc || null, p.monto, p.fecha, p.tasa, p.cuotas, p.frecuencia, p.sistema, p.gracia || 0]) : [])],
  [{ wch: 28 }, { wch: 20 }, { wch: 16 }, { wch: 14 }, { wch: 14 }, { wch: 26 }, { wch: 12 }, { wch: 8 }, { wch: 16 }, { wch: 26 }, { wch: 14 }]);
  // Balance inicial
  hoja('Balance inicial', [['Rubro', 'Monto', 'Nota'], ...BALANCE_FILAS.map(([l, k]) => [l, conDatos ? r2(S.balanceInicial[k] || 0) : 0, '']),
    [], ['La caja inicial es el «Saldo inicial de caja» de Configuración. Las cuentas por cobrar y por pagar salen de «Saldos iniciales» y los préstamos con cronograma de «Préstamos».']], [{ wch: 44 }, { wch: 16 }, { wch: 20 }]);
  // Gastos variables
  const varRows = conDatos ? S.lineas.filter((l) => Number(l.pctVentas) > 0).map((l) => { const g = S.grupos.find((x) => x.id === l.grupoId); return [g ? g.nombre : '', l.nombre, Number(l.pctVentas), Number(l.desfase) || 0]; }) : [];
  hoja('Gastos variables', [['Grupo', 'Concepto', '% de las ventas', 'Mes de pago (0 mismo, 1 siguiente)'], ...varRows], [{ wch: 28 }, { wch: 36 }, { wch: 16 }, { wch: 30 }]);
  // Cuentas
  hoja('Cuentas', [['Nombre', 'Moneda (USD o PYG)', 'Saldo inicial'], ...(conDatos ? (S.cuentas || []).map((c) => [c.nombre, c.moneda, c.saldoInicial]) : [])], [{ wch: 34 }, { wch: 18 }, { wch: 16 }]);
  // Insumos y recetas
  hoja('Insumos', [['Nombre', 'Precio por t sin IVA', 'IVA %', 'Proveedor', 'Plazo de pago (días)', 'Stock inicial (t)', 'Stock mínimo (t)', 'Anticipo de compra (meses)'],
    ...(conDatos ? (S.insumos || []).map((i) => [i.nombre, i.precio, Number(i.iva) || 0, i.proveedorId ? nombreProveedor(i.proveedorId) : '', i.plazo || 0, Number(i.stockInicial) || 0, Number(i.stockMin) || 0, Number(i.anticipo) || 0]) : [])],
  [{ wch: 30 }, { wch: 18 }, { wch: 8 }, { wch: 30 }, { wch: 18 }, { wch: 16 }, { wch: 16 }, { wch: 24 }]);
  const recRows = [];
  if (conDatos) for (const p of S.productos) if (tieneReceta(p)) p.receta.forEach((r, k) => recRows.push([p.nombre, nombreInsumo(r.insumoId), r.t, k === 0 ? Number(p.conversion) || 0 : null, k === 0 ? Number(p.stockInicial) || 0 : null]));
  hoja('Recetas', [['Producto', 'Insumo', 't de insumo por t de producto', 'Costo de conversión por t', 'Stock inicial del producto (t)'], ...recRows], [{ wch: 34 }, { wch: 30 }, { wch: 26 }, { wch: 24 }, { wch: 26 }], { 2: '#,##0.000' });
  return wb;
}

function construirPresupuestoFormulas(XLSX, wb, meses, planRows, flujoRows) {
  const nM = meses.length;
  const P = "'Plan comercial'", F = "'Flujo de caja'", C = "'Configuración'", PR = 'Productos';
  const cfgRow = (path) => CONFIG_FILAS.findIndex((x) => x[1] === path) + 2;
  const costoPct = `${C}!$B$${cfgRow('config.costoPct')}`, ire = `${C}!$B$${cfgRow('config.ire')}`, dep = `${C}!$B$${cfgRow('config.depMensual')}`, vida = `${C}!$B$${cfgRow('config.vidaUtil')}`;
  const N = 500;
  const prodCosto = new Map(S.productos.map((p) => [norm(p.nombre), isNum(p.costo) ? p.costo : 0]));
  const cfg = S.config;
  const filas = [['Concepto', ...meses.map((m) => mLabel(m)), 'Total']];
  const celdas = {};   // fila -> array de {f, v}
  const planCol = (j) => colL(5 + j), flujoCols = (j) => [colL(4 + j * 4), colL(4 + j * 4 + 3)];
  const sumTipo = (tipo, j) => {
    const [a, b] = flujoCols(j);
    return { f: `SUMPRODUCT((${F}!$D$2:$D$${N}="${TIPO_CORTO[tipo]}")*${F}!${a}2:${b}${N})`, v: sum(flujoRows.filter((r) => r[3] === TIPO_CORTO[tipo]).map((r) => sum(r.slice(4 + j * 4, 8 + j * 4).map((x) => x || 0)))) };
  };
  const def = [];
  const add = (label, fn) => { def.push({ label, fn }); return def.length + 1; };
  const rVentas = add('Ventas netas (plan comercial)', (j) => ({ f: `SUMPRODUCT(${P}!$C$2:$C$${N},${P}!${planCol(j)}2:${planCol(j)}${N})`, v: sum(planRows.map((r) => (r[2] || 0) * (r[5 + j] || 0))) }));
  const rCmv = add('Costo de mercaderías vendidas', (j) => {
    const q = `${P}!${planCol(j)}2:${planCol(j)}${N}`;
    const costoLookup = `SUMIF(${PR}!$A$2:$A$${N},${P}!$B$2:$B$${N},${PR}!$D$2:$D$${N})`;
    const v = sum(planRows.map((r) => { const c = prodCosto.get(norm(r[1])) || 0; const qn = r[5 + j] || 0; return c > 0 ? c * qn : (r[2] || 0) * qn * (cfg.costoPct || 0) / 100; }));
    return { f: `-(SUMPRODUCT(${costoLookup},${q})+SUMPRODUCT((${costoLookup}=0)*${P}!$C$2:$C$${N}*${q})*${costoPct}/100)`, v: -v };
  });
  const rCprod = add('Costos de producción', (j) => { const s = sumTipo('costo_produccion', j); return { f: `-${s.f}`, v: -s.v }; });
  const rUb = add('Utilidad bruta', (j) => ({ f: `${colL(j + 1)}${rVentas}+${colL(j + 1)}${rCmv}+${colL(j + 1)}${rCprod}` }));
  const rCom = add('Gastos de comercialización', (j) => { const s = sumTipo('gasto_comercial', j); return { f: `-${s.f}`, v: -s.v }; });
  const rAdm = add('Gastos de administración y operativos', (j) => { const s = sumTipo('gasto_admin', j); return { f: `-${s.f}`, v: -s.v }; });
  const rEbitda = add('EBITDA', (j) => ({ f: `${colL(j + 1)}${rUb}+${colL(j + 1)}${rCom}+${colL(j + 1)}${rAdm}` }));
  const rInv = add('Inversiones del mes (informativo)', (j) => sumTipo('inversion', j));
  const rDep = add('Depreciaciones', (j) => ({ f: j === 0 ? `-${dep}` : `-(${dep}+SUM($B$${rInv}:${colL(j)}${rInv})/(${vida}*12))` }));
  const rEbit = add('Resultado operativo', (j) => ({ f: `${colL(j + 1)}${rEbitda}+${colL(j + 1)}${rDep}` }));
  const rOing = add('Otros ingresos', (j) => sumTipo('otros_ingresos', j));
  const rFin = add('Gastos financieros (intereses del flujo)', (j) => { const s = sumTipo('interes', j); return { f: `-${s.f}`, v: -s.v }; });
  const rRai = add('Resultado antes de impuestos', (j) => ({ f: `${colL(j + 1)}${rEbit}+${colL(j + 1)}${rOing}+${colL(j + 1)}${rFin}` }));
  const rIre = add('Impuesto a la renta (estimado mensual)', (j) => ({ f: `-MAX(0,${colL(j + 1)}${rRai})*${ire}/100` }));
  add('Resultado neto', (j) => ({ f: `${colL(j + 1)}${rRai}+${colL(j + 1)}${rIre}` }));
  // Valores calculados para las filas que dependen de otras.
  const vals = def.map(() => new Array(nM).fill(0));
  def.forEach((d, k) => { for (let j = 0; j < nM; j++) { const c = d.fn(j); celdas[`${k}|${j}`] = c; if (isNum(c.v)) vals[k][j] = c.v; } });
  const V = (row, j) => vals[row - 2][j];
  for (let j = 0; j < nM; j++) {
    vals[rUb - 2][j] = V(rVentas, j) + V(rCmv, j) + V(rCprod, j);
    vals[rEbitda - 2][j] = V(rUb, j) + V(rCom, j) + V(rAdm, j);
    let acum = 0; for (let t = 0; t < j; t++) acum += V(rInv, t);
    vals[rDep - 2][j] = -((cfg.depMensual || 0) + (j ? acum / ((cfg.vidaUtil || 10) * 12) : 0));
    vals[rEbit - 2][j] = V(rEbitda, j) + V(rDep, j);
    vals[rRai - 2][j] = V(rEbit, j) + V(rOing, j) + V(rFin, j);
    vals[rIre - 2][j] = -Math.max(0, V(rRai, j)) * (cfg.ire || 0) / 100;
    vals[def.length - 1][j] = V(rRai, j) + V(rIre, j);
  }
  def.forEach((d) => filas.push([d.label]));
  filas.push([], ['Se calcula con las hojas «Plan comercial» y «Flujo de caja». Los intereses de la hoja «Préstamos», las compras y el IVA se suman en la herramienta. Esta hoja no se importa.']);
  const ws = XLSX.utils.aoa_to_sheet(filas);
  def.forEach((d, k) => {
    const r = k + 1;
    for (let j = 0; j < nM; j++) ws[XLSX.utils.encode_cell({ r, c: j + 1 })] = { t: 'n', f: celdas[`${k}|${j}`].f, v: r2(vals[k][j]), z: '#,##0' };
    ws[XLSX.utils.encode_cell({ r, c: nM + 1 })] = { t: 'n', f: `SUM(B${r + 1}:${colL(nM)}${r + 1})`, v: r2(sum(vals[k])), z: '#,##0' };
  });
  ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: filas.length - 1, c: nM + 1 } });
  ws['!cols'] = [{ wch: 40 }, ...meses.map(() => ({ wch: 12 })), { wch: 14 }];
  XLSX.utils.book_append_sheet(wb, ws, 'Presupuesto EERR');
}

/* ---------- lectura de la plantilla ---------- */
const esPlantilla = (wb) => wb.SheetNames.includes('Instrucciones') && wb.SheetNames.includes('Flujo de caja') && wb.SheetNames.includes('Plan comercial');

function leerPlantilla(XLSX, wb) {
  const avisos = [];
  const filas = (nombre) => (wb.Sheets[nombre] ? XLSX.utils.sheet_to_json(wb.Sheets[nombre], { header: 1, raw: true, defval: null }) : null);
  const txt = (v) => (v == null ? '' : String(v).trim());
  const num = (v) => (v == null || v === '' ? null : typeof v === 'number' ? v : parseNumber(String(v)));
  const fecha = (v) => {
    if (v == null || v === '') return null;
    if (typeof v === 'number') { const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${pad(d.m)}-${pad(d.d)}` : null; }
    const s = String(v).trim();
    if (isISODate(s)) return s;
    const m = /^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})$/.exec(s);
    return m ? `${m[3]}-${pad(m[2])}-${pad(m[1])}` : null;
  };
  const mesDe = (h) => {
    const s = norm(h);
    let m = /^(\d{4}) (\d{1,2})$/.exec(s);
    if (m) return `${m[1]}-${pad(m[2])}`;
    m = /^([a-z]+) (\d{4})$/.exec(s);
    if (m && MES_IDX[m[1]]) return `${m[2]}-${pad(MES_IDX[m[1]])}`;
    return null;
  };
  const semanaDe = (h) => { const m = /^s([1-4]) (.+)$/.exec(norm(h)); if (!m) return null; const mk = mesDe(m[2]); return mk ? `${mk}#${m[1]}` : null; };
  const out = { config: {}, clientes: [], productos: [], proveedores: [], plan: [], flujo: [], saldos: [], prestamos: [], balance: {}, variables: [], cuentas: [], insumos: [], recetas: [], hojas: wb.SheetNames.slice(), avisos };
  const cfg = filas('Configuración');
  if (cfg) for (const r of cfg.slice(1)) {
    const def = CONFIG_FILAS.find((x) => norm(x[0]) === norm(r[0]));
    if (!def || r[1] == null || r[1] === '') continue;
    let v = r[1];
    if (def[2] === 'num') { v = num(v); if (v == null) { avisos.push(`Configuración: no entendí «${r[0]}».`); continue; } }
    else if (def[2] === 'mes') { v = typeof v === 'number' ? fecha(v)?.slice(0, 7) : mesDe(v) || (/^\d{4}-\d{2}$/.test(String(v).trim()) ? String(v).trim() : null); if (!v) { avisos.push('Configuración: el primer mes tiene que ser AAAA-MM.'); continue; } }
    else v = txt(v);
    out.config[def[1]] = v;
  }
  for (const r of (filas('Clientes') || []).slice(1)) if (txt(r[0])) out.clientes.push({ nombre: txt(r[0]), ruc: txt(r[1]), plazo: Math.max(0, Math.round(num(r[2]) || 0)) });
  for (const r of (filas('Productos') || []).slice(1)) if (txt(r[0])) out.productos.push({ nombre: txt(r[0]), unidad: txt(r[1]), precio: num(r[2]) || 0, costo: num(r[3]), iva: num(r[4]) });
  for (const r of (filas('Proveedores') || []).slice(1)) if (txt(r[0])) out.proveedores.push({ nombre: txt(r[0]), ruc: txt(r[1]), plazo: Math.max(0, Math.round(num(r[2]) || 0)) });
  const plan = filas('Plan comercial');
  if (plan && plan.length) {
    const cols = plan[0].map((h, c) => (c >= 5 ? mesDe(h) : null));
    for (const r of plan.slice(1)) {
      if (!txt(r[0])) continue;
      const precio = num(r[2]);
      if (!isNum(precio) || precio <= 0) { avisos.push(`Plan comercial: «${txt(r[0])}» no tiene precio.`); continue; }
      const cant = {};
      cols.forEach((mk, c) => { if (mk) { const q = num(r[c]); if (q) cant[mk] = q; } });
      out.plan.push({ cliente: txt(r[0]), producto: txt(r[1]), precio, plazo: Math.max(0, Math.round(num(r[3]) || 0)), iva: num(r[4]) || 0, cant });
    }
  }
  const flujo = filas('Flujo de caja');
  if (flujo && flujo.length) {
    const cols = flujo[0].map((h, c) => { if (c < 4) return null; const w = semanaDe(h); if (w) return { w }; const m = mesDe(h); return m ? { m } : null; });
    for (const r of flujo.slice(1)) {
      if (!txt(r[2])) continue;
      const sec = secDesdeTexto(r[0]);
      if (!sec) { avisos.push(`Flujo de caja: «${txt(r[2])}» no tiene una sección válida (Ingresos, Egresos o Financiamiento).`); continue; }
      const tipo = tipoDesdeTexto(r[3], sec);
      if (txt(r[3]) && !tipo) avisos.push(`Flujo de caja: tipo «${txt(r[3])}» desconocido en «${txt(r[2])}»; se usa el del grupo.`);
      const semanas = {}, mensual = {};
      cols.forEach((c, k) => { if (!c) return; const v = num(r[k]); if (v == null) return; if (c.w) semanas[c.w] = (semanas[c.w] || 0) + v; else mensual[c.m] = (mensual[c.m] || 0) + v; });
      out.flujo.push({ sec, grupo: txt(r[1]) || SEC_TXT[sec], concepto: txt(r[2]), tipo, semanas, mensual });
    }
  }
  for (const r of (filas('Saldos iniciales') || []).slice(1)) {
    if (!txt(r[1])) continue;
    const tipo = norm(r[0]).startsWith('p') ? 'pagar' : 'cobrar';
    const monto = num(r[5]), vence = fecha(r[6]);
    if (!isNum(monto) || monto <= 0 || !vence) { avisos.push(`Saldos iniciales: revisá monto y vencimiento de «${txt(r[1])}».`); continue; }
    out.saldos.push({ tipo, parte: txt(r[1]), doc: txt(r[2]) || 'Saldo inicial', moneda: MONEDAS[txt(r[3]).toUpperCase()] ? txt(r[3]).toUpperCase() : null, tc: num(r[4]), monto, vence });
  }
  for (const r of (filas('Préstamos') || []).slice(1)) {
    if (!txt(r[0])) continue;
    const p = { nombre: txt(r[0]), entidad: txt(r[1]), moneda: MONEDAS[txt(r[2]).toUpperCase()] ? txt(r[2]).toUpperCase() : null, tc: num(r[3]), monto: num(r[4]), fecha: fecha(r[5]), tasa: num(r[6]) || 0, cuotas: Math.max(1, Math.round(num(r[7]) || 1)), frecuencia: [1, 3, 6, 12].includes(Math.round(num(r[8]))) ? Math.round(num(r[8])) : 1, sistema: SISTEMAS[norm(r[9])] ? norm(r[9]) : 'frances', gracia: Math.max(0, Math.round(num(r[10]) || 0)) };
    if (!isNum(p.monto) || p.monto <= 0 || !p.fecha) { avisos.push(`Préstamos: revisá monto y fecha de «${p.nombre}».`); continue; }
    out.prestamos.push(p);
  }
  for (const r of (filas('Gastos variables') || []).slice(1)) {
    if (!txt(r[1])) continue;
    const pct = num(r[2]);
    if (!isNum(pct) || pct < 0 || pct > 100) { avisos.push(`Gastos variables: revisá el porcentaje de «${txt(r[1])}».`); continue; }
    out.variables.push({ grupo: txt(r[0]), concepto: txt(r[1]), pct, desfase: Math.round(num(r[3]) || 0) === 1 ? 1 : 0 });
  }
  for (const r of (filas('Cuentas') || []).slice(1)) if (txt(r[0])) out.cuentas.push({ nombre: txt(r[0]), moneda: MONEDAS[txt(r[1]).toUpperCase()] ? txt(r[1]).toUpperCase() : null, saldoInicial: num(r[2]) || 0 });
  for (const r of (filas('Insumos') || []).slice(1)) {
    if (!txt(r[0])) continue;
    const precio = num(r[1]);
    if (!isNum(precio) || precio < 0) { avisos.push(`Insumos: «${txt(r[0])}» no tiene precio por tonelada.`); continue; }
    out.insumos.push({ nombre: txt(r[0]), precio, iva: isNum(num(r[2])) ? num(r[2]) : null, proveedor: txt(r[3]), plazo: Math.max(0, Math.round(num(r[4]) || 0)), stockInicial: Math.max(0, num(r[5]) || 0), stockMin: Math.max(0, num(r[6]) || 0), anticipo: Math.max(0, Math.min(3, Math.round(num(r[7]) || 0))) });
  }
  for (const r of (filas('Recetas') || []).slice(1)) {
    if (!txt(r[0]) || !txt(r[1])) continue;
    const t = num(r[2]);
    if (!isNum(t) || t <= 0) { avisos.push(`Recetas: revisá las toneladas de «${txt(r[1])}» en «${txt(r[0])}».`); continue; }
    out.recetas.push({ producto: txt(r[0]), insumo: txt(r[1]), t, conversion: num(r[3]), stockInicial: num(r[4]) });
  }
  for (const r of (filas('Balance inicial') || []).slice(1)) {
    const def = BALANCE_FILAS.find((x) => norm(x[0]) === norm(r[0]));
    if (def) out.balance[def[1]] = num(r[1]) || 0;
  }
  return out;
}

/* Aplica la plantilla. modo 'reemplazar': datos nuevos. modo 'actualizar': mantiene ventas, compras, cobros, pagos, reales y cierres. */
function aplicarPlantilla(pt, modo) {
  const st = modo === 'reemplazar' ? emptyState() : normalizeState(clone(S));
  const res = { clientes: 0, productos: 0, proveedores: 0, plan: 0, lineas: 0, saldos: 0, prestamos: 0 };
  if (modo === 'reemplazar') {
    st.meta = { origen: 'plantilla', creado: hoy(), notas: [] };
    st.grupos = st.grupos.filter((g) => g.auto);
    st.lineas = [];
    st.config.hoy = S.config.hoy || '';
  }
  for (const [path, v] of Object.entries(pt.config)) {
    const [a, b] = path.split('.');
    if (path === 'empresa.moneda' && !MONEDAS[String(v).toUpperCase()]) continue;
    st[a][b] = path === 'empresa.moneda' ? String(v).toUpperCase() : path === 'periodo.meses' ? Math.max(1, Math.min(60, Math.round(v))) : v;
  }
  st.empresa.simbolo = MONEDAS[st.empresa.moneda] || 'US$';
  const upsert = (arr, nombre, datos, pref) => {
    let x = arr.find((c) => claveCliente(c.nombre) === claveCliente(nombre));
    if (!x) { x = { id: uid(pref), nombre, nota: '' }; arr.push(x); }
    Object.assign(x, datos);
    return x;
  };
  for (const c of pt.clientes) { upsert(st.clientes, c.nombre, c, 'c'); res.clientes++; }
  for (const p of pt.productos) { upsert(st.productos, p.nombre, { ...p, iva: isNum(p.iva) ? p.iva : st.config.ivaVentas }, 'p'); res.productos++; }
  for (const p of pt.proveedores) { upsert(st.proveedores, p.nombre, p, 'pv'); res.proveedores++; }
  const cliente = (n) => st.clientes.find((c) => claveCliente(c.nombre) === claveCliente(n)) || upsert(st.clientes, n, { plazo: 0, ruc: '' }, 'c');
  const proveedor = (n) => st.proveedores.find((c) => claveCliente(c.nombre) === claveCliente(n)) || upsert(st.proveedores, n, { plazo: 0, ruc: '' }, 'pv');
  const producto = (n, precio) => (n ? st.productos.find((c) => norm(c.nombre) === norm(n)) || upsert(st.productos, n, { unidad: '', precio, costo: null, iva: st.config.ivaVentas }, 'p') : null);
  if (pt.plan.length || modo === 'reemplazar') {
    st.plan = pt.plan.map((p) => ({ id: uid('pl'), clienteId: cliente(p.cliente).id, productoId: producto(p.producto, p.precio) ? producto(p.producto, p.precio).id : null, precio: p.precio, plazo: p.plazo, iva: p.iva, cant: p.cant }));
    res.plan = st.plan.length;
  }
  // Flujo: grupos y líneas por nombre; la proyección de la plantilla reemplaza la anterior.
  const cal = buildCalendar(st.periodo);
  for (const f of pt.flujo) {
    let g = st.grupos.find((x) => !x.auto && x.sec === f.sec && norm(x.nombre) === norm(f.grupo));
    if (!g) { g = { id: uid('g'), sec: f.sec, nombre: f.grupo, tipo: f.tipo || tiposDeSeccion(f.sec)[0] }; st.grupos.push(g); }
    let l = st.lineas.find((x) => x.grupoId === g.id && norm(x.nombre) === norm(f.concepto));
    if (!l) { l = { id: uid('l'), grupoId: g.id, nombre: f.concepto, tipo: f.tipo || g.tipo }; st.lineas.push(l); } else if (f.tipo) l.tipo = f.tipo;
    res.lineas++;
    const vals = st.valores[l.id] || {};
    for (const wk of Object.keys(vals)) { delete vals[wk].p; delete vals[wk].pf; if (!isNum(vals[wk].r)) delete vals[wk]; }
    st.valores[l.id] = vals;
    const conSemanas = new Set(Object.keys(f.semanas).map((wk) => wk.split('#')[0]));
    for (const [wk, v] of Object.entries(f.semanas)) if (cal.widx.has(wk) && v) setValor(st, l.id, wk, 'p', v);
    for (const [mk, v] of Object.entries(f.mensual)) {
      if (!cal.midx.has(mk) || !v || conSemanas.has(mk)) continue;
      distribuir(v, 'eq').forEach((x, k) => { if (x) setValor(st, l.id, `${mk}#${k + 1}`, 'p', x); });
    }
  }
  // Saldos iniciales: se reemplazan los que no tienen cobros o pagos registrados.
  if (pt.saldos.length || modo === 'reemplazar') {
    const conMov = new Set([...st.cobros.map((c) => c.ventaId), ...st.pagos.map((p) => p.compraId)]);
    st.ventas = st.ventas.filter((v) => v.origen !== 'saldo_inicial' || conMov.has(v.id));
    st.compras = st.compras.filter((c) => c.origen !== 'saldo_inicial' || conMov.has(c.id));
    const dia0 = addDays(cal.start, -1);
    // Los saldos con cobros o pagos ya registrados se conservan: si la fila de la plantilla es el mismo documento, no se duplica.
    const mismo = (d, s, parteId) => d.origen === 'saldo_inicial' && parteId === (s.tipo === 'cobrar' ? d.clienteId : d.proveedorId) && norm(d.factura) === norm(s.doc) && d.cuotas[0].vence === s.vence && Math.abs(totalDoc(d) - s.monto) < 0.01;
    for (const s of pt.saldos) {
      const parteId = s.tipo === 'cobrar' ? cliente(s.parte).id : proveedor(s.parte).id;
      if ((s.tipo === 'cobrar' ? st.ventas : st.compras).some((d) => mismo(d, s, parteId))) continue;
      const base = { id: uid(s.tipo === 'cobrar' ? 'v' : 'k'), origen: 'saldo_inicial', fecha: dia0, monto: s.monto, iva: 0, moneda: s.moneda || st.empresa.moneda, tc: s.moneda && s.moneda !== st.empresa.moneda ? s.tc || st.empresa.tc : null, cuotas: [{ vence: s.vence, monto: s.monto }], factura: s.doc, nota: '' };
      if (s.tipo === 'cobrar') st.ventas.push({ ...base, clienteId: cliente(s.parte).id, productoId: null, cantidad: null, precio: null, costoUnit: null, planMes: null });
      else st.compras.push({ ...base, proveedorId: proveedor(s.parte).id, destino: 'compra', concepto: 'Saldo inicial', lineaId: null });
      res.saldos++;
    }
  }
  if (pt.prestamos.length || modo === 'reemplazar') {
    const previos = st.prestamos;
    st.prestamos = pt.prestamos.map((p) => { const ex = previos.find((x) => norm(x.nombre) === norm(p.nombre)); return { id: ex ? ex.id : uid('pr'), ...p, moneda: p.moneda || st.empresa.moneda, tc: p.moneda && p.moneda !== st.empresa.moneda ? p.tc || st.empresa.tc : null }; });
    for (const x of previos) if (!st.prestamos.some((p) => p.id === x.id)) for (const k of ['__pd:', '__pk:', '__pi:']) delete st.valores[k + x.id];
    res.prestamos = st.prestamos.length;
  }
  if (Object.keys(pt.balance).length) Object.assign(st.balanceInicial, pt.balance);
  // Gastos variables: el porcentaje se aplica a la línea del flujo con ese nombre (se crea si no existe).
  const tieneHoja = (n) => !pt.hojas || pt.hojas.includes(n);
  if (tieneHoja('Gastos variables')) {
    for (const l of st.lineas) if (Number(l.pctVentas) > 0 && !pt.variables.some((v) => norm(v.concepto) === norm(l.nombre))) { delete l.pctVentas; delete l.desfase; }
    for (const v of pt.variables) {
      let l = st.lineas.find((x) => { const g = st.grupos.find((y) => y.id === x.grupoId); return g && g.sec === 'egr' && norm(x.nombre) === norm(v.concepto) && (!v.grupo || norm(g.nombre) === norm(v.grupo)); });
      if (!l) {
        let g = st.grupos.find((x) => !x.auto && x.sec === 'egr' && norm(x.nombre) === norm(v.grupo || 'Gastos comerciales'));
        if (!g) { g = { id: uid('g'), sec: 'egr', nombre: v.grupo || 'Gastos comerciales', tipo: 'gasto_comercial' }; st.grupos.push(g); }
        l = { id: uid('l'), grupoId: g.id, nombre: v.concepto, tipo: 'gasto_comercial' };
        st.lineas.push(l);
      }
      if (v.pct > 0) { l.pctVentas = v.pct; l.desfase = v.desfase; } else { delete l.pctVentas; delete l.desfase; }
      res.variables = (res.variables || 0) + 1;
    }
  }
  if (pt.cuentas.length || (modo === 'reemplazar' && tieneHoja('Cuentas'))) {
    const previas = st.cuentas || [];
    st.cuentas = pt.cuentas.map((c) => { const ex = previas.find((x) => norm(x.nombre) === norm(c.nombre)); return { id: ex ? ex.id : uid('cu'), nombre: c.nombre, moneda: c.moneda || st.empresa.moneda, saldoInicial: c.saldoInicial }; });
  }
  if (pt.insumos.length || (modo === 'reemplazar' && tieneHoja('Insumos'))) {
    const previos = st.insumos || [];
    st.insumos = pt.insumos.map((i) => { const ex = previos.find((x) => norm(x.nombre) === norm(i.nombre)); return { id: ex ? ex.id : uid('in'), nombre: i.nombre, precio: i.precio, iva: isNum(i.iva) ? i.iva : st.config.ivaCompras, proveedorId: i.proveedor ? proveedor(i.proveedor).id : null, plazo: i.plazo, stockInicial: i.stockInicial, stockMin: i.stockMin, anticipo: i.anticipo }; });
  }
  if (pt.recetas.length || (modo === 'reemplazar' && tieneHoja('Recetas'))) {
    for (const p of st.productos) { delete p.receta; }
    for (const r of pt.recetas) {
      const p = producto(r.producto, 0);
      const ins = st.insumos.find((x) => norm(x.nombre) === norm(r.insumo));
      if (!ins) { pt.avisos.push(`Recetas: el insumo «${r.insumo}» no está en la hoja Insumos.`); continue; }
      if (!p.receta) p.receta = [];
      p.receta.push({ insumoId: ins.id, t: r.t });
      if (isNum(r.conversion)) p.conversion = r.conversion;
      if (isNum(r.stockInicial)) p.stockInicial = r.stockInicial;
      if (!p.unidad) p.unidad = 't';
    }
  }
  st.meta.importado = hoy();
  return { st, res };
}
/* =====================================================================
   Filas de reportes (las usan las pantallas y la exportación a Excel)
   y gráficos en SVG.
   ===================================================================== */

const nombreCliente = (id) => { const c = S.clientes.find((x) => x.id === id); return c ? c.nombre : 'Cliente eliminado'; };
const nombreProducto = (id) => { if (!id) return 'Sin producto'; const p = S.productos.find((x) => x.id === id); return p ? p.nombre : 'Producto eliminado'; };
const nombreProveedor = (id) => { const c = S.proveedores.find((x) => x.id === id); return c ? c.nombre : 'Proveedor eliminado'; };
const zerosN = (n) => new Array(n).fill(0);
const addArr = (arrs, n) => { const out = zerosN(n); for (const a of arrs) for (let i = 0; i < n; i++) out[i] += a[i] || 0; return out; };
const hasAny = (a) => a.some((v) => Math.abs(v) > 0.004);

/* Ítems de un grupo del flujo con sus tres capas semanales. */
function grupoItems(M, g) {
  if (g.auto) {
    const src = g.auto === 'cxc' ? M.cxcCli : g.auto === 'cxp' ? M.cxpProv : g.auto === 'mrp' ? M.mrpRows : M.planCli;
    const nombre = g.auto === 'cxp' ? nombreProveedor : g.auto === 'mrp' ? nombreInsumo : nombreCliente;
    const out = [];
    for (const [cid, row] of src) {
      if (!hasAny(row.proj) && !hasAny(row.real) && !hasAny(row.eff)) continue;
      out.push({ id: `${g.auto}:${cid}`, clienteId: cid, label: nombre(cid), proj: row.proj, real: g.auto === 'plan' || g.auto === 'mrp' ? zerosN(M.nW) : row.real, eff: row.eff, auto: g.auto });
    }
    return out.sort((a, b) => a.label.localeCompare(b.label, 'es'));
  }
  return M.lines.filter((x) => x.g.id === g.id).map((x) => ({ id: x.l.id, label: x.variable ? `${x.l.nombre} (${fmt(x.variable * 100, { dec: Number.isInteger(x.variable * 100) ? 0 : 1 })} % de ventas)` : x.l.nombre, proj: x.proj, real: x.real, eff: x.eff, hasReal: x.hasReal, tipo: x.tipo, calc: x.calc, descontado: x.descontado }));
}

function flujoMensualRows(M, capa) {
  const rows = [];
  const nM = M.nM;
  const ini = M.months.map((m, mi) => M.saldo[capa].ini[mi * 4]);
  const fin = M.months.map((m, mi) => M.saldo[capa].fin[mi * 4 + 3]);
  rows.push({ kind: 'saldo', label: 'Saldo inicial', vals: ini, total: ini[0] });
  const secM = {};
  for (const sec of ['ing', 'egr', 'fin']) {
    rows.push({ kind: 'sec', label: sec === 'fin' ? 'Financiamiento (amortizaciones)' : SECCIONES[sec] });
    for (const g of M.grupos.filter((x) => x.sec === sec)) {
      const items = grupoItems(M, g).map((it) => ({ ...it, vals: M.toM(it[capa]) }));
      const gv = addArr(items.map((it) => it.vals), nM);
      rows.push({ kind: 'grp', gid: g.id, label: g.nombre, vals: gv, total: sum(gv), auto: g.auto || null, calc: !!g.calc, n: items.length });
      for (const it of items) rows.push({ kind: 'line', indent: true, gid: g.id, id: it.id, label: it.label, vals: it.vals, total: sum(it.vals), auto: g.auto || null, calc: !!it.calc, clienteId: it.clienteId });
    }
    secM[sec] = M.toM(M.secTot[sec][capa]);
    rows.push({ kind: 'tot', label: sec === 'ing' ? 'Total ingresos' : sec === 'egr' ? 'Total egresos' : 'Total financiamiento', vals: secM[sec], total: sum(secM[sec]) });
    if (sec === 'egr') {
      const eco = ini.map((s, mi) => s + secM.ing[mi] - secM.egr[mi]);
      rows.push({ kind: 'saldo', label: 'Flujo de caja económico', vals: eco, total: eco[nM - 1] });
    }
  }
  rows.push({ kind: 'saldo', label: 'Flujo de caja financiero (saldo final)', vals: fin, total: fin[nM - 1], final: true });
  return rows;
}

function flujoSemanalRows(M) {
  const rows = [];
  for (const sec of ['ing', 'egr', 'fin']) {
    rows.push({ kind: 'sec', label: SECCIONES[sec] });
    for (const g of M.grupos.filter((x) => x.sec === sec)) {
      const items = grupoItems(M, g);
      rows.push({ kind: 'grp', label: g.nombre, proj: addArr(items.map((i) => i.proj), M.nW), real: addArr(items.map((i) => i.real), M.nW) });
      for (const it of items) rows.push({ kind: 'line', indent: true, label: it.label, proj: it.proj, real: it.real });
    }
    rows.push({ kind: 'tot', label: `Total ${SECCIONES[sec].toLowerCase()}`, proj: M.secTot[sec].proj, real: M.secTot[sec].real });
  }
  rows.push({ kind: 'tot', label: 'Flujo neto', proj: M.saldo.proj.net, real: M.saldo.real.net });
  rows.push({ kind: 'saldo', label: 'Saldo final (real + proyección)', eff: M.saldo.eff.fin });
  return rows;
}

function eerrRows(M, e) {
  const R = [];
  const neg = (a) => a.map((v) => -v);
  const add = (key, label, vals, kind = 'line', extra = {}) => R.push({ key, label, vals, total: sum(vals), kind, ...extra });
  const pct = (key, label, num, den) => R.push({ key, label, kind: 'pct', vals: num.map((v, i) => (Math.abs(den[i]) > 0.5 ? v / den[i] : null)), total: Math.abs(sum(den)) > 0.5 ? sum(num) / sum(den) : null });
  add('ventas', 'Ventas netas', e.ventas, 'line', { detalle: 'ventas' });
  add('cmv', 'Costo de mercaderías vendidas', neg(e.cmv));
  if (hasAny(e.cprod)) add('cprod', 'Costos de producción', neg(e.cprod), 'line', { detalle: 'costo_produccion' });
  add('ub', 'Utilidad bruta', e.ub, 'sub');
  pct('mb', 'Margen bruto', e.ub, e.ventas);
  add('gcom', 'Gastos de comercialización', neg(e.gcom), 'line', { detalle: 'gasto_comercial' });
  add('gadm', 'Gastos de administración y operativos', neg(e.gadm), 'line', { detalle: 'gasto_admin' });
  add('ebitda', 'EBITDA', e.ebitda, 'sub');
  pct('mebitda', 'Margen EBITDA', e.ebitda, e.ventas);
  add('dep', 'Depreciaciones', neg(e.dep));
  add('ebit', 'Resultado operativo', e.ebit, 'sub');
  add('oing', 'Otros ingresos', e.oing, 'line', { detalle: 'otros_ingresos' });
  if (hasAny(e.dcambio)) add('dcambio', 'Diferencia de cambio', e.dcambio);
  add('gfin', 'Gastos financieros', neg(e.gfin), 'line', { detalle: 'interes' });
  add('rai', 'Resultado antes de impuestos', e.rai, 'sub');
  add('ire', `Impuesto a la renta (IRE ${fmt(S.config.ire, { dec: 0 })} %)`, neg(e.ire));
  add('rn', 'Resultado neto', e.rn, 'big');
  pct('mn', 'Margen neto', e.rn, e.ventas);
  return R;
}

function balanceRows(M) {
  const cols = [M.balIni, ...M.balMes];
  const row = (label, f, kind = 'line', extra = {}) => ({ label, vals: cols.map(f), kind, ...extra });
  const ratio = (a, b) => (Math.abs(b) > 0.5 ? a / b : null);
  return [
    { kind: 'head', label: 'Activo' },
    row('Caja y bancos', (b) => b.caja, 'line', { fuente: 'Saldo final del flujo de caja' }),
    row('Cuentas por cobrar', (b) => b.cxc, 'line', { fuente: 'Saldo inicial + ventas − cobranzas' }),
    row('Inventarios', (b) => b.inv, 'line', { fuente: 'Inicial + compras − costo de ventas' }),
    row('Otros créditos', (b) => b.oc),
    row('Activo corriente', (b) => b.ac, 'sub'),
    row('Bienes de uso (neto)', (b) => b.bu, 'line', { fuente: 'Inicial + inversiones − depreciaciones' }),
    row('Otros activos no corrientes', (b) => b.oanc),
    row('Activo no corriente', (b) => b.anc, 'sub'),
    row('Total activo', (b) => b.activo, 'big'),
    { kind: 'head', label: 'Pasivo' },
    row('Proveedores', (b) => b.prov, 'line', { fuente: 'Saldo inicial + compras − pagos' }),
    row('Otras deudas', (b) => b.otras),
    row('Préstamos · porción corriente', (b) => b.prestCP, 'line', { fuente: 'Amortizaciones de los próximos 12 meses' }),
    row('IVA a pagar', (b) => b.iva, 'line', { fuente: 'Débito − crédito − pagos (negativo: saldo a favor)' }),
    row('Impuesto a la renta a pagar', (b) => b.imp, 'line', { fuente: 'Inicial + IRE devengado − pagos' }),
    row('Pasivo corriente', (b) => b.pc, 'sub'),
    row('Préstamos · largo plazo', (b) => b.prestLP),
    row('Pasivo no corriente', (b) => b.pnc, 'sub'),
    row('Total pasivo', (b) => b.pasivo, 'tot'),
    { kind: 'head', label: 'Patrimonio neto' },
    row('Capital', (b) => b.cap),
    row('Reservas', (b) => b.res),
    row('Resultados acumulados', (b) => b.ra),
    row('Resultado del ejercicio', (b) => b.re, 'line', { fuente: 'Resultado neto del EERR (proyección)' }),
    row('Total patrimonio neto', (b) => b.pn, 'sub'),
    row('Total pasivo y patrimonio', (b) => b.pasivoPn, 'big'),
    row('Control: activo − pasivo − patrimonio', (b) => b.dif, 'check'),
    { kind: 'head', label: 'Indicadores' },
    row('Liquidez corriente (veces)', (b) => ratio(b.ac, b.pc), 'ratio'),
    row('Prueba ácida (veces)', (b) => ratio(b.ac - b.inv, b.pc), 'ratio'),
    row('Endeudamiento (pasivo / patrimonio)', (b) => ratio(b.pasivo, b.pn), 'ratio'),
    row('Capital de trabajo', (b) => b.ac - b.pc, 'line'),
  ];
}

/* ---------- gráficos ---------- */
const CHARTS = new Map();
function niceTicks(min, max, n = 4) {
  if (min === max) { max = min + 1; }
  const span = max - min;
  const raw = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((s) => span / s <= n) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v / step) * step);
  return { lo, hi, ticks };
}

function chartSaldo(M, id) {
  const W = 720, H = 250, ml = 58, mr = 18, mt = 26, mb = 30;
  const n = M.nW;
  const vals = M.saldo.eff.fin;
  const lo0 = Math.min(0, ...vals), hi0 = Math.max(0, ...vals);
  const { lo, hi, ticks } = niceTicks(lo0, hi0, 4);
  const x = (i) => ml + (n <= 1 ? 0 : (i * (W - ml - mr)) / (n - 1));
  const y = (v) => mt + ((hi - v) * (H - mt - mb)) / (hi - lo || 1);
  const pts = vals.map((v, i) => [x(i), y(v)]);
  const path = (a) => a.map((p, k) => `${k ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
  const lastReal = M.ultimaCerrada;
  let g = '';
  for (const t of ticks) g += `<line x1="${ml}" x2="${W - mr}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="${t === 0 ? 'var(--chart-axis)' : 'var(--chart-grid)'}" stroke-width="1"/><text x="${ml - 8}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end">${fmtCompact(t)}</text>`;
  if (lastReal >= 0) g += `<rect x="${ml}" y="${mt}" width="${Math.max(0, x(lastReal) - ml).toFixed(1)}" height="${H - mt - mb}" fill="var(--surface-2)"/><text x="${ml + 6}" y="${mt - 8}">Real</text>`;
  g += `<text x="${Math.max(ml, lastReal >= 0 ? x(lastReal) + 6 : ml + 6).toFixed(1)}" y="${mt - 8}">Proyección</text>`;
  const step = n > 52 ? 12 : n > 26 ? 8 : 4;
  M.weeks.forEach((w, i) => { if (w.i === 1 && (i / 4) % (step / 4) === 0) g += `<text x="${x(i).toFixed(1)}" y="${H - 10}" text-anchor="start">${mLabelShort(w.m)}</text>`; });
  const area = `${path(pts)}L${x(n - 1).toFixed(1)},${y(Math.max(lo, 0)).toFixed(1)}L${x(0).toFixed(1)},${y(Math.max(lo, 0)).toFixed(1)}Z`;
  g += `<path d="${area}" fill="var(--chart-1)" fill-opacity="0.1"/>`;
  g += `<path d="${path(pts)}" fill="none" stroke="var(--chart-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (M.cur >= 0 && M.cur < n) g += `<line x1="${x(M.cur).toFixed(1)}" x2="${x(M.cur).toFixed(1)}" y1="${mt}" y2="${H - mb}" stroke="var(--ink-2)" stroke-width="1"/><text x="${(x(M.cur) + 4).toFixed(1)}" y="${H - mb - 6}" class="lab">hoy</text>`;
  if (M.minIdx >= 0) {
    const i = M.minIdx, v = vals[i];
    const neg = v < 0;
    const lx = x(i), ly = y(v);
    const anchor = lx > W - 160 ? 'end' : 'start';
    g += `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="5" fill="${neg ? 'var(--neg)' : 'var(--chart-1)'}" stroke="var(--surface)" stroke-width="2"/>`;
    g += `<text class="lab" x="${(lx + (anchor === 'end' ? -9 : 9)).toFixed(1)}" y="${(ly + (ly > H - mb - 20 ? -8 : 16)).toFixed(1)}" text-anchor="${anchor}">Mínimo ${fmtCompact(v)} · ${weekLabel(M.weeks[i])}</text>`;
  }
  g += `<g class="hover" visibility="hidden"><line class="hx" y1="${mt}" y2="${H - mb}" stroke="var(--ink-2)" stroke-width="1"/><circle class="hd" r="4.5" fill="var(--chart-1)" stroke="var(--surface)" stroke-width="2"/></g>`;
  g += `<rect class="hit" x="${ml}" y="${mt}" width="${W - ml - mr}" height="${H - mt - mb}" fill="transparent"/>`;
  CHARTS.set(id, { type: 'saldo', W, H, x, y, n, vals, M });
  const tabla = `<div class="tbl-wrap" hidden data-tabla="${id}" style="max-height:280px"><table class="list"><thead><tr><th>Semana</th><th>Fechas</th><th class="n">Saldo final</th><th>Tipo</th></tr></thead><tbody>${M.weeks.map((w, i) => `<tr><td>${weekLabel(w)}</td><td>${w.rango}</td><td class="n ${vals[i] < 0 ? 'neg' : ''}">${fmt(vals[i])}</td><td>${M.closed[i] ? 'Real' : 'Proyectado'}</td></tr>`).join('')}</tbody></table></div>`;
  return `<div class="chart" id="${id}" tabindex="0" aria-label="Saldo de caja semanal. Usá las flechas para recorrer las semanas."><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo de caja al cierre de cada semana">${g}</svg><div class="tip" hidden></div></div>${tabla}`;
}

function chartVentas(M, id) {
  const W = 720, H = 250, ml = 58, mr = 12, mt = 16, mb = 30;
  const n = M.nM;
  const ppto = M.eerr.ppto.ventas, real = M.ventasReal, pend = M.pendVentas;
  const hi0 = Math.max(1, ...ppto, ...real.map((v, i) => v + pend[i]));
  const { hi, ticks } = niceTicks(0, hi0, 4);
  const y = (v) => mt + ((hi - v) * (H - mt - mb)) / hi;
  const band = (W - ml - mr) / n;
  const bw = Math.max(4, Math.min(22, (band - 10) / 2));
  const gx = (i) => ml + i * band + (band - (bw * 2 + 2)) / 2;
  const bar = (x0, top, bottom, rounded, fill) => {
    const h = bottom - top;
    if (h <= 0.4) return '';
    const r = rounded ? Math.min(4, h, bw / 2) : 0;
    return `<path d="M${x0.toFixed(1)},${bottom.toFixed(1)}V${(top + r).toFixed(1)}${r ? `Q${x0.toFixed(1)},${top.toFixed(1)} ${(x0 + r).toFixed(1)},${top.toFixed(1)}H${(x0 + bw - r).toFixed(1)}Q${(x0 + bw).toFixed(1)},${top.toFixed(1)} ${(x0 + bw).toFixed(1)},${(top + r).toFixed(1)}` : `H${(x0 + bw).toFixed(1)}`}V${bottom.toFixed(1)}Z" fill="${fill}"/>`;
  };
  let g = '';
  for (const t of ticks) g += `<line x1="${ml}" x2="${W - mr}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="${t === 0 ? 'var(--chart-axis)' : 'var(--chart-grid)'}" stroke-width="1"/><text x="${ml - 8}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end">${fmtCompact(t)}</text>`;
  const every = n > 12 ? 2 : 1;
  const par = M.cal.midx.has(M.curMonth) ? M.cal.midx.get(M.curMonth) : 0;
  for (let i = 0; i < n; i++) {
    const x0 = gx(i);
    g += `<g class="bar" data-i="${i}">`;
    g += bar(x0, y(ppto[i]), y(0), true, 'var(--chart-plan)');
    const x1 = x0 + bw + 2;
    const yr = y(real[i]);
    const hasPend = pend[i] > 0.5;
    g += bar(x1, yr, y(0), !hasPend, 'var(--chart-1)');
    if (hasPend) g += bar(x1, y(real[i] + pend[i]), real[i] > 0.5 ? yr - 2 : y(0), true, 'var(--chart-1-soft)');
    g += `<rect x="${(ml + i * band).toFixed(1)}" y="${mt}" width="${band.toFixed(1)}" height="${H - mt - mb}" fill="transparent" class="hitb" data-i="${i}"/>`;
    g += `</g>`;
    if ((i - par) % every === 0) g += `<text x="${(ml + i * band + band / 2).toFixed(1)}" y="${H - 10}" text-anchor="middle"${M.months[i] === M.curMonth ? ' class="lab"' : ''}>${mLabelShort(M.months[i])}</text>`;
  }
  CHARTS.set(id, { type: 'ventas', W, H, n, ppto, real, pend, M, band, ml });
  const legend = `<div class="legend"><span><i style="background:var(--chart-plan)"></i>Presupuesto</span><span><i style="background:var(--chart-1)"></i>Vendido</span><span><i style="background:var(--chart-1-soft)"></i>Pendiente del plan</span></div>`;
  const tabla = `<div class="tbl-wrap" hidden data-tabla="${id}" style="max-height:280px"><table class="list"><thead><tr><th>Mes</th><th class="n">Presupuesto</th><th class="n">Vendido</th><th class="n">Pendiente</th><th class="n">Cumplimiento</th></tr></thead><tbody>${M.months.map((m, i) => `<tr><td>${mLabel(m)}</td><td class="n">${fmt(ppto[i])}</td><td class="n">${fmt(real[i])}</td><td class="n">${fmt(pend[i])}</td><td class="n">${ppto[i] > 0.5 ? fmtPct(real[i] / ppto[i], 0) : '–'}</td></tr>`).join('')}</tbody></table></div>`;
  return `${legend}<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por mes: presupuesto, vendido y pendiente del plan">${g}</svg><div class="tip" hidden></div></div>${tabla}`;
}

function bindCharts() {
  for (const [id, c] of CHARTS) {
    const root = document.getElementById(id);
    if (!root) { CHARTS.delete(id); continue; }
    const svg = root.querySelector('svg');
    const tip = root.querySelector('.tip');
    const toLocal = (ev) => { const r = svg.getBoundingClientRect(); return { sx: ((ev.clientX - r.left) / r.width) * c.W, k: r.width / c.W, r }; };
    const place = (px, py) => {
      tip.hidden = false;
      const rr = root.getBoundingClientRect();
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      let left = px + 14, top = py - th - 10;
      if (left + tw > rr.width) left = px - tw - 14;
      if (top < 0) top = py + 14;
      tip.style.left = `${Math.max(0, left)}px`;
      tip.style.top = `${Math.max(0, top)}px`;
    };
    if (c.type === 'saldo') {
      const hov = svg.querySelector('.hover'), hx = svg.querySelector('.hx'), hd = svg.querySelector('.hd');
      let cur = -1;
      const show = (i) => {
        cur = Math.max(0, Math.min(c.n - 1, i));
        const w = c.M.weeks[cur], v = c.vals[cur];
        const X = c.x(cur), Y = c.y(v);
        hov.setAttribute('visibility', 'visible');
        hx.setAttribute('x1', X); hx.setAttribute('x2', X); hd.setAttribute('cx', X); hd.setAttribute('cy', Y);
        tip.innerHTML = '';
        const a = document.createElement('div'); a.className = 'tv'; a.textContent = money(v); if (v < 0) a.classList.add('neg');
        const b = document.createElement('div'); b.className = 'tl'; b.textContent = `${weekLabel(w)} · ${w.rango} · ${c.M.closed[cur] ? 'real' : 'proyectado'}`;
        tip.append(a, b);
        const k = svg.getBoundingClientRect().width / c.W;
        place(X * k, Y * k);
      };
      const hide = () => { hov.setAttribute('visibility', 'hidden'); tip.hidden = true; };
      svg.addEventListener('pointermove', (ev) => {
        const { sx } = toLocal(ev);
        let best = 0, bd = Infinity;
        for (let i = 0; i < c.n; i++) { const d = Math.abs(c.x(i) - sx); if (d < bd) { bd = d; best = i; } }
        show(best);
      });
      svg.addEventListener('pointerleave', hide);
      root.addEventListener('focus', () => show(c.M.cur >= 0 && c.M.cur < c.n ? c.M.cur : 0));
      root.addEventListener('blur', hide);
      root.addEventListener('keydown', (ev) => {
        if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') { ev.preventDefault(); show(cur + (ev.key === 'ArrowRight' ? 1 : -1)); }
      });
    } else if (c.type === 'lineas') {
      const hov = svg.querySelector('.hover'), hx = svg.querySelector('.hx');
      svg.addEventListener('pointermove', (ev) => {
        const { sx } = toLocal(ev);
        let best = 0, bd = Infinity;
        for (let i = 0; i < c.n; i++) { const d = Math.abs(c.x(i) - sx); if (d < bd) { bd = d; best = i; } }
        const X = c.x(best);
        hov.setAttribute('visibility', 'visible'); hx.setAttribute('x1', X); hx.setAttribute('x2', X);
        tip.innerHTML = '';
        const h = document.createElement('div'); h.className = 'tl'; h.textContent = `${weekLabel(c.M.weeks[best])} · ${c.M.weeks[best].rango}`; tip.append(h);
        for (const se of c.series) {
          const r = document.createElement('div'); r.className = 'row';
          const k = document.createElement('span'); k.className = 'k';
          const sw = document.createElement('i'); sw.style.background = se.color; k.append(sw, document.createTextNode(se.label));
          const v = document.createElement('span'); v.className = 'tv'; v.textContent = fmt(se.vals[best]); if (se.vals[best] < 0) v.classList.add('neg');
          r.append(k, v); tip.append(r);
        }
        const k = svg.getBoundingClientRect().width / c.W;
        place(X * k, 40 * k);
      });
      svg.addEventListener('pointerleave', () => { hov.setAttribute('visibility', 'hidden'); tip.hidden = true; });
    } else if (c.type === 'ventas') {
      svg.addEventListener('pointermove', (ev) => {
        const t = ev.target.closest('.hitb');
        if (!t) { tip.hidden = true; return; }
        const i = Number(t.dataset.i);
        tip.innerHTML = '';
        const h = document.createElement('div'); h.className = 'tl'; h.textContent = mLabel(c.M.months[i], true);
        tip.append(h);
        const rowT = (label, v, color) => {
          const r = document.createElement('div'); r.className = 'row';
          const k = document.createElement('span'); k.className = 'k';
          const sw = document.createElement('i'); sw.style.background = color; k.append(sw, document.createTextNode(label));
          const val = document.createElement('span'); val.className = 'tv'; val.textContent = fmt(v);
          r.append(k, val); tip.append(r);
        };
        rowT('Presupuesto', c.ppto[i], 'var(--chart-plan)');
        rowT('Vendido', c.real[i], 'var(--chart-1)');
        if (c.pend[i] > 0.5) rowT('Pendiente', c.pend[i], 'var(--chart-1-soft)');
        if (c.ppto[i] > 0.5) { const p = document.createElement('div'); p.className = 'tl'; p.textContent = `Cumplimiento ${fmtPct(c.real[i] / c.ppto[i], 0)}`; tip.append(p); }
        const k = svg.getBoundingClientRect().width / c.W;
        place((c.ml + (i + 0.5) * c.band) * k, 40 * k);
      });
      svg.addEventListener('pointerleave', () => { tip.hidden = true; });
    }
  }
}
