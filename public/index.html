  <section class="panel"><div class="panel-body" style="padding-top:12px">${tabs('prod-tab', tab, [['mp', 'Materia prima'], ['pt', 'Productos'], ['ins', 'Insumos'], ['rec', 'Recetas']])}${contenido}</div></section>`;
}

/* ---------- Bancos y conciliación ---------- */
function saldoCuentaBase(c, v) { return (Number(v) || 0) * factorBase(c.moneda, S.empresa.tc); }
function viewBancos(M) {
  const cuentas = S.cuentas || [];
  const tools = `<button class="btn btn-primary" data-action="cuenta-nueva">${icon('plus', 15)}Agregar cuenta</button>`;
  const iniBase = sum(cuentas.map((c) => saldoCuentaBase(c, c.saldoInicial)));
  let lista = '<div class="empty">Agregá la caja y cada cuenta bancaria (en guaraníes o en dólares) con su saldo al inicio del período. Después, cada semana, cargá el saldo que muestra el banco para controlar la caja de la herramienta.</div>';
  if (cuentas.length) {
    lista = `<div class="tbl-wrap"><table class="list"><thead><tr><th>Cuenta</th><th>Moneda</th><th class="n">Saldo inicial</th><th class="n">En ${esc(S.empresa.simbolo)}</th><th></th></tr></thead><tbody>${cuentas.map((c) => `<tr><td class="wrap">${esc(c.nombre)}</td><td>${MONEDAS[c.moneda]}</td><td class="n">${fmt(c.saldoInicial)}</td><td class="n">${fmt(saldoCuentaBase(c, c.saldoInicial))}</td><td class="act"><button class="btn btn-sm btn-ghost" data-action="cuenta-editar" data-id="${c.id}" aria-label="Editar">${icon('edit', 14)}</button><button class="btn btn-sm btn-ghost btn-danger" data-action="cuenta-eliminar" data-id="${c.id}" aria-label="Eliminar">${icon('trash', 14)}</button></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3"><b>Total</b></td><td class="n"><b>${fmt(iniBase)}</b></td><td class="act">${Math.abs(iniBase - (Number(S.config.saldoInicial) || 0)) > 0.5 ? `<button class="btn btn-sm" data-action="cuentas-saldo-inicial">Usar como saldo inicial del flujo</button>` : chip('good', 'Igual al saldo inicial')}</td></tr></tfoot></table></div>`;
  }
  let conc = '';
  if (cuentas.length) {
    const hasta = Math.min(M.nW - 1, Math.max(0, M.cur));
    const filas = [];
    for (let i = hasta; i >= 0 && filas.length < 16; i--) filas.push(i);
    conc = `<section class="panel"><div class="panel-head"><div><h2>Conciliación semanal</h2><div class="sub">Saldo según cada banco al cierre de la semana, en la moneda de la cuenta. Las cuentas en otra moneda se convierten al tipo de cambio ${fmt(S.empresa.tc)}.</div></div></div><div class="panel-body"><div class="tbl-wrap"><table class="list"><thead><tr><th>Semana</th>${cuentas.map((c) => `<th class="n">${esc(c.nombre)} (${MONEDAS[c.moneda]})</th>`).join('')}<th class="n">Total bancos</th><th class="n">Herramienta</th><th class="n">Diferencia</th><th></th></tr></thead><tbody>${filas.map((i) => {
      const w = M.weeks[i];
      const reg = (S.conciliaciones || {})[w.key] || {};
      const completo = cuentas.every((c) => isNum(reg[c.id]));
      const total = sum(cuentas.map((c) => saldoCuentaBase(c, reg[c.id])));
      const herr = M.saldo.eff.fin[i];
      const dif = completo ? total - herr : null;
      return `<tr><td style="white-space:nowrap">${esc(weekLabel(w))} <span class="muted small">${esc(w.rango)}</span>${M.closed[i] ? ` <span title="Semana cerrada">${icon('lock', 13)}</span>` : ''}</td>${cuentas.map((c) => `<td class="n"><input class="plan-in" style="width:128px" type="text" inputmode="decimal" data-conc="${w.key}|${c.id}" data-fk="conc|${w.key}|${c.id}" value="${isNum(reg[c.id]) ? esc(fmt(reg[c.id], { dec: Number.isInteger(reg[c.id]) ? 0 : 2 })) : ''}" data-raw="${esc(rawNum(reg[c.id]))}" aria-label="${esc(c.nombre)} ${esc(weekLabel(w))}"></td>`).join('')}<td class="n">${completo ? fmt(total) : '<span class="muted">—</span>'}</td><td class="n">${fmt(herr)}</td><td class="n ${dif != null && Math.abs(dif) > 0.5 ? 'neg' : ''}">${dif == null ? '<span class="muted">Falta cargar</span>' : Math.abs(dif) <= 0.5 ? chip('good', 'Concilia') : fmt(dif, { sign: true })}</td><td class="act">${dif != null && Math.abs(dif) > 0.5 ? `<button class="btn btn-sm" data-action="conciliar-ajuste" data-w="${i}" data-dif="${dif}">Ajustar</button>` : ''}</td></tr>`;
    }).join('')}</tbody></table></div><p class="small muted">«Ajustar» carga la diferencia como real de esa semana en «Ajustes de conciliación» (ingresos; un ajuste negativo resta). Antes de ajustar, revisá si falta cargar algún cobro, pago o gasto.</p></div></section>`;
  }
  return `${pageHead('Bancos y conciliación', 'Caja y cuentas bancarias por separado, con un control semanal del saldo del banco contra el saldo real de la herramienta.', tools)}${lista}${conc}`;
}

/* ---------- Indicadores y precisión ---------- */
function diasPromedio(docs, pagos, fk) {
  const porDoc = groupBy(pagos, fk);
  const out = new Map();
  for (const d of docs) {
    if (d.origen === 'saldo_inicial') continue;
    const f = factorBase(d.moneda, d.tc);
    const cs = porDoc.get(d.id) || [];
    const parte = d.clienteId || d.proveedorId;
    if (!out.has(parte)) out.set(parte, { monto: 0, pactN: 0, pactD: 0, realN: 0, realD: 0 });
    const o = out.get(parte);
    o.monto += (d.monto || 0) * f;
    for (const q of d.cuotas || []) { o.pactN += daysBetween(d.fecha, q.vence) * q.monto * f; o.pactD += q.monto * f; }
    for (const c of cs) { if (c.costo) continue; o.realN += daysBetween(d.fecha, c.fecha) * c.monto * f; o.realD += c.monto * f; }
  }
  return out;
}
function viewIndicadores(M) {
  const cur = Math.min(Math.max(M.curC, 0), M.nW - 1);
  const saldoHoy = M.saldo.eff.ini[cur];
  const prox = [];
  for (let i = cur; i < Math.min(M.nW, cur + 12); i++) prox.push(M.secTot.egr.eff[i] + M.secTot.fin.eff[i]);
  const egrSem = prox.length ? sum(prox) / prox.length : 0;
  const cobertura = egrSem > 0.5 ? saldoHoy / egrSem : null;
  const cobros = diasPromedio(S.ventas, S.cobros, 'ventaId');
  const pagos = diasPromedio(S.compras, S.pagos, 'compraId');
  const tot = (map) => { const t = { monto: 0, pactN: 0, pactD: 0, realN: 0, realD: 0 }; for (const o of map.values()) for (const k of Object.keys(t)) t[k] += o[k]; return t; };
  const tc = tot(cobros), tp = tot(pagos);
  const d = (n, dd) => (dd > 0.5 ? Math.round(n / dd) : null);
  const E = M.eerr.proy;
  const idx12 = []; for (let mi = Math.max(0, Math.min(M.curIdx, M.nM - 1)); mi < Math.min(M.nM, M.curIdx + 12); mi++) idx12.push(mi);
  const cmv12 = sum(idx12.map((mi) => E.cmv[mi] + E.cprod[mi]));
  const invProm = idx12.length ? sum(idx12.map((mi) => M.balMes[mi].inv)) / idx12.length : 0;
  const diasInv = cmv12 > 0.5 ? Math.round(invProm / (cmv12 / (idx12.length * 30))) : null;
  const variablesM = M.toM(addArr(M.lines.filter((x) => x.variable).map((x) => x.eff), M.nW));
  const pe = M.months.map((m, mi) => {
    const ventas = E.ventas[mi];
    const variables = E.cmv[mi] + E.cprod[mi] + variablesM[mi];
    const fijos = E.gcom[mi] + E.gadm[mi] - variablesM[mi] + E.dep[mi] + E.gfin[mi] - E.oing[mi];
    const mc = ventas > 0.5 ? (ventas - variables) / ventas : null;
    return { ventas, fijos, mc, pe: mc && mc > 0 ? fijos / mc : null };
  });
  const peProm = (() => { const xs = idx12.map((mi) => pe[mi]).filter((x) => x.mc != null && x.mc > 0); if (!xs.length) return null; const f = sum(xs.map((x) => x.fijos)) / xs.length; const mc = sum(xs.map((x) => x.ventas - x.ventas * (1 - x.mc))) / sum(xs.map((x) => x.ventas)); return mc > 0 ? f / mc : null; })();
  const strip = `<div class="strip">
    <div><span class="lbl">Cobertura de caja</span><span class="val ${cobertura != null && cobertura < 2 ? 'neg' : ''}">${cobertura == null ? '–' : `${fmt(Math.max(0, cobertura), { dec: 1 })} sem.`}</span><span class="sub">${saldoHoy < 0 ? `Saldo de hoy negativo (${fmt(saldoHoy)})` : `Saldo de hoy ${fmt(saldoHoy)}`} / egresos semanales promedio ${fmt(egrSem)}</span></div>
    <div><span class="lbl">Días de cobro</span><span class="val">${d(tc.realN, tc.realD) ?? '–'}${d(tc.realN, tc.realD) != null ? ' días' : ''}</span><span class="sub">Pactado ${d(tc.pactN, tc.pactD) ?? '–'} días · cobros registrados</span></div>
    <div><span class="lbl">Días de pago</span><span class="val">${d(tp.realN, tp.realD) ?? '–'}${d(tp.realN, tp.realD) != null ? ' días' : ''}</span><span class="sub">Pactado ${d(tp.pactN, tp.pactD) ?? '–'} días · pagos registrados</span></div>
    <div><span class="lbl">Días de inventario</span><span class="val">${diasInv ?? '–'}${diasInv != null ? ' días' : ''}</span><span class="sub">Inventario promedio / costo de ventas, próximos 12 meses</span></div>
    <div><span class="lbl">Punto de equilibrio mensual</span><span class="val">${peProm == null ? '–' : money(peProm)}</span><span class="sub">Ventas necesarias para cubrir gastos fijos, promedio de 12 meses</span></div>
    <div><span class="lbl">Margen de contribución</span><span class="val">${(() => { const v = sum(idx12.map((mi) => pe[mi].ventas)); const c = sum(idx12.map((mi) => pe[mi].ventas * (pe[mi].mc || 0))); return v > 0.5 ? fmtPct(c / v) : '–'; })()}</span><span class="sub">Ventas − costo de ventas − gastos variables</span></div>
  </div>`;
  const tablaDias = (map, nombre, titulo) => {
    const filas = Array.from(map.entries()).filter(([, o]) => o.monto > 0.5).sort((a, b) => b[1].monto - a[1].monto);
    if (!filas.length) return `<div class="empty">Todavía no hay ${titulo === 'Cliente' ? 'ventas' : 'compras'} registradas en la herramienta.</div>`;
    return `<div class="tbl-wrap"><table class="list"><thead><tr><th>${titulo}</th><th class="n">Monto (${esc(S.empresa.simbolo)})</th><th class="n">Días pactados</th><th class="n">Días reales</th><th class="n">Atraso</th></tr></thead><tbody>${filas.map(([id, o]) => { const p = d(o.pactN, o.pactD), r = d(o.realN, o.realD); return `<tr><td class="wrap">${esc(nombre(id))}</td><td class="n">${fmt(o.monto)}</td><td class="n">${p ?? '–'}</td><td class="n">${r ?? '<span class="muted">sin cobros</span>'}</td><td class="n ${r != null && p != null && r - p > 5 ? 'neg' : ''}">${r != null && p != null ? fmt(r - p, { sign: true }) : '–'}</td></tr>`; }).join('')}</tbody></table></div>`;
  };
  const peTabla = `<div class="tbl-wrap"><table class="rep"><thead><tr><th class="lbl">${esc(S.empresa.simbolo)}</th>${M.months.map((m) => `<th class="${m === M.curMonth ? 'cur' : ''}">${esc(mLabel(m))}</th>`).join('')}</tr></thead><tbody>
    <tr><td class="lbl">Ventas proyectadas</td>${pe.map((x) => `<td>${fmt(x.ventas, { dash: true })}</td>`).join('')}</tr>
    <tr><td class="lbl">Punto de equilibrio</td>${pe.map((x) => `<td>${x.pe == null ? '–' : fmt(x.pe)}</td>`).join('')}</tr>
    <tr class="pct"><td class="lbl">Margen de contribución</td>${pe.map((x) => `<td>${x.mc == null ? '–' : fmtPct(x.mc)}</td>`).join('')}</tr>
    <tr class="sub"><td class="lbl">Ventas sobre el equilibrio</td>${pe.map((x) => `<td class="${x.pe != null && x.ventas < x.pe ? 'neg' : ''}">${x.pe == null ? '–' : fmt(x.ventas - x.pe, { sign: true })}</td>`).join('')}</tr>
  </tbody></table></div>`;
  return `${pageHead('Indicadores', 'Cobertura de caja, días de cobro, pago e inventario, punto de equilibrio y precisión de las proyecciones anteriores.')}
  ${strip}
  <div class="cols">
    <section class="panel"><div class="panel-head"><div><h2>Días de cobro por cliente</h2><div class="sub">Promedio ponderado por monto, desde la fecha de venta</div></div></div><div class="panel-body">${tablaDias(cobros, nombreCliente, 'Cliente')}</div></section>
    <section class="panel"><div class="panel-head"><div><h2>Días de pago por proveedor</h2><div class="sub">Promedio ponderado por monto, desde la fecha de compra</div></div></div><div class="panel-body">${tablaDias(pagos, nombreProveedor, 'Proveedor')}</div></section>
  </div>
  <section class="panel"><div class="panel-head"><div><h2>Punto de equilibrio por mes</h2><div class="sub">Gastos fijos (comercialización y administración sin los gastos variables, depreciación e intereses, menos otros ingresos) dividido el margen de contribución</div></div></div><div class="panel-body">${peTabla}</div></section>
  ${viewPrecision(M)}`;
}

function viewPrecision(M) {
  const fotos = (S.fotos || []).slice().sort((a, b) => b.fecha.localeCompare(a.fecha));
  const sel = fotos.find((f) => f.id === UI.fotoSel) || fotos[fotos.length - 1];
  const tools = `<button class="btn btn-sm" data-action="foto-guardar">${icon('plus', 14)}Guardar foto de la proyección</button>`;
  if (!sel) return `<section class="panel"><div class="panel-head"><div><h2>Precisión de la proyección</h2><div class="sub">Se guarda una foto automática al empezar cada mes; también podés guardarla a mano.</div></div>${tools}</div><div class="panel-body"><div class="empty">Todavía no hay fotos guardadas.</div></div></section>`;
  const meses = M.months.filter((mk) => sel.meses[mk] && mk >= sel.mes && mk < M.curMonth);
  const real = (mk) => {
    const mi = M.cal.midx.get(mk);
    const s4 = (arr) => sum(arr.slice(mi * 4, mi * 4 + 4));
    return { ventas: M.ventasReal[mi], cobranzas: s4(M.secTot.ing.eff), egresos: s4(M.secTot.egr.eff) + s4(M.secTot.fin.eff), saldo: M.saldo.eff.fin[mi * 4 + 3], rn: M.eerr.proy.rn[mi] };
  };
  const conceptos = [['ventas', 'Ventas'], ['cobranzas', 'Ingresos de caja'], ['egresos', 'Egresos de caja'], ['saldo', 'Saldo final'], ['rn', 'Resultado neto']];
  let tabla = '<div class="empty">Esta foto todavía no tiene meses terminados para comparar. Volvé cuando termine el mes.</div>';
  if (meses.length) {
    tabla = `<div class="tbl-wrap"><table class="rep"><thead><tr><th class="lbl">${esc(S.empresa.simbolo)}</th>${meses.map((mk) => `<th colspan="3">${esc(mLabel(mk))}</th>`).join('')}</tr><tr><th class="lbl"></th>${meses.map(() => '<th>Proyectado</th><th>Real</th><th>Desvío</th>').join('')}</tr></thead><tbody>${conceptos.map(([k, l]) => `<tr><td class="lbl">${l}</td>${meses.map((mk) => { const p = sel.meses[mk][k], r = real(mk)[k]; const dv = Math.abs(p) > 0.5 ? (r - p) / Math.abs(p) : null; return `<td>${fmt(p, { dash: true })}</td><td><b>${fmt(r, { dash: true })}</b></td><td class="${dv != null && Math.abs(dv) > 0.15 ? 'neg' : ''}">${dv == null ? '–' : fmtPct(dv, 0)}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return `<section class="panel"><div class="panel-head"><div><h2>Precisión de la proyección</h2><div class="sub">Compara lo que se proyectaba en una foto guardada contra lo que pasó en los meses ya terminados. Desvíos de más de 15 % en rojo.</div></div><div class="toolbar"><select id="foto-sel" aria-label="Foto" style="width:auto">${fotos.map((f) => `<option value="${f.id}" ${f.id === sel.id ? 'selected' : ''}>${esc(f.etiqueta)}${f.escenario && f.escenario !== 'base' ? ` · ${esc(ESCENARIOS[f.escenario])}` : ''}</option>`).join('')}</select>${tools}<button class="btn btn-sm btn-ghost btn-danger" data-action="foto-eliminar" data-id="${sel.id}" aria-label="Eliminar foto">${icon('trash', 14)}</button></div></div><div class="panel-body">${tabla}</div></section>`;
}

   Aplicación: guardado, render, formularios (modales), acciones y eventos

const VIEWS = { tablero: viewTablero, flujo: viewFlujo, ventas: viewVentas, compras: viewCompras, bancos: viewBancos, prestamos: viewPrestamos, plan: viewPlan, produccion: viewProduccion, eerr: viewEERR, balance: viewBalance, indicadores: viewIndicadores, escenarios: viewEscenarios, config: viewConfig };

/* ---------- ciclo de cambios ---------- */
let renderPending = false;
function commit(fn, { silent = false } = {}) {
  if (SERVIDOR && SRV.rol === 'lector') { toast('Tu usuario es de solo lectura en esta empresa: los cambios no se guardan.', true); scheduleRender(); return; }
  fn(S);
  MODEL = null;
  save();
  if (!silent) scheduleRender();
}
function scheduleRender() {
  if (renderPending) return;
  renderPending = true;
  setTimeout(() => { renderPending = false; render(); }, 0);
}
let pendingFocus = null;
function render() {
  const M = model();
  renderChrome(M);
  const scrolls = {};
  $$('[data-scroll]').forEach((el) => { scrolls[el.dataset.scroll] = [el.scrollLeft, el.scrollTop]; });
  const winY = window.scrollY;
  const active = document.activeElement;
  const fk = pendingFocus || (active && active.dataset ? active.dataset.fk : null);
  const activeId = !fk && active && active.id && active.closest('#view') ? active.id : null;
  pendingFocus = null;
  CHARTS.clear();
  const fnView = VIEWS[UI.view] || VIEWS.tablero;
  $('#view').innerHTML = fnView(M);
  bindCharts();
  $$('[data-scroll]').forEach((el) => { const s = scrolls[el.dataset.scroll]; if (s) { el.scrollLeft = s[0]; el.scrollTop = s[1]; } });
  if (Math.abs(window.scrollY - winY) > 1) window.scrollTo(0, winY);
  if (fk) {
    const el = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`);
    if (el) { el.focus({ preventScroll: true }); }
  } else if (activeId) {
    const el = document.getElementById(activeId);
    if (el) { el.focus({ preventScroll: true }); if (el.setSelectionRange && el.type === 'text') { const n = el.value.length; el.setSelectionRange(n, n); } }
  }
}

/* ---------- avisos y modales ---------- */
function toast(msg, err = false) {
  const t = document.createElement('div');
  t.className = `toast${err ? ' err' : ''}`;
  t.textContent = msg;
  const box = $('#toasts');
  while (box.children.length >= 3) box.firstChild.remove();
  box.append(t);
  setTimeout(() => t.remove(), err ? 6500 : 3800);
}
let modalOnClose = null;
function openModal({ title, sub = '', body, foot, wide = false, onMount }) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-back" data-modal-back><div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header><h2 id="modal-title">${esc(title)}</h2>${sub ? `<p>${sub}</p>` : ''}</header><div class="body">${body}</div><footer>${foot}</footer></div></div>`;
  const m = root.querySelector('.modal');
  if (onMount) onMount(m);
  const first = m.querySelector('input:not([type=hidden]):not([readonly]),select,textarea,button.btn-primary');
  setTimeout(() => { if (first && !m.contains(document.activeElement)) first.focus(); }, 20);
  return m;
}
function closeModal() {
  $('#modal-root').innerHTML = '';
  if (modalOnClose) { const f = modalOnClose; modalOnClose = null; f(); }
}
function confirmar({ title, text, ok = 'Confirmar', danger = false }) {
  return new Promise((resolve) => {
    modalOnClose = () => resolve(false);
    openModal({
      title, body: `<p>${text}</p>`,
      foot: `<button class="btn" data-action="modal-cerrar">Cancelar</button><button class="btn ${danger ? 'btn-primary btn-danger' : 'btn-primary'}" id="confirm-ok">${esc(ok)}</button>`,
      onMount: (m) => { m.querySelector('#confirm-ok').addEventListener('click', () => { modalOnClose = null; closeModal(); resolve(true); }); },
    });
  });
}
const val = (m, id) => { const el = m.querySelector(`#${id}`); return el ? el.value : ''; };
const numVal = (m, id) => parseNumber(val(m, id));
function selectClientes(id, current, withNew = true) {
  const opts = S.clientes.slice().sort((a, b) => a.nombre.localeCompare(b.nombre, 'es')).map((c) => `<option value="${c.id}" ${c.id === current ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('');
  return `<select id="${id}"><option value="">Elegir cliente…</option>${opts}${withNew ? '<option value="__nuevo">+ Cliente nuevo…</option>' : ''}</select>`;
}
function selectProductos(id, current) {
  return `<select id="${id}"><option value="">Sin producto (monto global)</option>${S.productos.slice().sort((a, b) => a.nombre.localeCompare(b.nombre, 'es')).map((p) => `<option value="${p.id}" ${p.id === current ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select>`;
}
function selectProveedores(id, current) {
  const opts = S.proveedores.slice().sort((a, b) => a.nombre.localeCompare(b.nombre, 'es')).map((c) => `<option value="${c.id}" ${c.id === current ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('');
  return `<select id="${id}"><option value="">Elegir proveedor…</option>${opts}<option value="__nuevo">+ Proveedor nuevo…</option></select>`;
}
function resolverParte(lista, que, m, idSel, idNuevo, plazo) {
  const sel = val(m, idSel);
  if (sel === '__nuevo') {
    const nombre = val(m, idNuevo).trim();
    if (!nombre) return { error: `Escribí el nombre del ${que} nuevo.` };
    const ex = lista.find((c) => claveCliente(c.nombre) === claveCliente(nombre));
    if (ex) return { id: ex.id };
    const c = { id: uid(que === 'cliente' ? 'c' : 'pv'), nombre, plazo: Math.max(0, Math.round(plazo || 0)), ruc: '', nota: '' };
    return { id: c.id, nuevo: c };
  }
  if (!sel) return { error: `Elegí un ${que}.` };
  return { id: sel };
}
const resolverCliente = (m, idSel, idNuevo, plazo) => resolverParte(S.clientes, 'cliente', m, idSel, idNuevo, plazo);
const resolverProveedor = (m, idSel, idNuevo, plazo) => resolverParte(S.proveedores, 'proveedor', m, idSel, idNuevo, plazo);
/* Moneda del documento: selector y tipo de cambio (visible solo si no es la moneda base). */
function camposMoneda(pre, moneda, tc) {
  const mon = moneda || monedaBase();
  return `<div class="field"><label for="${pre}-moneda">Moneda</label><select id="${pre}-moneda">${Object.entries(MONEDAS).map(([k, v]) => `<option value="${k}" ${k === mon ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
  <div class="field" data-tc="${pre}" ${mon === monedaBase() ? 'hidden' : ''}><label for="${pre}-tc">Tipo de cambio (Gs. por US$)</label><input type="text" inputmode="decimal" id="${pre}-tc" class="money" value="${esc(rawNum(tc || S.empresa.tc))}"></div>`;
}
function leerMoneda(m, pre) {
  const moneda = val(m, `${pre}-moneda`) || monedaBase();
  if (moneda === monedaBase()) return { moneda, tc: null };
  const tc = numVal(m, `${pre}-tc`);
  return { moneda, tc, error: isNum(tc) && tc > 0 ? '' : 'Indicá el tipo de cambio (Gs. por US$).' };
}
const syncMoneda = (m, pre) => { const el = m.querySelector(`[data-tc="${pre}"]`); if (el) el.hidden = val(m, `${pre}-moneda`) === monedaBase(); };
const selectIva = (id, v) => `<select id="${id}">${[[10, '10 %'], [5, '5 %'], [0, 'Exenta (0 %)']].map(([k, l]) => `<option value="${k}" ${Number(v) === k ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
function genCuotas(fecha, monto, credito, plazo, n, cada) {
  if (!credito) return [{ vence: fecha, monto: r2(monto) }];
  n = Math.max(1, Math.round(n || 1));
  const q = r2(monto / n);
  const out = [];
  for (let k = 0; k < n; k++) out.push({ vence: addDays(fecha, Math.max(0, Math.round(plazo || 0)) + k * Math.max(1, Math.round(cada || 30))), monto: k === n - 1 ? r2(monto - q * (n - 1)) : q });
  return out;
}

const ivaDeDoc = (d) => { const t = totalDoc(d), n = netoDoc(d); return n > 0 ? Math.round(((t - n) / n) * 1000) / 10 : 0; };

/* ---------- venta ---------- */
function modalVenta(ventaId) {

  const cuotas = v ? v.cuotas : [];
  const credito = v ? daysBetween(v.fecha, cuotas[0].vence) > 0 || cuotas.length > 1 : false;
  const plazo0 = v && credito ? daysBetween(v.fecha, cuotas[0].vence) : 30;
  const cada0 = v && cuotas.length > 1 ? daysBetween(cuotas[0].vence, cuotas[1].vence) : 30;
  const iva0 = v ? (isNum(v.iva) ? v.iva : ivaDeDoc(v)) : S.config.ivaVentas;
  const mesesOpt = M.months.map((mk) => `<option value="${mk}">${esc(mLabel(mk))}</option>`).join('');
  const body = `

    ${camposMoneda('v', v ? v.moneda : monedaBase(), v ? v.tc : null)}
    <div class="field"><label for="v-cantidad">Cantidad</label><input type="text" inputmode="decimal" id="v-cantidad" class="money" value="${v && isNum(v.cantidad) ? rawNum(v.cantidad) : '1'}"></div>
    <div class="field"><label for="v-precio">Precio unitario sin IVA</label><input type="text" inputmode="decimal" id="v-precio" class="money" value="${v && isNum(v.precio) ? rawNum(v.precio) : ''}" placeholder="0"></div>
    <div class="field"><label for="v-iva">IVA</label>${selectIva('v-iva', iva0)}</div>
    <div class="field span2"><label>Total de la venta</label><div id="v-total" style="font:600 18px var(--font-num);padding-top:2px">–</div></div>
  </div>
  <div class="form-grid">
    <div class="field"><label for="v-cond">Condición de cobro</label><select id="v-cond"><option value="contado" ${!credito ? 'selected' : ''}>Contado</option><option value="credito" ${credito ? 'selected' : ''}>Crédito</option></select></div>
    <div class="field" data-credito><label for="v-plazo">Primer vencimiento (días)</label><input type="number" id="v-plazo" min="0" step="1" value="${plazo0}"></div>
    <div class="field" data-credito><label for="v-cuotas">Cuotas</label><input type="number" id="v-cuotas" min="1" max="36" step="1" value="${v ? Math.max(1, cuotas.length) : 1}"></div>
    <div class="field" data-credito><label for="v-cada">Días entre cuotas</label><input type="number" id="v-cada" min="1" step="1" value="${cada0}"></div>

    <div class="field"><label for="v-factura">Factura N°</label><input type="text" id="v-factura" value="${esc(v ? v.factura : '')}" placeholder="001-001-0000000"></div>
    <div class="field span2"><label for="v-nota">Nota</label><input type="text" id="v-nota" value="${esc(v ? v.nota : '')}"></div>
  </div>
  <div class="inline-note" id="v-preview" aria-live="polite"></div>

    body,
    foot: `${v ? `<button class="btn btn-danger" data-action="venta-eliminar" data-id="${v.id}" style="margin-right:auto">Eliminar</button>` : ''}<button class="btn" data-action="modal-cerrar">Cancelar</button><button class="btn btn-primary" id="v-guardar">${v ? 'Guardar cambios' : 'Registrar venta'}</button>`,
  });

  m.querySelector('#v-guardar').addEventListener('click', () => {

    if (!isISODate(f)) { err.textContent = 'Indicá la fecha de la venta.'; return; }
    const cred = val(m, 'v-cond') === 'credito';
    const cli = resolverCliente(m, 'v-cliente', 'v-cliente-nuevo', cred ? Number(val(m, 'v-plazo')) : 0);
    if (cli.error) { err.textContent = cli.error; return; }
    const cant = numVal(m, 'v-cantidad'), pr = numVal(m, 'v-precio');
    if (!isNum(cant) || cant <= 0) { err.textContent = 'La cantidad tiene que ser mayor a cero.'; return; }
    if (!isNum(pr) || pr <= 0) { err.textContent = 'El precio unitario tiene que ser mayor a cero.'; return; }
    const mon = leerMoneda(m, 'v');
    if (mon.error) { err.textContent = mon.error; return; }
    const c = calc();
    const costoTxt = val(m, 'v-costo').trim();
    const costo = costoTxt ? parseNumber(costoTxt) : null;
    if (costoTxt && !isNum(costo)) { err.textContent = 'No entendí el costo unitario. Escribilo como número, por ejemplo 480 o 480,50.'; return; }
    const cs = genCuotas(f, c.total, cred, Number(val(m, 'v-plazo')), Number(val(m, 'v-cuotas')), Number(val(m, 'v-cada')));
    const data = { fecha: f, clienteId: cli.id, productoId: val(m, 'v-producto') || null, cantidad: cant, precio: pr, costoUnit: isNum(costo) ? costo : null, monto: c.neto, iva: c.iva, moneda: mon.moneda, tc: mon.tc, cuotas: cs, factura: val(m, 'v-factura').trim(), planMes: planSel.value || null, nota: val(m, 'v-nota').trim() };
    const cobrada = !v && !cred && m.querySelector('#v-cobrada').checked;
    if (v) {
      const cobrado = sum(S.cobros.filter((x) => x.ventaId === v.id).map((x) => x.monto));
      if (cobrado > c.total + 0.004) { err.textContent = `Esta venta ya tiene cobros por ${moneyIn(cobrado, v.moneda)}. Eliminá cobros antes de bajar el total.`; return; }
    }
    commit((st) => {
      if (cli.nuevo) st.clientes.push(cli.nuevo);
      if (v) Object.assign(st.ventas.find((x) => x.id === v.id), data);
      else {
        const nv = { id: uid('v'), origen: 'venta', ...data };
        st.ventas.push(nv);
        if (cobrada) st.cobros.push({ id: uid('cb'), ventaId: nv.id, fecha: f, monto: c.total, tc: mon.tc, nota: 'Contado' });
      }
    });
    closeModal();
    const i = model().wOf(cs[0].vence);
    toast(v ? 'Venta actualizada.' : `Venta registrada: ${moneyIn(c.total, mon.moneda)}. ${cobrada ? 'Cobro cargado como real' : `Cobro previsto el ${fmtDate(cs[0].vence)}${i >= 0 && i < model().nW ? ` (${weekLabel(model().weeks[i])})` : ''}`}.`);
  });
}

/* ---------- compra ---------- */
function sugerirLinea(proveedorId) {
  const p = S.proveedores.find((x) => x.id === proveedorId);
  if (!p) return '';
  const k = claveCliente(p.nombre).split(' ')[0];
  if (!k || k.length < 3) return '';
  const l = S.lineas.find((x) => { const g = S.grupos.find((y) => y.id === x.grupoId); return g && g.sec === 'egr' && claveCliente(x.nombre).split(' ')[0] === k; });
  return l ? l.id : '';
}
function modalCompra(compraId) {
  const M = model();
  const c = compraId ? S.compras.find((x) => x.id === compraId) : null;
  if (c && c.origen === 'saldo_inicial') { modalSaldoInicial('compra', c.id); return; }
  const fecha = c ? c.fecha : (M.HOY >= M.cal.start && M.HOY <= M.cal.end ? M.HOY : M.cal.start);
  const cuotas = c ? c.cuotas : [];
  const credito = c ? daysBetween(c.fecha, cuotas[0].vence) > 0 || cuotas.length > 1 : true;
  const plazo0 = c && credito ? daysBetween(c.fecha, cuotas[0].vence) : 30;
  const cada0 = c && cuotas.length > 1 ? daysBetween(cuotas[0].vence, cuotas[1].vence) : 30;
  const iva0 = c ? (isNum(c.iva) ? c.iva : ivaDeDoc(c)) : S.config.ivaCompras;
  const lineasEgr = S.grupos.filter((g) => g.sec === 'egr' && !g.auto).map((g) => {
    const ls = S.lineas.filter((l) => l.grupoId === g.id);
    return ls.length ? `<optgroup label="${esc(g.nombre)}">${ls.map((l) => `<option value="${l.id}">${esc(l.nombre)}</option>`).join('')}</optgroup>` : '';
  }).join('');
  const m = openModal({
    title: c ? 'Editar compra' : 'Registrar compra', wide: true,
    sub: 'La compra agenda su pago en el flujo según el plazo, va al inventario o al EERR según su destino, y su IVA es crédito fiscal.',
    body: `
    <div class="form-grid">
      <div class="field"><label for="k-fecha">Fecha de la compra</label><input type="date" id="k-fecha" value="${fecha}"></div>
      <div class="field"><label for="k-prov">Proveedor</label>${selectProveedores('k-prov', c ? c.proveedorId : '')}</div>
      <div class="field span2" id="k-nuevo-wrap" hidden><label for="k-prov-nuevo">Nombre del proveedor nuevo</label><input type="text" id="k-prov-nuevo" placeholder="Razón social"></div>
      <div class="field"><label for="k-destino">Destino</label><select id="k-destino">${DESTINOS_COMPRA.map((d) => `<option value="${d}" ${(c ? c.destino : 'compra') === d ? 'selected' : ''}>${esc(DESTINO_LABEL[d])}</option>`).join('')}</select></div>
      ${(S.insumos || []).length ? `<div class="field"><label for="k-insumo">Materia prima (plan de producción)</label><select id="k-insumo"><option value="">No es materia prima con receta</option>${S.insumos.slice().sort((a, b) => a.nombre.localeCompare(b.nombre, 'es')).map((i) => `<option value="${i.id}" ${c && c.insumoId === i.id ? 'selected' : ''}>${esc(i.nombre)}</option>`).join('')}</select></div>
      <div class="field" data-ton><label for="k-ton">Toneladas</label><input type="text" inputmode="decimal" id="k-ton" class="money" value="${c && isNum(c.toneladas) ? rawNum(c.toneladas) : ''}"><span class="hint">Suma al stock y descuenta las compras planificadas del insumo.</span></div>` : ''}
      <div class="field"><label for="k-concepto">Concepto</label><input type="text" id="k-concepto" value="${esc(c ? c.concepto : '')}" placeholder="Urea, bolsas, flete…"></div>
      ${camposMoneda('k', c ? c.moneda : monedaBase(), c ? c.tc : null)}
      <div class="field"><label for="k-monto">Monto sin IVA</label><input type="text" inputmode="decimal" id="k-monto" class="money" value="${c ? rawNum(c.monto) : ''}" placeholder="0"></div>
      <div class="field"><label for="k-iva">IVA</label>${selectIva('k-iva', iva0)}</div>
      <div class="field span2"><label>Total de la compra</label><div id="k-total" style="font:600 18px var(--font-num);padding-top:2px">–</div></div>
    </div>
    <div class="form-grid">
      <div class="field"><label for="k-cond">Condición de pago</label><select id="k-cond"><option value="contado" ${!credito ? 'selected' : ''}>Contado</option><option value="credito" ${credito ? 'selected' : ''}>Crédito</option></select></div>
      <div class="field" data-credito><label for="k-plazo">Primer vencimiento (días)</label><input type="number" id="k-plazo" min="0" step="1" value="${plazo0}"></div>
      <div class="field" data-credito><label for="k-cuotas">Cuotas</label><input type="number" id="k-cuotas" min="1" max="36" step="1" value="${c ? Math.max(1, cuotas.length) : 1}"></div>
      <div class="field" data-credito><label for="k-cada">Días entre cuotas</label><input type="number" id="k-cada" min="1" step="1" value="${cada0}"></div>
      <label class="check span2" data-contado ${c ? 'hidden' : ''}><input type="checkbox" id="k-pagada" checked> Pagada en el momento (registra el pago)</label>
    </div>
    <div class="form-grid">
      <div class="field span2"><label for="k-linea">Descontar de la proyección de</label><select id="k-linea"><option value="">No descontar (compra no proyectada)</option>${lineasEgr}</select><span class="hint">Si esta compra ya estaba proyectada en una línea del flujo, elegila para no contarla dos veces: se descuenta de la proyección del mes.</span></div>
      <div class="field"><label for="k-factura">Factura N°</label><input type="text" id="k-factura" value="${esc(c ? c.factura : '')}"></div>
      <div class="field"><label for="k-nota">Nota</label><input type="text" id="k-nota" value="${esc(c ? c.nota : '')}"></div>
    </div>
    <div class="inline-note" id="k-preview" aria-live="polite"></div>
    <div class="err" id="k-err" role="alert"></div>`,
    foot: `${c ? `<button class="btn btn-danger" data-action="compra-eliminar" data-id="${c.id}" style="margin-right:auto">Eliminar</button>` : ''}<button class="btn" data-action="modal-cerrar">Cancelar</button><button class="btn btn-primary" id="k-guardar">${c ? 'Guardar cambios' : 'Registrar compra'}</button>`,
  });
  const lineaSel = m.querySelector('#k-linea');
  lineaSel.value = c ? (c.lineaId || '') : '';
  let lineaTocada = !!c;
  lineaSel.addEventListener('change', () => { lineaTocada = true; });
  const calc = () => {
    const neto = numVal(m, 'k-monto');
    if (!isNum(neto)) return null;
    const iva = Number(val(m, 'k-iva')) || 0;
    return { neto: r2(neto), iva, total: r2(neto * (1 + iva / 100)) };
  };
  const insSel = m.querySelector('#k-insumo');
  if (insSel) insSel.addEventListener('change', () => {
    const i = S.insumos.find((x) => x.id === insSel.value);
    if (!i || c) return;
    if (i.proveedorId && !val(m, 'k-prov')) { m.querySelector('#k-prov').value = i.proveedorId; const p = S.proveedores.find((x) => x.id === i.proveedorId); if (p) { m.querySelector('#k-cond').value = (i.plazo || p.plazo) > 0 ? 'credito' : 'contado'; m.querySelector('#k-plazo').value = i.plazo || p.plazo || 30; } }
    if (!val(m, 'k-concepto')) m.querySelector('#k-concepto').value = i.nombre;
    m.querySelector('#k-destino').value = 'compra';
    m.querySelector('#k-iva').value = String(Number(i.iva) || 0);
  });
  const tonIn = m.querySelector('#k-ton');
  if (tonIn) tonIn.addEventListener('input', () => {
    const i = S.insumos.find((x) => x.id === (insSel && insSel.value));
    const t = numVal(m, 'k-ton');
    if (i && isNum(t) && t > 0 && val(m, 'k-moneda') === monedaBase() && !c) m.querySelector('#k-monto').value = rawNum(r2(t * i.precio));
  });
  const upd = () => {
    m.querySelectorAll('[data-ton]').forEach((x) => { x.hidden = !(insSel && insSel.value); });
    m.querySelector('#k-nuevo-wrap').hidden = val(m, 'k-prov') !== '__nuevo';
    syncMoneda(m, 'k');
    const cred = val(m, 'k-cond') === 'credito';
    m.querySelectorAll('[data-credito]').forEach((x) => { x.hidden = !cred; });
    m.querySelectorAll('[data-contado]').forEach((x) => { x.hidden = cred || !!c; });
    const k = calc();
    const mon = leerMoneda(m, 'k');
    const fb = mon.error ? null : factorBase(mon.moneda, mon.tc);
    m.querySelector('#k-total').innerHTML = k ? `${moneyIn(k.total, mon.moneda)} <span class="muted small" style="font-weight:400">neto ${fmt(k.neto)} + IVA ${fmt(k.total - k.neto)}${fb && mon.moneda !== monedaBase() ? ` · ${money(k.total * fb)}` : ''}</span>` : '–';
    const f = val(m, 'k-fecha');
    const prev = m.querySelector('#k-preview');
    if (k && k.total > 0 && isISODate(f)) {
      const cs = genCuotas(f, k.total, cred, Number(val(m, 'k-plazo')), Number(val(m, 'k-cuotas')), Number(val(m, 'k-cada')));
      const txt = cs.map((q) => { const i = M.wOf(q.vence); return `${moneyIn(q.monto, mon.moneda)} el ${fmtDate(q.vence)}${i >= 0 && i < M.nW ? ` (${weekLabel(M.weeks[i])})` : ' (fuera del período)'}`; }).join(' · ');
      const pagadaYa = !cred && !c && m.querySelector('#k-pagada').checked;
      const dest = val(m, 'k-destino');
      const efecto = dest === 'compra' ? 'suma al inventario' : dest === 'inversion' ? 'suma a bienes de uso (se deprecia)' : `suma a ${DESTINO_LABEL[dest].toLowerCase()} del EERR`;
      const ln = S.lineas.find((x) => x.id === lineaSel.value);
      prev.innerHTML = `<b>${pagadaYa ? 'Pago registrado como real' : 'Pago agendado en «Pagos a proveedores»'}:</b> ${txt}.<br>El neto ${fb ? money(k.neto * fb) : ''} ${efecto} en ${esc(mLabel(monthOf(f)))}${k.iva ? `; IVA crédito ${fb ? money((k.total - k.neto) * fb) : ''}` : ''}${ln ? `; descuenta la proyección de «${esc(ln.nombre)}»` : ''}.`;
    } else prev.textContent = 'Completá el monto para ver cómo impacta en el flujo, el EERR y el balance.';
  };
  m.querySelector('#k-prov').addEventListener('change', () => {
    const p = S.proveedores.find((x) => x.id === val(m, 'k-prov'));
    if (p && !c) { m.querySelector('#k-cond').value = p.plazo > 0 ? 'credito' : 'contado'; m.querySelector('#k-plazo').value = p.plazo || 30; }
    if (!lineaTocada) lineaSel.value = sugerirLinea(val(m, 'k-prov'));
    upd();
  });
  m.addEventListener('input', upd);
  m.addEventListener('change', upd);
  upd();
  m.querySelector('#k-guardar').addEventListener('click', () => {
    const err = m.querySelector('#k-err');
    const f = val(m, 'k-fecha');
    if (!isISODate(f)) { err.textContent = 'Indicá la fecha de la compra.'; return; }
    const cred = val(m, 'k-cond') === 'credito';
    const pv = resolverProveedor(m, 'k-prov', 'k-prov-nuevo', cred ? Number(val(m, 'k-plazo')) : 0);
    if (pv.error) { err.textContent = pv.error; return; }
    const k = calc();
    if (!k || k.neto <= 0) { err.textContent = 'El monto tiene que ser mayor a cero.'; return; }
    const mon = leerMoneda(m, 'k');
    if (mon.error) { err.textContent = mon.error; return; }
    const cs = genCuotas(f, k.total, cred, Number(val(m, 'k-plazo')), Number(val(m, 'k-cuotas')), Number(val(m, 'k-cada')));
    const insumoId = insSel ? insSel.value || null : null;
    const toneladas = insumoId ? numVal(m, 'k-ton') : null;
    if (insumoId && !(isNum(toneladas) && toneladas > 0)) { err.textContent = 'Indicá las toneladas compradas del insumo.'; return; }
    const data = { insumoId, toneladas, fecha: f, proveedorId: pv.id, destino: val(m, 'k-destino'), concepto: val(m, 'k-concepto').trim(), monto: k.neto, iva: k.iva, moneda: mon.moneda, tc: mon.tc, cuotas: cs, lineaId: lineaSel.value || null, factura: val(m, 'k-factura').trim(), nota: val(m, 'k-nota').trim() };
    const pagada = !c && !cred && m.querySelector('#k-pagada').checked;
    if (c) {
      const pagado = sum(S.pagos.filter((x) => x.compraId === c.id).map((x) => x.monto));
      if (pagado > k.total + 0.004) { err.textContent = `Esta compra ya tiene pagos por ${moneyIn(pagado, c.moneda)}. Eliminá pagos antes de bajar el total.`; return; }
    }
    commit((st) => {
      if (pv.nuevo) st.proveedores.push(pv.nuevo);
      if (c) Object.assign(st.compras.find((x) => x.id === c.id), data);
      else {
        const nc = { id: uid('k'), origen: 'compra', ...data };
        st.compras.push(nc);
        if (pagada) st.pagos.push({ id: uid('pg'), compraId: nc.id, fecha: f, monto: k.total, tc: mon.tc, nota: 'Contado' });
      }
    });
    closeModal();
    toast(c ? 'Compra actualizada.' : `Compra registrada: ${moneyIn(k.total, mon.moneda)}. ${pagada ? 'Pago cargado como real' : `Pago previsto el ${fmtDate(cs[0].vence)}`}.`);
  });
}

/* ---------- saldos iniciales de clientes y proveedores ---------- */
function modalSaldoInicial(kind, docId) {
  const M = model();
  const venta = kind === 'venta';
  const lista = venta ? S.ventas : S.compras;
  const d = docId ? lista.find((x) => x.id === docId) : null;
  const venc = d ? d.cuotas[0].vence : addDays(M.HOY, 30);
  const m = openModal({
    title: d ? `Editar saldo inicial de ${venta ? 'cliente' : 'proveedor'}` : `Saldo inicial de ${venta ? 'cliente' : 'proveedor'}`,
    sub: `${venta ? 'Deuda del cliente' : 'Deuda con el proveedor'} anterior al ${fmtDate(M.cal.start)}. Se agenda su ${venta ? 'cobro' : 'pago'} en el flujo y forma parte del balance inicial.`,
    body: `<div class="form-grid">
      <div class="field span2"><label for="s-parte">${venta ? 'Cliente' : 'Proveedor'}</label>${venta ? selectClientes('s-parte', d ? d.clienteId : '') : selectProveedores('s-parte', d ? d.proveedorId : '')}</div>
      <div class="field span2" id="s-nuevo-wrap" hidden><label for="s-parte-nuevo">Nombre</label><input type="text" id="s-parte-nuevo"></div>
      ${camposMoneda('s', d ? d.moneda : monedaBase(), d ? d.tc : null)}
      <div class="field"><label for="s-monto">Monto</label><input type="text" inputmode="decimal" id="s-monto" class="money" value="${d ? rawNum(totalDoc(d)) : ''}"></div>
      <div class="field"><label for="s-vence">Vencimiento</label><input type="date" id="s-vence" value="${venc}"></div>
      <div class="field"><label for="s-doc">Documento</label><input type="text" id="s-doc" value="${esc(d ? d.factura : 'Saldo inicial')}"></div>
      <div class="field span2"><label for="s-nota">Nota</label><input type="text" id="s-nota" value="${esc(d ? d.nota : '')}"></div>
    </div><div class="err" id="s-err" role="alert"></div>`,
    foot: `${d ? `<button class="btn btn-danger" data-action="${venta ? 'venta-eliminar' : 'compra-eliminar'}" data-id="${d.id}" style="margin-right:auto">Eliminar</button>` : ''}<button class="btn" data-action="modal-cerrar">Cancelar</button><button class="btn btn-primary" id="s-guardar">Guardar</button>`,
  });
  const upd = () => { m.querySelector('#s-nuevo-wrap').hidden = val(m, 's-parte') !== '__nuevo'; syncMoneda(m, 's'); };
  m.addEventListener('change', upd); upd();
  m.querySelector('#s-guardar').addEventListener('click', () => {
    const err = m.querySelector('#s-err');
    const parte = venta ? resolverCliente(m, 's-parte', 's-parte-nuevo', 0) : resolverProveedor(m, 's-parte', 's-parte-nuevo', 0);
    if (parte.error) { err.textContent = parte.error; return; }
    const monto = numVal(m, 's-monto');
    if (!isNum(monto) || monto <= 0) { err.textContent = 'El monto tiene que ser mayor a cero.'; return; }
    const vence = val(m, 's-vence');
    if (!isISODate(vence)) { err.textContent = 'Indicá el vencimiento.'; return; }
    const mon = leerMoneda(m, 's');
    if (mon.error) { err.textContent = mon.error; return; }
    const base = { origen: 'saldo_inicial', fecha: addDays(M.cal.start, -1), monto: r2(monto), iva: 0, moneda: mon.moneda, tc: mon.tc, cuotas: [{ vence, monto: r2(monto) }], factura: val(m, 's-doc').trim(), nota: val(m, 's-nota').trim() };
    const data = venta ? { ...base, clienteId: parte.id, productoId: null, cantidad: null, precio: null, costoUnit: null, planMes: null } : { ...base, proveedorId: parte.id, destino: 'compra', concepto: 'Saldo inicial', lineaId: null };
    commit((st) => {
      if (parte.nuevo) (venta ? st.clientes : st.proveedores).push(parte.nuevo);
      const arr = venta ? st.ventas : st.compras;
      if (d) Object.assign(arr.find((x) => x.id === d.id), data); else arr.push({ id: uid(venta ? 'v' : 'k'), ...data });
    });
    closeModal();
    toast('Saldo inicial guardado.');
  });
}

/* ---------- cobros y pagos ---------- */
function modalCobroPago(kind, docId) {
  const M = model();
  const venta = kind === 'venta';
  const c = (venta ? M.cuentas : M.cuentasPagar).find((x) => x.v.id === docId);
  if (!c) return;
  const d = c.v;
  const mon = d.moneda || monedaBase();
  const otra = mon !== monedaBase();
  const verbo = venta ? 'cobro' : 'pago';
  const m = openModal({
    title: venta ? 'Registrar cobro' : 'Registrar pago',
    sub: `${esc(venta ? nombreCliente(d.clienteId) : nombreProveedor(d.proveedorId))} · ${esc(d.factura || 'sin documento')} · saldo ${moneyIn(c.saldo, mon)}`,
    body: `<div class="form-grid">
      <div class="field"><label for="c-fecha">Fecha del ${verbo}</label><input type="date" id="c-fecha" value="${M.HOY}"></div>
      <div class="field"><label for="c-monto">Monto (${MONEDAS[mon]})</label><input type="text" inputmode="decimal" id="c-monto" class="money" value="${rawNum(c.saldo)}"></div>
      ${otra ? `<div class="field"><label for="c-tc">Tipo de cambio del día (Gs. por US$)</label><input type="text" inputmode="decimal" id="c-tc" class="money" value="${esc(rawNum(S.empresa.tc || d.tc))}"><span class="hint">El documento se registró a ${fmt(d.tc)}. La diferencia va al EERR como diferencia de cambio.</span></div>` : ''}
      <div class="field span2"><label for="c-nota">Nota</label><input type="text" id="c-nota" placeholder="Transferencia, cheque, retención…"></div>
    </div><div class="inline-note" id="c-prev"></div><div class="err" id="c-err" role="alert"></div>`,
    foot: `<button class="btn" data-action="modal-cerrar">Cancelar</button><button class="btn btn-primary" id="c-guardar">Registrar ${verbo}</button>`,
  });
  const upd = () => {
    const f = val(m, 'c-fecha'), mo = numVal(m, 'c-monto');
    const tc = otra ? numVal(m, 'c-tc') : null;
    const i = isISODate(f) ? M.wOf(f) : -2;
    let txt = isNum(mo) && i >= 0 && i < M.nW ? `Se suma como ${verbo} real en ${weekLabel(M.weeks[i])} (${M.weeks[i].rango}).${M.closed[i] ? ' Esa semana está cerrada: su saldo real cambia.' : ''}${mo < c.saldo - 0.004 ? ` Queda pendiente ${moneyIn(c.saldo - mo, mon)}.` : ''}` : 'La fecha está fuera del período del flujo.';
    if (otra && isNum(mo) && isNum(tc) && tc > 0) {
      const caja = mo * factorBase(mon, tc), libro = mo * factorBase(mon, d.tc);
      const dif = venta ? caja - libro : libro - caja;
      txt += ` Equivale a ${money(caja)}${Math.abs(dif) > 0.5 ? `; diferencia de cambio ${dif > 0 ? 'a favor' : 'en contra'} de ${money(Math.abs(dif))}` : ''}.`;
    }
    m.querySelector('#c-prev').textContent = txt;
  };
  m.addEventListener('input', upd); upd();
  m.querySelector('#c-guardar').addEventListener('click', () => {
    const err = m.querySelector('#c-err');
    const f = val(m, 'c-fecha'), mo = numVal(m, 'c-monto');
    if (!isISODate(f)) { err.textContent = `Indicá la fecha del ${verbo}.`; return; }
    if (!isNum(mo) || mo <= 0) { err.textContent = 'El monto tiene que ser mayor a cero.'; return; }
    if (mo > c.saldo + 0.009) { err.textContent = `El monto supera el saldo pendiente (${moneyIn(c.saldo, mon)}).`; return; }
    const tc = otra ? numVal(m, 'c-tc') : null;
    if (otra && !(isNum(tc) && tc > 0)) { err.textContent = 'Indicá el tipo de cambio del día.'; return; }
    const monto = Math.abs(mo - c.saldo) < 0.01 ? c.saldo : r2(mo);
    const reg = { id: uid(venta ? 'cb' : 'pg'), fecha: f, monto, tc, nota: val(m, 'c-nota').trim() };
    commit((st) => { if (venta) st.cobros.push({ ...reg, ventaId: docId }); else st.pagos.push({ ...reg, compraId: docId }); });
    closeModal();
    toast(`${venta ? 'Cobro' : 'Pago'} registrado: ${moneyIn(mo, mon)}.`);
  });
}

    const cr = cronograma(d);

    prev.innerHTML = `Primera cuota ${fmtDate(cr[0].fecha)}: ${moneyIn(cr[0].capital + cr[0].interes, d.moneda)} (capital ${fmt(cr[0].capital)}, intereses ${fmt(cr[0].interes)}). Última: ${fmtDate(cr[cr.length - 1].fecha)}. Intereses totales ${moneyIn(tot, d.moneda)}.${d.fecha < M.cal.start ? ` Desembolso anterior al período: el saldo pendiente al ${fmtDate(M.cal.start)} entra al balance inicial.` : ''}`;

function modalCerrarSemana(i) {

  const cobrosPrev = sum(Array.from(M.cxcCli.values()).map((r) => r.proj[i]));
  const cobrosReal = sum(Array.from(M.cxcCli.values()).map((r) => r.real[i]));
  const lista = sinReal.slice(0, 8).map((x) => `<li>${esc(x.l.nombre)} <span class="muted">· ${fmt(x.proj[i])}</span></li>`).join('');
  const m = openModal({
    title: `Cerrar ${weekLabel(w)} · ${w.rango}`,
    sub: 'Al cerrar, el saldo de esta semana usa solo montos reales y queda bloqueada para editar (se puede reabrir).',
    body: `${sinReal.length ? `<div><p><b>${sinReal.length} ${sinReal.length === 1 ? 'línea tiene' : 'líneas tienen'} proyección sin real cargado:</b></p><ul class="small" style="margin:6px 0 0;padding-left:18px">${lista}${sinReal.length > 8 ? `<li>y ${sinReal.length - 8} más</li>` : ''}</ul></div>

      <div class="inline-note">Cobros de clientes: previstos ${fmt(cobrosPrev)} · registrados ${fmt(cobrosReal)}. Lo que no se registró como cobrado sigue pendiente y se espera en la semana actual.</div>`,
    foot: `<button class="btn" data-action="modal-cerrar">Cancelar</button><button class="btn btn-primary" id="cs-ok">${icon('lock', 15)}Cerrar semana</button>`,
  });

  });

/* ---------- detalle de celdas automáticas ---------- */
function modalDetalleAuto(auto, clienteId, i, capa) {
  const M = model();
  const w = M.weeks[i];
  let rows = '';
  const pagar = auto === 'cxp';
  if (auto === 'cxc' || pagar) {
    const lista = pagar ? M.cuentasPagar.filter((x) => x.v.proveedorId === clienteId) : M.cuentas.filter((x) => x.v.clienteId === clienteId);
    for (const c of lista) {
      if (capa === 'p') for (const q of c.cuotas) if (M.wOf(q.vence) === i) rows += `<tr><td>${esc(c.v.factura || (c.v.origen === 'saldo_inicial' ? 'Saldo inicial' : pagar ? 'Compra' : 'Venta'))}</td><td>Vence ${fmtDate(q.vence)}</td><td class="n">${fmtDoc(q.monto, c.v)}</td><td>${q.monto - q.cobrado <= 0.004 ? chip('good', pagar ? 'Pagado' : 'Cobrado') : q.vence < M.HOY ? chip('crit', 'Vencido') : chip('warn', 'Pendiente')}</td><td class="act">${c.saldo > 0.004 ? `<button class="btn btn-sm" data-action="${pagar ? 'pago-nuevo' : 'cobro-nuevo'}" data-id="${c.v.id}">${pagar ? 'Pagar' : 'Cobrar'}</button>` : ''}</td></tr>`;
      if (capa === 'r') for (const cb of c.cobros) if (M.wOf(cb.fecha) === i) rows += `<tr><td>${esc(c.v.factura || (pagar ? 'Compra' : 'Venta'))}</td><td>${pagar ? 'Pagado' : 'Cobrado'} ${fmtDate(cb.fecha)}</td><td class="n">${fmtDoc(cb.monto, c.v)}</td><td>${chip('good', 'Real')}</td><td></td></tr>`;
    }
  } else if (auto === 'mrp') {
    const x = M.stockMP.find((y) => y.ins.id === clienteId);
    if (x) {
      const anticipo = Math.max(0, Math.round(Number(x.ins.anticipo) || 0)), plazo = Math.max(0, Math.round(Number(x.ins.plazo) || 0));
      x.comprasPlan.forEach((t, mi) => {
        if (!(t > 0.0001)) return;
        const pm = Math.max(Math.min(M.curIdx, M.nM - 1), mi - anticipo);
        const vence = addDays(`${M.months[pm]}-15`, plazo);
        if (Math.max(M.wOf(vence), M.curC) !== i) return;
        rows += `<tr><td>${fmtT(t)} t para ${esc(mLabel(M.months[mi]))}</td><td>Pago ${fmtDate(vence)}</td><td class="n">${fmt(t * x.ins.precio * (1 + (Number(x.ins.iva) || 0) / 100))}</td><td>${chip('info', 'Planificada')}</td><td class="act"><button class="btn btn-sm" data-action="compra-nueva">Registrar compra</button></td></tr>`;
      });
    }
  } else {
    for (const f of M.planFilas.filter((x) => x.p.clienteId === clienteId)) {
      M.months.forEach((mk, mi) => {
        if (!(f.pend[mi] > 0.004)) return;
        const partes = [0, 1, 2, 3].filter((k) => M.wOf(addDays(`${mk}-${pad(WEEK_MID[k])}`, Math.max(0, Math.round(Number(f.p.plazo) || 0)))) === i).length;
        if (partes) rows += `<tr><td>${esc(nombreProducto(f.p.productoId))}</td><td>Plan de ${esc(mLabel(mk))}</td><td class="n">${fmt((f.pend[mi] * partes) / 4)}</td><td>${chip('info', 'Pendiente del plan')}</td><td></td></tr>`;
      });
    }
  }
  openModal({
    title: `${pagar ? nombreProveedor(clienteId) : auto === 'mrp' ? nombreInsumo(clienteId) : nombreCliente(clienteId)} · ${weekLabel(w)}`,
    sub: auto === 'mrp' ? `Compras de materia prima que calcula el plan de producción, con pago en la semana (${w.rango}).` : `${auto !== 'plan' ? (capa === 'p' ? 'Vencimientos previstos en la semana' : `${pagar ? 'Pagos' : 'Cobros'} registrados en la semana`) : 'Ventas del plan comercial que todavía no se registraron'} (${w.rango}).`,
    body: rows ? `<div class="tbl-wrap"><table class="list"><tbody>${rows}</tbody></table></div>` : '<p class="muted">Sin movimientos en esta semana.</p>',
    foot: `<button class="btn" data-action="ir" data-v="${auto === 'cxc' ? 'ventas' : pagar ? 'compras' : auto === 'mrp' ? 'produccion' : 'plan'}">${auto === 'cxc' ? 'Ir a cuentas por cobrar' : pagar ? 'Ir a cuentas por pagar' : auto === 'mrp' ? 'Ir a producción y stock' : 'Ir al plan comercial'}</button><button class="btn btn-primary" data-action="modal-cerrar">Listo</button>`,
    wide: true,
  });
}

/* Cambia la moneda de los reportes: convierte los montos cargados en la moneda anterior. */
function convertirMonedaBase(st, nueva) {
  const vieja = st.empresa.moneda || 'USD';
  if (nueva === vieja) return;
  const tc = Number(st.empresa.tc) || 1;
  const f = vieja === 'USD' ? tc : 1 / tc;
  const cv = (x) => (isNum(x) ? r6(x * f) : x);
  for (const lid of Object.keys(st.valores)) for (const wk of Object.keys(st.valores[lid])) {
    const c = st.valores[lid][wk];
    c.p = cv(c.p); c.r = cv(c.r); delete c.pf; delete c.rf;
    if (!isNum(c.p)) delete c.p;
    if (!isNum(c.r)) delete c.r;
  }
  for (const p of st.plan) p.precio = cv(p.precio);
  for (const p of st.productos) { p.precio = cv(p.precio); p.costo = cv(p.costo); }
  for (const k of ['saldoInicial', 'depMensual']) st.config[k] = cv(st.config[k]);
  for (const k of Object.keys(st.balanceInicial)) st.balanceInicial[k] = cv(st.balanceInicial[k]);
  for (const d of [...st.ventas, ...st.compras, ...st.prestamos]) { if (!d.moneda) d.moneda = vieja; if (d.moneda === vieja && !d.tc) d.tc = tc; if (d.moneda === nueva) d.tc = d.tc || tc; }
  st.presupuesto = null;
  st.empresa.moneda = nueva;
  st.empresa.simbolo = MONEDAS[nueva];
}

    <div class="inline-note" id="rc-prev" aria-live="polite"></div><div class="err" id="rc-err" role="alert"></div>`,
    foot: `${tieneReceta(p) ? '<button class="btn btn-danger" id="rc-quitar" style="margin-right:auto">Quitar receta</button>' : ''}<button class="btn" data-action="modal-cerrar">Cancelar</button><button class="btn btn-primary" id="rc-ok">Guardar receta</button>`,
  });
  const leer = () => {
    const receta = [];
    let bad = false;
    m.querySelectorAll('[data-rec]').forEach((el) => { const t = el.value.trim(); if (!t) return; const v = parseNumber(t); if (v == null || v < 0) { bad = true; return; } if (v > 0) receta.push({ insumoId: el.dataset.rec, t: v }); });
    return { receta, bad, conv: numVal(m, 'rc-conv'), stock: numVal(m, 'rc-stock') };
  };
  const upd = () => {
    const r = leer();
    let mp = 0, tot = 0;
    for (const i of ins) {
      const x = r.receta.find((y) => y.insumoId === i.id);
      const c = x ? x.t * (Number(i.precio) || 0) : 0;
      mp += c; tot += x ? x.t : 0;
      m.querySelector(`[data-rec-costo="${i.id}"]`).textContent = c ? fmt(c, { dec: 2 }) : '–';
    }
    const costo = mp + (isNum(r.conv) ? r.conv : 0);
    m.querySelector('#rc-prev').innerHTML = r.receta.length ? `Costo por tonelada a precio de lista: <b>${money(costo, { dec: 2 })}</b> (materia prima ${fmt(mp, { dec: 2 })} + conversión ${fmt(isNum(r.conv) ? r.conv : 0, { dec: 2 })}). Precio de venta ${money(p.precio)}${p.precio > 0 ? `, margen ${fmtPct((p.precio - costo) / p.precio)}` : ''}. Insumos por tonelada: ${fmt(tot, { dec: 3 })} t${Math.abs(tot - 1) > 0.1 ? ' (incluye mermas o rendimiento distinto de 1)' : ''}.` : 'Cargá al menos un insumo.';
  };
  m.addEventListener('input', upd); upd();
  const q = m.querySelector('#rc-quitar');
  if (q) q.addEventListener('click', () => { commit((st) => { const x = st.productos.find((y) => y.id === p.id); delete x.receta; }); closeModal(); toast('Receta quitada: el costo vuelve a ser el costo unitario del producto.'); });
  m.querySelector('#rc-ok').addEventListener('click', () => {
    const r = leer();
    const err = m.querySelector('#rc-err');
    if (r.bad) { err.textContent = 'Revisá las cantidades: tienen que ser números positivos.'; return; }
    if (!r.receta.length) { err.textContent = 'Cargá al menos un insumo.'; return; }
    if (!isNum(r.conv) || r.conv < 0 || !isNum(r.stock) || r.stock < 0) { err.textContent = 'Revisá el costo de conversión y el stock inicial.'; return; }
    commit((st) => { const x = st.productos.find((y) => y.id === p.id); x.receta = r.receta; x.conversion = r.conv; x.stockInicial = r.stock; if (!x.unidad) x.unidad = 't'; });
    closeModal();
    toast('Receta guardada. El costo de ventas de este producto sale ahora de la receta.');
  });
}

/* Descuento de un documento o cheque diferido: se cobra hoy el neto del costo financiero. */
function modalDescuento(docId) {
  const M = model();
  const c = M.cuentas.find((x) => x.v.id === docId);
  if (!c || c.saldo <= 0.004) return;
  const d = c.v;
  const mon = d.moneda || monedaBase();
  const otra = mon !== monedaBase();
  const q0 = c.cuotas.find((q) => q.monto - q.cobrado > 0.004);
  const tasa0 = isNum(S.config.tasaDescuento) ? S.config.tasaDescuento : 24;
  const m = openModal({
    title: 'Descontar documento', wide: true,
    sub: `${esc(nombreCliente(d.clienteId))} · ${esc(d.factura || 'sin documento')} · saldo ${moneyIn(c.saldo, mon)} · vence ${fmtDate(q0.vence)}. El banco o la financiera adelanta el cobro y descuenta intereses y gastos, que van al EERR como gastos financieros.`,
    body: `<div class="form-grid">
      <div class="field"><label for="ds-fecha">Fecha del descuento</label><input type="date" id="ds-fecha" value="${M.HOY}"></div>
      <div class="field"><label for="ds-entidad">Banco o financiera</label><input type="text" id="ds-entidad" value="${esc(S.config.entidadDescuento || '')}" placeholder="Banco, financiera…"></div>
      <div class="field"><label for="ds-monto">Monto del documento (${MONEDAS[mon]})</label><input type="text" inputmode="decimal" id="ds-monto" class="money" value="${rawNum(c.saldo)}"></div>
      <div class="field"><label for="ds-vence">Vencimiento del documento</label><input type="date" id="ds-vence" value="${q0.vence}"></div>
      <div class="field"><label for="ds-tasa">Tasa anual %</label><input type="text" inputmode="decimal" id="ds-tasa" class="money" value="${esc(rawNum(tasa0))}"></div>
      <div class="field"><label for="ds-gastos">Gastos y comisiones (${MONEDAS[mon]})</label><input type="text" inputmode="decimal" id="ds-gastos" class="money" value="0"></div>
      ${otra ? `<div class="field"><label for="ds-tc">Tipo de cambio del día (Gs. por US$)</label><input type="text" inputmode="decimal" id="ds-tc" class="money" value="${esc(rawNum(S.empresa.tc || d.tc))}"></div>` : ''}
      <div class="field span2"><label for="ds-nota">Nota</label><input type="text" id="ds-nota" placeholder="Cheque N°, operación…"></div>
    </div><div class="inline-note" id="ds-prev" aria-live="polite"></div><div class="err" id="ds-err" role="alert"></div>`,
    foot: `<button class="btn" data-action="modal-cerrar">Cancelar</button><button class="btn btn-primary" id="ds-ok">Registrar descuento</button>`,
  });
  const calc = () => {
    const f = val(m, 'ds-fecha'), v = val(m, 'ds-vence');
    const mo = numVal(m, 'ds-monto'), tasa = numVal(m, 'ds-tasa'), gastos = numVal(m, 'ds-gastos');
    const tc = otra ? numVal(m, 'ds-tc') : null;
    if (!isISODate(f) || !isISODate(v) || !isNum(mo) || !isNum(tasa) || !isNum(gastos)) return null;
    const dias = Math.max(0, daysBetween(f, v));
    const interes = (mo * tasa) / 100 * dias / 365;
    return { f, v, mo, tasa, gastos, dias, tc, interes: r2(interes), costo: r2(interes + gastos), neto: r2(mo - interes - gastos) };
  };
  const upd = () => {
    const k = calc();
    const prev = m.querySelector('#ds-prev');
    if (!k) { prev.textContent = 'Completá fecha, monto y tasa.'; return; }
    const fb = factorBase(mon, otra ? k.tc : d.tc);
    const i = M.wOf(k.f), iv = M.wOf(k.v);
    let txt = `${k.dias} días de anticipo: intereses ${moneyIn(k.interes, mon)}${k.gastos ? ` + gastos ${moneyIn(k.gastos, mon)}` : ''} = costo <b>${moneyIn(k.costo, mon)}</b> (${k.mo > 0 ? fmtPct(k.costo / k.mo) : '–'} del documento). Entra a caja <b>${moneyIn(k.neto, mon)}</b>${i >= 0 && i < M.nW ? ` en ${weekLabel(M.weeks[i])}` : ''}${iv >= 0 && iv < M.nW ? ` en lugar de ${weekLabel(M.weeks[iv])}` : ''}.`;
    const neg = M.primerNegativo;
    if (neg >= 0 && i <= neg && (iv > neg || iv < 0)) {
      const antes = M.saldo.eff.fin[neg], despues = antes + k.neto * fb;
      txt += `<br>El saldo proyectado de ${weekLabel(M.weeks[neg])} pasa de <span class="neg">${money(antes)}</span> a <b class="${despues < -0.5 ? 'neg' : ''}">${money(despues)}</b>${despues >= -0.5 ? ': deja de ser negativo' : ''}.`;
    }
    txt += '<br><span class="muted small">Si el cliente no paga al vencimiento, el banco lo reclama: el documento sigue siendo un riesgo hasta esa fecha.</span>';
    prev.innerHTML = txt;
  };
  m.addEventListener('input', upd); upd();
  m.querySelector('#ds-ok').addEventListener('click', () => {
    const err = m.querySelector('#ds-err');
    const k = calc();
    if (!k) { err.textContent = 'Revisá la fecha, el monto, la tasa y los gastos.'; return; }
    if (k.mo <= 0) { err.textContent = 'El monto tiene que ser mayor a cero.'; return; }
    if (k.mo > c.saldo + 0.009) { err.textContent = `El monto supera el saldo pendiente (${moneyIn(c.saldo, mon)}).`; return; }
    if (k.tasa < 0 || k.gastos < 0 || k.costo >= k.mo) { err.textContent = 'El costo del descuento no puede superar el monto.'; return; }
    if (otra && !(isNum(k.tc) && k.tc > 0)) { err.textContent = 'Indicá el tipo de cambio del día.'; return; }
    const monto = Math.abs(k.mo - c.saldo) < 0.01 ? c.saldo : r2(k.mo);
    const entidad = val(m, 'ds-entidad').trim();
    commit((st) => {
      st.cobros.push({ id: uid('cb'), ventaId: d.id, fecha: k.f, monto, tc: otra ? k.tc : null, costo: k.costo, tipo: 'descuento', entidad, tasa: k.tasa, dias: k.dias, nota: val(m, 'ds-nota').trim() });
      st.config.tasaDescuento = k.tasa;
      if (entidad) st.config.entidadDescuento = entidad;
    });
    closeModal();
    toast(`Descuento registrado: entra ${moneyIn(k.neto, mon)}, costo ${moneyIn(k.costo, mon)}.`);
  });
}

function guardarFotoAutomatica() {
  const M = model();
  if (!(M.curIdx >= 0 && M.curIdx < M.nM)) return false;
  if ((S.fotos || []).some((f) => f.mes === M.curMonth)) return false;
  const f = fotoProyeccion(M, `Inicio de ${mLabel(M.curMonth)}`);

  S.fotos.push(f);
  if (S.fotos.length > 36) S.fotos.splice(0, S.fotos.length - 36);
  return true;
}

async function apiFetch(ruta, { method = 'GET', body } = {}) {
  const r = await fetch(ruta, { method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Timon': '1' }, body: body == null ? undefined : JSON.stringify(body) });
  let data = {};
  try { data = await r.json(); } catch (e) { /* sin cuerpo */ }
  if (!r.ok) throw Object.assign(new Error(data.error || `Error ${r.status}`), { status: r.status, data });
  return data;
}

async function srvCargarEmpresa(id) {

  SRV.empresaId = id; SRV.rol = reg.rol; SRV.version = reg.version; SRV.actualizado = reg.actualizado; SRV.actualizadoPor = reg.actualizadoPor; SRV.sucio = false;
  store.set(SRV_KEY_EMPRESA, id);
  if (reg.datos) S = normalizeState(reg.datos);
  else { S = emptyState(); S.meta.origen = 'vacio'; S.empresa.nombre = emp ? emp.nombre : S.empresa.nombre; }

function srvProgramarGuardado(espera = 700) {
  if (SRV.rol === 'lector' || !SRV.empresaId) return;
  SRV.sucio = true;
  setSaveState('pending');
  clearTimeout(SRV.timer);
  SRV.timer = setTimeout(srvEnviar, espera);
}
async function srvEnviar() {
  if (SRV.enviando) { SRV.otraVez = true; return; }
  SRV.enviando = true; SRV.otraVez = false;
  clearTimeout(SRV.reintento);
  const datos = JSON.parse(JSON.stringify(S));
  try {
    const r = await apiFetch(`/api/empresas/${encodeURIComponent(SRV.empresaId)}`, { method: 'PUT', body: { version: SRV.version, datos } });
    SRV.version = r.version; SRV.actualizado = r.actualizado; SRV.actualizadoPor = r.actualizadoPor;
    SRV.enviando = false;
    if (SRV.otraVez) { srvEnviar(); return; }
    SRV.sucio = false;
    setSaveState('ok');
  } catch (e) {
    SRV.enviando = false;
    if (e.status === 409) { await srvConflicto(e.data); return; }
    if (e.status === 401) { toast('La sesión venció. Volvé a ingresar: tus últimos cambios se guardan al entrar.', true); await srvReingresar(); return; }
    if (e.status === 403) { SRV.rol = 'lector'; SRV.sucio = false; setSaveState('lector'); toast(e.message, true); return; }
    setSaveState('error');
    SRV.reintento = setTimeout(srvEnviar, 10000);
  }
}
async function srvConflicto(info) {
  const quien = info && info.actualizadoPor ? info.actualizadoPor : 'otra persona';
  const cuando = info && info.actualizado ? new Date(info.actualizado).toLocaleTimeString('es-PY', { hour: '2-digit', minute: '2-digit' }) : '';
  await srvCargarEmpresa(SRV.empresaId);
  render();
  openModal({
    title: 'Otra persona guardó cambios',
    body: `<p>${esc(quien)} guardó cambios en esta empresa${cuando ? ` a las ${esc(cuando)}` : ''} mientras editabas. Se cargó su versión, que ya incluye lo que había antes de tu último cambio.</p><p class="muted small" style="margin-top:8px">Revisá el dato que estabas cargando y volvé a ingresarlo.</p>`,
    foot: '<button class="btn btn-primary" data-action="modal-cerrar">Entendido</button>',
  });
}
async function srvReingresar() {
  const pendiente = JSON.parse(JSON.stringify(S));
  const r = await pantallaLogin('La sesión venció.');
  SRV.usuario = r.usuario; SRV.empresas = r.empresas;
  cerrarPantallaSrv();
  const reg = await apiFetch(`/api/empresas/${encodeURIComponent(SRV.empresaId)}`).catch(() => null);
  if (reg && reg.version === SRV.version && reg.rol !== 'lector') { S = normalizeState(pendiente); SRV.rol = reg.rol; srvProgramarGuardado(0); }
  else if (reg) { await srvCargarEmpresa(SRV.empresaId); toast('Mientras tanto hubo cambios: se cargó la versión del servidor.', true); }
  MODEL = null;
  render();
}

/* Revisa cada 45 segundos si otra persona guardó cambios y los trae. */
function srvSondeo() {
  setInterval(async () => {
    if (!SRV.empresaId || SRV.sucio || SRV.enviando || document.visibilityState !== 'visible') return;
    if ($('#modal-root').firstChild) return;
    const a = document.activeElement;
    if (a && a.closest && a.closest('#view') && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) return;
    try {
      const v = await apiFetch(`/api/empresas/${encodeURIComponent(SRV.empresaId)}/version`);
      if (v.version !== SRV.version) {
        await srvCargarEmpresa(SRV.empresaId);
        render();
        toast(`Datos actualizados: ${v.actualizadoPor || 'otra persona'} guardó cambios.`);
      }
    } catch (e) { if (e.status === 401) srvReingresar(); }
  }, 45000);
}

async function iniciarServidor() {
  let ses;
  try { ses = await apiFetch('/api/sesion'); }
  catch (e) {
    if (e.status !== 401) { pantallaSrv(`<p>No se pudo conectar con el servidor: ${esc(e.message)}</p><button class="btn" onclick="location.reload()">Reintentar</button>`); return false; }
    ses = await pantallaLogin();
  }
  SRV.usuario = ses.usuario; SRV.empresas = ses.empresas;
  let id = store.get(SRV_KEY_EMPRESA);
  if (!ses.empresas.some((e) => e.id === id)) id = ses.empresas.length === 1 ? ses.empresas[0].id : null;
  if (!id) id = await pantallaEmpresas(ses);
  if (!ses.empresas.some((e) => e.id === id)) { const s2 = await apiFetch('/api/sesion'); SRV.empresas = s2.empresas; }
  await srvCargarEmpresa(id);
  cerrarPantallaSrv();
  window.addEventListener('beforeunload', (ev) => { if (SRV.sucio) { ev.preventDefault(); ev.returnValue = ''; } });
  srvSondeo();
  return true;
}

function srvRestaurarTotal() {
  const inp = document.createElement('input');

    const f = inp.files[0];

    if (!b || b.tipo !== 'timon-respaldo-total') { toast('Este archivo no es un respaldo total. Para el respaldo de una sola empresa usá Datos y respaldos → Restaurar respaldo.', true); return; }
    const ok = await confirmar({ title: 'Restaurar respaldo total', text: `Se reemplazan <b>todas</b> las empresas, usuarios y permisos del servidor por los de «${esc(f.name)}» (${b.empresas.length} empresas y ${b.usuarios.length} usuarios, del ${esc(new Date(b.fecha).toLocaleString('es-PY', { dateStyle: 'short', timeStyle: 'short' }))}). Antes se guarda una copia de lo actual en el servidor. Las contraseñas pasan a ser las del respaldo.`, ok: 'Restaurar todo', danger: true });
    if (!ok) return;
    try {

      setTimeout(() => location.reload(), 900);

Object.assign(ACTIONS, ACCIONES_R3);

/* ---------- edición de celdas ---------- */
function setCelda(fk, texto) {
  const [lineaId, wk, capa] = fk.split('|');
  const t = String(texto).trim();
  const v = t === '' ? null : parseNumber(t);
  if (t !== '' && v == null) return false;
  if (wk.startsWith('M:')) {
    const mk = wk.slice(2);
    const M = model();
    const mi = M.cal.midx.get(mk);
    const abiertas = [0, 1, 2, 3].filter((k) => !M.closed[mi * 4 + k]);
    const cerradoTot = sum([0, 1, 2, 3].filter((k) => M.closed[mi * 4 + k]).map((k) => ((S.valores[lineaId] || {})[`${mk}#${k + 1}`] || {}).p || 0));
    const resto = (v || 0) - cerradoTot;
    commit((st) => {
      const q = r2(resto / abiertas.length);
      abiertas.forEach((k, n) => setValor(st, lineaId, `${mk}#${k + 1}`, 'p', n === abiertas.length - 1 ? r2(resto - q * (abiertas.length - 1)) : q));
    });
    return true;
  }
  commit((st) => {
    setValor(st, lineaId, wk, capa, v);
    if (t.startsWith('=') && v != null) st.valores[lineaId][wk][capa + 'f'] = t;
  });
  return true;
}
function recalcularFormulas(st) {
  for (const lid of Object.keys(st.valores)) for (const wk of Object.keys(st.valores[lid])) {
    const c = st.valores[lid][wk];
    for (const capa of ['p', 'r']) if (c[capa + 'f']) { const v = evalFormula(c[capa + 'f'].slice(1)); if (v != null) c[capa] = r2(v); }
  }
}
function moverFoco(input, dir) {
  const td = input.closest('td');
  const tr = td.parentElement;
  const col = Array.prototype.indexOf.call(tr.children, td);
  let r = dir > 0 ? tr.nextElementSibling : tr.previousElementSibling;
  while (r) {
    const cell = r.children[col];
    const inp = cell && cell.querySelector('input.cell:not([readonly]), input.plan-in');
    if (inp && r.children.length === tr.children.length) { inp.focus(); return true; }
    r = dir > 0 ? r.nextElementSibling : r.previousElementSibling;
  }
  return false;
}

function bindEvents() {
  document.addEventListener('click', (ev) => {
    const back = ev.target.closest('[data-modal-back]');
    if (back && ev.target === back) { closeModal(); return; }
    const el = ev.target.closest('[data-action]');
    if (!el || el.tagName === 'INPUT') return;
    const fn = ACTIONS[el.dataset.action];
    if (fn) { ev.preventDefault(); fn(el, ev); }
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target;
    if (el.matches('input[data-action]')) { const fn = ACTIONS[el.dataset.action]; if (fn) fn(el, ev); return; }
    if (el.matches('input.cell')) {
      if (!setCelda(el.dataset.cell, el.value)) { el.classList.add('bad'); toast('No entendí el número. Escribilo como 1.234,50 o como fórmula, por ejemplo =2500000/TC.', true); }
      return;
    }
    if (el.matches('input[data-conc]')) {
      const [wk, cid] = el.dataset.conc.split('|');
      const t = el.value.trim();
      const v = t === '' ? null : parseNumber(t);
      if (t !== '' && v == null) { el.classList.add('bad'); toast('No entendí el número.', true); return; }
      commit((st) => { const o = st.conciliaciones[wk] || (st.conciliaciones[wk] = {}); if (v == null) delete o[cid]; else o[cid] = r2(v); if (!Object.keys(o).length) delete st.conciliaciones[wk]; });
      return;
    }
    if (el.id === 'foto-sel') { UI.fotoSel = el.value; render(); return; }
    if (el.matches('input.plan-in')) {
      const [pid, mk] = el.dataset.plan.split('|');
      const t = el.value.trim();
      const v = t === '' ? null : parseNumber(t);
      if (t !== '' && (v == null || v < 0)) { el.classList.add('bad'); toast('La cantidad tiene que ser un número positivo.', true); return; }
      commit((st) => { const p = st.plan.find((x) => x.id === pid); if (v) p.cant[mk] = v; else delete p.cant[mk]; });
      return;
    }
    if (el.dataset.cfg) {
      const [obj, key] = el.dataset.cfg.split('.');
      let v = el.value;
      if (key === 'moneda') {
        const nueva = el.value;
        confirmar({ title: `Reportes en ${MONEDAS[nueva]}`, text: `Los montos cargados en ${MONEDAS[monedaBase()]} (flujo, plan, precios, saldos y balance inicial) se convierten al tipo de cambio ${fmt(S.empresa.tc)}. Ventas, compras y préstamos conservan su moneda. El presupuesto aprobado vuelve a borrador.`, ok: 'Convertir' })
          .then((ok) => { if (ok) { commit((st) => convertirMonedaBase(st, nueva)); toast(`Reportes en ${MONEDAS[nueva]}.`); } else render(); });
        return;
      }
      if (['tc', 'saldoInicial', 'ire', 'costoPct', 'depMensual', 'vidaUtil', 'ivaVentas', 'ivaCompras', 'ivaDia', 'ivaPagar', 'prodAdelanto'].includes(key)) {
        v = parseNumber(v);
        if (v == null) { toast('Revisá el número ingresado.', true); render(); return; }
      }
      if (key === 'meses') { v = Math.max(1, Math.min(60, Math.round(Number(v) || 12))); }
      if (key === 'inicio' && !/^\d{4}-\d{2}$/.test(v)) { toast('Elegí un mes válido.', true); render(); return; }
      if (key === 'hoy' && v && !isISODate(v)) { toast('Fecha inválida.', true); return; }
      if (key === 'nombre' && !String(v).trim()) { render(); return; }
      commit((st) => { st[obj][key] = v; if (key === 'tc') recalcularFormulas(st); });
      if (key === 'inicio' || key === 'meses') UI.flujoMes = null;
      return;
    }
    if (el.dataset.lineaNombre) { const t = el.value.trim(); if (t) commit((st) => { st.lineas.find((x) => x.id === el.dataset.lineaNombre).nombre = t; }, { silent: true }); return; }
    if (el.dataset.lineaPct) {
      const t = el.value.trim();
      const v = t === '' ? 0 : parseNumber(t.replace('%', ''));
      if (v == null || v < 0 || v > 100) { toast('El porcentaje tiene que estar entre 0 y 100.', true); render(); return; }
      commit((st) => { const l = st.lineas.find((x) => x.id === el.dataset.lineaPct); if (v > 0) l.pctVentas = v; else delete l.pctVentas; });
      return;
    }
    if (el.dataset.lineaDesfase) { commit((st) => { st.lineas.find((x) => x.id === el.dataset.lineaDesfase).desfase = Number(el.value) || 0; }); return; }
    if (el.dataset.lineaTipo) { commit((st) => { st.lineas.find((x) => x.id === el.dataset.lineaTipo).tipo = el.value; }, { silent: true }); return; }
    if (el.dataset.grupoNombre) { const t = el.value.trim(); if (t) commit((st) => { st.grupos.find((x) => x.id === el.dataset.grupoNombre).nombre = t; }, { silent: true }); return; }
    if (el.id === 'eerr-comp') { UI.eerrComp = el.value; render(); return; }
    if (el.dataset.esc) {
      const [k, c] = el.dataset.esc.split('.');
      const v = parseNumber(el.value);
      if (v == null) { toast('Revisá el número ingresado.', true); render(); return; }
      commit((st) => { st.escenarios[k][c] = v; });
      return;
    }
  });
  document.addEventListener('input', (ev) => {
    if (ev.target.id === 'ventas-buscar') { UI.ventasFiltro = ev.target.value; scheduleRender(); }
    if (ev.target.id === 'compras-buscar') { UI.comprasFiltro = ev.target.value; scheduleRender(); }
  });
  document.addEventListener('focusin', (ev) => {
    const el = ev.target;
    if ((el.matches('input.cell') || el.matches('input.plan-in')) && !el.readOnly) {
      el.classList.remove('bad');
      if (el.dataset.shown !== '1') { el.dataset.shown = '1'; el.value = el.dataset.raw || ''; }
      setTimeout(() => { if (document.activeElement === el) el.select(); }, 0);
    }
  });
  document.addEventListener('focusout', (ev) => {
    const el = ev.target;
    if ((el.matches('input.cell') || el.matches('input.plan-in')) && el.dataset.shown === '1' && el.value === (el.dataset.raw || '')) {
      el.dataset.shown = ''; el.value = el.defaultValue;
    }
  });
  document.addEventListener('keydown', (ev) => {
    const el = ev.target;
    if (ev.key === 'Escape' && $('#modal-root').firstChild) { closeModal(); return; }
    if (el.matches && (el.matches('input.cell') || el.matches('input.plan-in'))) {
      if (ev.key === 'Enter' || ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        const dir = ev.key === 'ArrowUp' ? -1 : 1;
        if (!moverFoco(el, dir)) el.blur();
      } else if (ev.key === 'Escape') {
        el.value = el.dataset.raw || ''; el.blur();
      }
    }
    if (ev.target.closest && ev.target.closest('.modal') && ev.key === 'Enter' && ev.target.tagName === 'INPUT' && ev.target.type !== 'checkbox' && ev.target.type !== 'radio') {
      const btn = ev.target.closest('.modal').querySelector('footer .btn-primary[id]');
      if (btn) { ev.preventDefault(); btn.click(); }
    }
  });
  $('#file-xlsx').addEventListener('change', (ev) => { const f = ev.target.files[0]; if (f) importarExcelArchivo(f); });
  $('#file-json').addEventListener('change', async (ev) => {
    const f = ev.target.files[0];
    if (!f) return;
    let nuevo;
    try { nuevo = leerRespaldo(await f.text()); } catch (e) { toast(e.message, true); return; }
    const ok = await confirmar({ title: 'Restaurar respaldo', text: `Se reemplazan los datos ${DONDE} por los de «${esc(f.name)}» (${esc(nuevo.empresa.nombre)}).`, ok: 'Restaurar', danger: true });
    if (ok) { reemplazarEstado(nuevo); toast('Respaldo restaurado.'); }
  });
  window.addEventListener('hashchange', () => {
    const h = location.hash.replace('#', '');
    if (VIEWS[h] && h !== UI.view) { UI.view = h; closeModal(); render(); window.scrollTo(0, 0); $('#view').focus({ preventScroll: true }); }
  });
}

  loadUI();
  const h = location.hash.replace('#', '');
  if (VIEWS[h]) UI.view = h;
  if (SERVIDOR) {
    bindEvents();
    if (!(await iniciarServidor())) return;
    if (guardarFotoAutomatica()) save();
    render();
    return;
  }
  const saved = store.get(APP.storageKey);
  if (saved) { try { S = normalizeState(JSON.parse(saved)); } catch (e) { S = null; } }
  if (!S) {
    // Datos iniciales opcionales: definir window.TIMON_DATOS_INICIALES = 'archivo.json' antes de este script.
    if (window.TIMON_DATOS_INICIALES) {
      try {
        const r = await fetch(window.TIMON_DATOS_INICIALES, { cache: 'no-store' });
        if (r.ok) { S = leerRespaldo(await r.text()); if (S.meta.origen !== 'excel') S.meta.origen = 'archivo'; }
      } catch (e) { S = null; }
    }
    if (!S) S = buildDemo();
    save();
  }
  if (guardarFotoAutomatica()) save();
  bindEvents();
  render();
}
init();
</script>
</body>
</html>
