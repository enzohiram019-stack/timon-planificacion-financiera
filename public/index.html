<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Planificación financiera: flujo de caja semanal, ventas y cobranzas, plan comercial, presupuesto EERR y balance proyectado.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%2317221C%22/%3E%3Cg fill=%22none%22 stroke=%22%23F7FAF6%22 stroke-width=%221.8%22 stroke-linecap=%22round%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%225%22/%3E%3Cpath d=%22M12 4v3M12 17v3M4 12h3M17 12h3%22/%3E%3C/g%3E%3C/svg%3E">
<title>Timón Financiero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Libre+Franklin:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EDF0EB;
  --surface:#FBFCFA;
  --surface-2:#F3F6F1;
  --surface-3:#E6EBE4;
  --closed-bg:#EEF2EC;
  --ink:#17221C;
  --ink-2:#44524A;
  --muted:#66736B;
  --rule:#D8DED6;
  --rule-strong:#BCC6BD;
  --primary:#17221C;
  --primary-ink:#F7FAF6;
  --input:#1B4FC4;
  --link:#0A7549;
  --neg:#BD2F2C;
  --warn-ink:#865600;
  --warn-bg:#FBEFD2;
  --crit-bg:#FAE1DF;
  --good-ink:#0A6B35;
  --good-bg:#DCF1E3;
  --info-bg:#E2EAFA;
  --focus:#1B4FC4;
  --chart-1:#2a78d6;
  --chart-1-soft:#9ec5f4;
  --s-opt:#1baf7a;
  --s-pes:#eb6834;
  --chart-plan:#A9B1AB;
  --chart-grid:#E1E5DF;
  --chart-axis:#C3CAC2;
  --backdrop:rgba(12,18,14,.46);
  --shadow:0 1px 2px rgba(23,34,28,.06),0 6px 24px rgba(23,34,28,.08);
  --radius:10px;
  --font-ui:"Libre Franklin",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-num:"IBM Plex Sans Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1310;--surface:#151C18;--surface-2:#1A221E;--surface-3:#222C26;--closed-bg:#18201B;
    --ink:#E5ECE7;--ink-2:#B2BDB5;--muted:#8D9991;--rule:#29332D;--rule-strong:#3B4740;
    --primary:#E5ECE7;--primary-ink:#111713;
    --input:#8AAEFF;--link:#52CC93;--neg:#FF7D74;--warn-ink:#F1B64E;--warn-bg:#3A2E13;--crit-bg:#3E1D1B;
    --good-ink:#5ED291;--good-bg:#163424;--info-bg:#1B2842;--focus:#8AAEFF;
    --chart-1:#3987e5;--chart-1-soft:#1c5cab;--s-opt:#199e70;--s-pes:#d95926;--chart-plan:#5D6761;--chart-grid:#232C27;--chart-axis:#3A453F;
    --backdrop:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1310;--surface:#151C18;--surface-2:#1A221E;--surface-3:#222C26;--closed-bg:#18201B;
  --ink:#E5ECE7;--ink-2:#B2BDB5;--muted:#8D9991;--rule:#29332D;--rule-strong:#3B4740;
  --primary:#E5ECE7;--primary-ink:#111713;
  --input:#8AAEFF;--link:#52CC93;--neg:#FF7D74;--warn-ink:#F1B64E;--warn-bg:#3A2E13;--crit-bg:#3E1D1B;
  --good-ink:#5ED291;--good-bg:#163424;--info-bg:#1B2842;--focus:#8AAEFF;
  --chart-1:#3987e5;--chart-1-soft:#1c5cab;--s-opt:#199e70;--s-pes:#d95926;--chart-plan:#5D6761;--chart-grid:#232C27;--chart-axis:#3A453F;
  --backdrop:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:650;line-height:1.2}
h2{font-size:16px;font-weight:650;line-height:1.3}
h3{font-size:14px;font-weight:650}
p{margin:0}
a{color:var(--input)}
svg{display:block}
.num,.tnum{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.neg{color:var(--neg)}
.small{font-size:12.5px}
.nowrap{white-space:nowrap}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- Estructura ---------- */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:22px;padding:20px 12px 16px;border-right:1px solid var(--rule);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.1}
.brand-sub{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:13.5px;white-space:nowrap}
.nav a:hover{background:var(--surface-3);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--primary);color:var(--primary-ink)}
.nav a svg{flex:none;opacity:.9}
.nav-sec{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nav-sec:empty{padding:6px 0 0;margin:6px 10px 0;border-top:1px solid var(--rule)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 8px;font-size:12px;color:var(--muted)}
.save-state{display:flex;align-items:center;gap:6px}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--good-ink);flex:none}
.save-state[data-state="error"] .save-dot{background:var(--neg)}
.save-state[data-state="pending"] .save-dot{background:var(--warn-ink)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px clamp(16px,3vw,32px);border-bottom:1px solid var(--rule)}
.co{display:flex;flex-direction:column;gap:2px;min-width:0}
.co-name{font-weight:650;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#view:focus{outline:none}
#view{padding-inline:clamp(16px,3vw,32px);padding-block:22px 56px;display:flex;flex-direction:column;gap:22px;min-width:0}
.banner{margin:14px clamp(16px,3vw,32px) 0;padding:12px 14px;border-radius:var(--radius);background:var(--info-bg);color:var(--ink);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;font-size:13.5px}
.banner b{font-weight:650}
.banner .top-actions{gap:6px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;gap:10px;padding:8px 16px;border-right:0;border-bottom:1px solid var(--rule);background:var(--bg);overflow-x:auto;overflow-y:hidden}
  .brand{padding:0}
  .brand-text,.side-foot{display:none}
  .nav{flex-direction:row;gap:2px}
  .nav a{padding:7px 10px;font-size:13px}
  .nav-sec{display:none}
}

/* ---------- Modo servidor: ingreso ---------- */
body.sin-sesion .app{display:none}
#srv-pantalla{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.srv-caja{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:24px}
.srv-lista{display:flex;flex-direction:column;gap:8px}
.srv-emp{justify-content:space-between;width:100%;height:auto;padding:10px 12px;text-align:left}

/* ---------- Componentes ---------- */
.page-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.page-head .lede{color:var(--ink-2);margin-top:5px;max-width:72ch;font-size:13.5px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:7px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);font:500 13px/1 var(--font-ui);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{background:var(--primary);opacity:.88}
.btn-sm{height:28px;padding:0 9px;font-size:12.5px;border-radius:6px}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-3)}
.btn-icon{width:34px;padding:0}
.btn-sm.btn-icon{width:28px}
.btn-danger{color:var(--neg)}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:8px;padding:2px;background:var(--surface);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;height:28px;padding:0 10px;border-radius:6px;font:500 12.5px/1 var(--font-ui);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink);background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.monthnav{display:inline-flex;align-items:center;gap:4px}
.monthnav .lbl{min-width:132px;text-align:center;font-weight:600;font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font:600 11.5px/1 var(--font-ui);white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.chip svg{flex:none}
.chip-good{background:var(--good-bg);color:var(--good-ink)}
.chip-warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip-crit{background:var(--crit-bg);color:var(--neg)}
.chip-info{background:var(--info-bg);color:var(--input)}
.key{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);display:flex;flex-direction:column;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.panel-head .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.panel-body{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.strip.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.strip>div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:5px;min-width:0}
.strip .lbl{font-size:12.5px;color:var(--ink-2);font-weight:500}
.strip .val{font-size:clamp(19px,1.9vw,25px);font-weight:650;letter-spacing:-.015em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .sub{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.meter{height:6px;border-radius:99px;background:var(--info-bg);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--chart-1);border-radius:99px}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:13px}
.alert .chip{margin-top:1px}
.alert .grow{flex:1 1 260px;min-width:0}
.alert .btn{margin-left:auto}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;counter-reset:paso}
.steps li{list-style:none;display:flex;gap:10px;font-size:13px;color:var(--ink-2)}
.steps li::before{counter-increment:paso;content:counter(paso);flex:none;width:22px;height:22px;border-radius:50%;background:var(--surface-3);color:var(--ink);display:grid;place-items:center;font:600 12px/1 var(--font-ui)}
.steps{padding:0;margin:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 12px;font:500 13.5px/1 var(--font-ui);color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}

/* ---------- Formularios ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.label{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.form-grid .span2{grid-column:1/-1}
input[type="text"],input[type="email"],input[type="password"],input[type="number"],input[type="date"],input[type="month"],select,textarea{height:36px;border:1px solid var(--rule-strong);border-radius:7px;background:var(--surface);color:var(--ink);padding:0 10px;font:14px var(--font-ui);min-width:0;width:100%}
textarea{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}
input.money{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums;color:var(--input)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.check input{margin-top:3px}
.radio-list{display:flex;flex-direction:column;gap:6px}
.inline-note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.inline-note b{color:var(--ink)}
.err{color:var(--neg);font-size:12.5px}

/* ---------- Grilla del flujo ---------- */
.grid-wrap{overflow:auto;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);max-height:calc(100vh - 250px);min-height:320px}
table.grid{border-collapse:separate;border-spacing:0;font:13px/1.2 var(--font-num);font-variant-numeric:tabular-nums;min-width:100%}
.grid th,.grid td{border-bottom:1px solid var(--rule);padding:0;white-space:nowrap}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);font:600 11.5px/1.25 var(--font-ui);color:var(--ink-2);text-align:right;padding:6px 8px;vertical-align:bottom}
.grid thead tr.h1 th{height:52px}
.grid thead tr.h2 th{top:52px;height:26px;font-weight:500;color:var(--muted);padding-top:4px;padding-bottom:4px}
.grid .lbl{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:0 10px 0 12px;min-width:220px;max-width:300px;overflow:hidden;text-overflow:ellipsis;font:13px/1.2 var(--font-ui);border-right:1px solid var(--rule);height:31px}
.grid thead .lbl{z-index:4;background:var(--surface-2);vertical-align:bottom}
.grid td.v{text-align:right;padding:0 8px;min-width:86px;height:31px}
.grid td.c{min-width:86px;height:31px}
.grid .wk{border-left:1px solid var(--rule)}
.grid .mt{background:var(--surface-2)}
.grid td.closed{background:var(--closed-bg)}
.grid tr.sec td{background:var(--surface-2);font:700 11px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);height:30px}
.grid tr.sec .lbl{background:var(--surface-2)}
.grid tr.grp td{font-weight:600;color:var(--ink)}
.grid tr.grp .lbl{font-weight:600}
.grid tr.line .lbl{padding-left:28px;color:var(--ink-2)}
.grid tr.tot td{font-weight:700;border-top:1px solid var(--rule-strong);background:var(--surface)}
.grid tr.tot .lbl{font-weight:700}
.grid tr.saldo td{font-weight:700;background:var(--surface-2)}
.grid tr.saldo .lbl{background:var(--surface-2)}
.grid tr.saldo td.v{text-align:center}
.grid td.calc{color:var(--link)}
.grid td.desc input.cell{text-decoration:underline dotted;text-decoration-color:var(--muted)}
.grid td.proj-eff{font-style:italic;color:var(--ink-2)}
.grp-toggle{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font:inherit;color:inherit;cursor:pointer;padding:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.grp-toggle svg{transition:transform .12s;flex:none}
.grp-toggle[aria-expanded="false"] svg{transform:rotate(-90deg)}
.grp-badge{font:600 10.5px/1 var(--font-ui);color:var(--link);background:var(--good-bg);border-radius:4px;padding:3px 5px;letter-spacing:.02em}
input.cell{display:block;width:100%;height:31px;border:0;background:transparent;text-align:right;font:inherit;color:var(--input);padding:0 8px;border-radius:0}
input.cell:hover{background:var(--surface-2)}
input.cell:focus{outline:2px solid var(--focus);outline-offset:-2px;background:var(--surface)}
input.cell[readonly]{color:var(--ink-2);cursor:default}
input.cell[readonly]:hover{background:transparent}
input.cell.bad{outline:2px solid var(--neg);outline-offset:-2px}
.cell-auto{color:var(--link);cursor:pointer;background:transparent;border:0;font:inherit;width:100%;height:31px;text-align:right;padding:0 8px}
.cell-auto:hover{text-decoration:underline dotted}
.wk-head{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.wk-head .t{font-weight:650;color:var(--ink);font-size:12px}
.wk-head .r{display:flex;gap:4px;align-items:center}
.lockbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px;border-radius:4px;display:inline-grid;place-items:center}
.lockbtn:hover{color:var(--ink);background:var(--surface-3)}

/* ---------- Reportes (EERR, balance, listas) ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface)}
table.rep{border-collapse:separate;border-spacing:0;min-width:100%;font:13px/1.25 var(--font-num);font-variant-numeric:tabular-nums}
.rep th,.rep td{padding:7px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;text-align:right}
.rep thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);font:600 11.5px/1.25 var(--font-ui);color:var(--ink-2)}
.rep .lbl{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;font:13px/1.25 var(--font-ui);min-width:220px;border-right:1px solid var(--rule)}
.rep thead .lbl{z-index:3;background:var(--surface-2)}
.rep tr.sub td{font-weight:650;background:var(--surface-2)}
.rep tr.sub .lbl{background:var(--surface-2)}
.rep tr.tot td{font-weight:700;border-top:1px solid var(--rule-strong)}
.rep tr.big td{font-weight:700;background:var(--surface-3);font-size:13.5px}
.rep tr.big .lbl{background:var(--surface-3)}
.rep tr.pct td{color:var(--muted);font-size:12px;padding-top:4px;padding-bottom:4px}
.rep tr.det td{color:var(--ink-2);font-size:12.5px}
.rep tr.det .lbl{padding-left:30px}
.rep tr.head td{font:700 11px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);text-align:left}
.rep tr.head .lbl{background:var(--surface-2)}
.rep td.yr,.rep th.yr{background:var(--surface-2);border-left:1px solid var(--rule-strong)}
.rep td.cur,.rep th.cur{box-shadow:inset 0 2px 0 var(--chart-1)}
.rep td.l,.rep th.l{text-align:left}
.rep td.wrap{white-space:normal;min-width:180px}
.rep tbody tr:hover td{background:var(--surface-2)}

<script>
/* Modo servidor: lo activa server/server.js al servir la página (datos compartidos con usuarios). */
const SERVIDOR = typeof window !== 'undefined' && !!window.TIMON_SERVIDOR;
const DONDE = SERVIDOR ? 'de esta empresa' : 'de este navegador';
'use strict';
/* =====================================================================
   Timón · Planificación financiera
   Flujo de caja semanal, ventas y cobranzas, plan comercial,
   presupuesto EERR y balance proyectado, en un solo archivo.
   Los datos se guardan en el navegador (localStorage) y se pueden
   exportar/importar como respaldo JSON o Excel.
   ===================================================================== */

const APP = {
  version: 1,
  storageKey: 'timon-financiero-datos-v1',
  uiKey: 'timon-financiero-ui-v1',
  xlsxUrls: [
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  ],
};

const MES_CORTO = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MES_LARGO = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

/* ---------- utilidades generales ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = 'id') => `${p}_${Date.now().toString(36).slice(-5)}${Math.random().toString(36).slice(2, 7)}`;
const r2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
/* Montos guardados con 6 decimales: así los importes en guaraníes convertidos (Gs/6000) suman exacto. */
const r6 = (n) => Math.round(Number(n) * 1e6) / 1e6;

/* ---------- monedas: US$ y guaraníes ---------- */
const MONEDAS = { USD: 'US$', PYG: 'Gs.' };
const monedaBase = () => (S && S.empresa && MONEDAS[S.empresa.moneda] ? S.empresa.moneda : 'USD');
const monedaAlterna = () => (monedaBase() === 'USD' ? 'PYG' : 'USD');
/* Factor para pasar un monto de `moneda` (al tipo de cambio `tc`, Gs. por US$) a la moneda base. */
function factorBase(moneda, tc) {
  const base = monedaBase();
  if (!moneda || moneda === base) return 1;
  const t = Number(tc) > 0 ? Number(tc) : (Number(S.empresa.tc) || 1);
  return base === 'USD' ? 1 / t : t;
}
const sum = (a) => { let s = 0; for (const v of a) s += v || 0; return s; };
const pad = (n) => String(n).padStart(2, '0');
const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
const clone = (o) => JSON.parse(JSON.stringify(o));
const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
function groupBy(arr, key) {
  const m = new Map();
  for (const x of arr) { const k = typeof key === 'function' ? key(x) : x[key]; if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
  return m;
}

/* ---------- números (formato Paraguay: 1.234.567,89) ---------- */
function groupThousands(intStr) { return intStr.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function fmt(n, { dec = 0, dash = false, paren = false, sign = false } = {}) {
  if (n == null || !Number.isFinite(n)) return '';
  const lim = dec ? 0.005 : 0.5;
  const v = Math.abs(n) < lim ? 0 : n;
  if (v === 0) return dash ? '–' : (dec ? '0,' + '0'.repeat(dec) : '0');
  const fixed = Math.abs(v).toFixed(dec);
  const [i, d] = fixed.split('.');
  const s = groupThousands(i) + (d ? ',' + d : '');
  if (v < 0) return paren ? `(${s})` : `−${s}`;
  return sign ? `+${s}` : s;
}
const money = (n, opts) => `${esc(S.empresa.simbolo)} ${fmt(n, opts)}`;
const moneyIn = (n, moneda, opts) => `${MONEDAS[moneda || monedaBase()]} ${fmt(n, opts)}`;
function fmtPct(x, dec = 1) {
  if (x == null || !Number.isFinite(x)) return '–';
  const v = x * 100;
  return `${v < 0 ? '−' : ''}${Math.abs(v).toFixed(dec).replace('.', ',')} %`;
}
function fmtCompact(n) {
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e6) return `${s}${(a / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',')} M`;
  if (a >= 1e3) return `${s}${Math.round(a / 1e3)} k`;
  return `${s}${Math.round(a)}`;
}
/* Texto para editar un número: sin separador de miles, coma decimal. */
function rawNum(n) {
  if (!isNum(n)) return '';
  const v = r2(n);
  return String(v).replace('.', ',');
}

/* Interpreta "1.234,5", "1234.5", "(500)", "US$ 1.000" o una fórmula "=2500000/TC". */
function parseNumber(input) {
  if (input == null) return null;
  let s = String(input).trim();
  if (!s) return null;
  if (s[0] === '=') return evalFormula(s.slice(1));
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[\s ]/g, '').replace(/^(us\$|u\$s|usd|gs\.?|\$|₲)/i, '');
  if (s[0] === '-' || s[0] === '−') { neg = !neg; s = s.slice(1); }
  if (!/^[\d.,]+$/.test(s)) return null;
  const hasC = s.includes(','), hasD = s.includes('.');
  if (hasC && hasD) {
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (hasC) {
    const p = s.split(',');
    s = p.length === 2 ? `${p[0]}.${p[1]}` : p.join('');
  } else if (hasD) {
    const p = s.split('.');
    if (p.length > 2) s = p.join('');
    else if (p[1].length === 3 && p[0] !== '' && p[0] !== '0') s = p.join('');
  }
  const n = Number(s);
  if (!Number.isFinite(n)) return null;
  return neg ? -n : n;
}

/* Fórmulas simples tipo Excel: + − * / ( ) %, y la variable TC (tipo de cambio). */
function evalFormula(src) {
  const s = String(src).replace(/\s+/g, '');
  const tc = Number(S && S.empresa && S.empresa.tc) || 0;
  let i = 0;
  const num = () => {
    const m = /^\d+(?:[.,]\d+)?/.exec(s.slice(i));
    if (!m) return null;
    i += m[0].length;
    return Number(m[0].replace(',', '.'));
  };
  const factor = () => {
    const c = s[i];
    if (c === '+') { i++; return factor(); }
    if (c === '-' || c === '−') { i++; const v = factor(); return v == null ? null : -v; }
    let v;
    if (c === '(') { i++; v = expr(); if (s[i] !== ')') return null; i++; }
    else if (/^tc/i.test(s.slice(i))) { i += 2; v = tc; }
    else v = num();
    if (v == null) return null;
    while (s[i] === '%') { i++; v /= 100; }
    return v;
  };
  const term = () => {
    let v = factor();
    while (v != null && /[*/xX]/.test(s[i] || '')) {
      const op = s[i++]; const w = factor();
      if (w == null) return null;
      if (op === '/') { if (w === 0) return null; v /= w; } else v *= w;
    }
    return v;
  };
  const expr = () => {
    let v = term();
    while (v != null && (s[i] === '+' || s[i] === '-' || s[i] === '−')) {
      const op = s[i++]; const w = term();
      if (w == null) return null;
      v = op === '+' ? v + w : v - w;
    }
    return v;
  };
  const v = expr();
  return v != null && i === s.length && Number.isFinite(v) ? v : null;
}

/* ---------- fechas (cadenas AAAA-MM-DD, siempre a mediodía para evitar saltos de horario) ---------- */
const dateObj = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const addDays = (s, n) => { const d = dateObj(s); d.setDate(d.getDate() + n); return isoOf(d); };
const daysBetween = (a, b) => Math.round((dateObj(b) - dateObj(a)) / 86400000);
const monthOf = (s) => s.slice(0, 7);
const lastDayOfMonth = (mk) => { const [y, m] = mk.split('-').map(Number); return new Date(y, m, 0, 12).getDate(); };
const monthStart = (mk) => `${mk}-01`;
const monthEnd = (mk) => `${mk}-${pad(lastDayOfMonth(mk))}`;
const addMonths = (mk, n) => { const [y, m] = mk.split('-').map(Number); const t = y * 12 + (m - 1) + n; return `${Math.floor(t / 12)}-${pad((t % 12) + 1)}`; };
const monthDiff = (a, b) => { const [y1, m1] = a.split('-').map(Number); const [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); };
const mLabel = (mk, long = false) => { const [y, m] = mk.split('-').map(Number); return `${(long ? MES_LARGO : MES_CORTO)[m - 1]} ${y}`; };
const mLabelShort = (mk) => { const [y, m] = mk.split('-').map(Number); return `${MES_CORTO[m - 1]} ${String(y).slice(2)}`; };
const fmtDate = (s) => (s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : '');
const fmtDateShort = (s) => (s ? `${s.slice(8, 10)}/${s.slice(5, 7)}` : '');
const isISODate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));

/* Semanas del mes: S1 = 1–7, S2 = 8–14, S3 = 15–21, S4 = 22–fin de mes.
   Así cada mes cierra exacto y el flujo semanal suma igual que el mensual. */
const WEEK_FROM = [1, 8, 15, 22];
const WEEK_MID = [4, 11, 18, 25];
const weekNumOfDay = (d) => (d <= 7 ? 1 : d <= 14 ? 2 : d <= 21 ? 3 : 4);
const weekKeyOf = (s) => `${s.slice(0, 7)}#${weekNumOfDay(Number(s.slice(8, 10)))}`;
function weeksOfMonth(mk) {
  const ld = lastDayOfMonth(mk);
  const m = Number(mk.slice(5, 7));
  return [1, 2, 3, 4].map((i) => {
    const a = WEEK_FROM[i - 1], b = i < 4 ? a + 6 : ld;
    return { key: `${mk}#${i}`, m: mk, i, start: `${mk}-${pad(a)}`, end: `${mk}-${pad(b)}`, rango: `${a}–${b} ${MES_CORTO[m - 1]}` };
  });
}
const weekLabel = (w) => `S${w.i} ${MES_CORTO[Number(w.m.slice(5, 7)) - 1]}`;
function buildCalendar(periodo) {
  const months = [];
  for (let k = 0; k < periodo.meses; k++) months.push(addMonths(periodo.inicio, k));
  const weeks = months.flatMap(weeksOfMonth);
  return {
    months, weeks,
    widx: new Map(weeks.map((w, i) => [w.key, i])),
    midx: new Map(months.map((m, i) => [m, i])),
    start: monthStart(months[0]),
    end: monthEnd(months[months.length - 1]),
  };
}

/* ---------- tipos de línea del flujo y su efecto en EERR y balance ---------- */
const TIPOS = {
  otros_ingresos: { dir: 'in', label: 'Otros ingresos (suma al resultado)', eerr: 'oing' },
  prestamo: { dir: 'in', label: 'Préstamo recibido (aumenta deuda financiera)' },
  aporte: { dir: 'in', label: 'Aporte de capital (aumenta patrimonio)' },
  cobro_credito: { dir: 'in', label: 'Cobro de otros créditos (reduce otros créditos)' },
  compra: { dir: 'out', label: 'Compra de materia prima o insumos (va a inventario)' },
  costo_produccion: { dir: 'out', label: 'Costo de producción (resta en el margen bruto)', eerr: 'cprod' },
  gasto_comercial: { dir: 'out', label: 'Gasto de comercialización', eerr: 'gcom' },
  gasto_admin: { dir: 'out', label: 'Gasto de administración u operativo', eerr: 'gadm' },
  inversion: { dir: 'out', label: 'Inversión en bienes de uso (se deprecia)' },
  impuesto: { dir: 'out', label: 'Pago de impuesto a la renta (reduce impuestos a pagar)' },
  retiro: { dir: 'out', label: 'Retiro de socios o dividendos (reduce patrimonio)' },
  pago_deuda: { dir: 'out', label: 'Pago a proveedores u otras deudas anteriores' },
  pago_iva: { dir: 'out', label: 'Pago de IVA (reduce IVA a pagar)' },
  amortizacion: { dir: 'out', label: 'Amortización de capital de préstamos' },
  interes: { dir: 'out', label: 'Intereses y gastos financieros', eerr: 'gfin' },
};
const SECCIONES = { ing: 'Ingresos', egr: 'Egresos', fin: 'Financiamiento' };
const SEC_DIR = { ing: 'in', egr: 'out', fin: 'out' };
const tiposDeSeccion = (sec) => Object.keys(TIPOS).filter((t) => TIPOS[t].dir === SEC_DIR[sec]);

/* ---------- estado ---------- */
function defaultStructure() {
  const g = (id, sec, nombre, tipo, auto) => ({ id, sec, nombre, tipo, ...(auto ? { auto } : {}) });
  const grupos = [
    g('g_cxc', 'ing', 'Deudas a cobrar', null, 'cxc'),
    g('g_plan', 'ing', 'Ventas proyectadas', null, 'plan'),
    g('g_oing', 'ing', 'Otros ingresos', 'otros_ingresos'),
    g('g_prest', 'ing', 'Préstamos recibidos', 'prestamo'),
    g('g_com', 'egr', 'Gastos de comercialización', 'gasto_comercial'),
    g('g_adm', 'egr', 'Gastos de administración y operativos', 'gasto_admin'),
    g('g_mp', 'egr', 'Materia prima e insumos', 'compra'),
    g('g_inv', 'egr', 'Inversiones', 'inversion'),
    g('g_imp', 'egr', 'Impuestos', 'impuesto'),
    g('g_amort', 'fin', 'Amortización de capital', 'amortizacion'),
    g('g_int', 'fin', 'Intereses', 'interes'),
  ];
  const l = (grupoId, nombre, tipo) => ({ id: uid('l'), grupoId, nombre, tipo });
  const lineas = [
    l('g_oing', 'Otros ingresos', 'otros_ingresos'),
    l('g_prest', 'Préstamos bancarios', 'prestamo'),
    l('g_com', 'Comisiones sobre ventas', 'gasto_comercial'),
    l('g_com', 'Fletes', 'gasto_comercial'),
    l('g_com', 'Viáticos y combustibles', 'gasto_comercial'),
    l('g_adm', 'Salarios y cargas sociales', 'gasto_admin'),
    l('g_adm', 'Honorarios profesionales', 'gasto_admin'),

function normalizeState(x) {
  const base = emptyState();
  const s = Object.assign({}, base, x || {});
  s.meta = Object.assign({}, base.meta, s.meta || {});
  s.empresa = Object.assign({}, base.empresa, s.empresa || {});
  s.periodo = Object.assign({}, base.periodo, s.periodo || {});
  s.periodo.meses = Math.max(1, Math.min(60, Math.round(Number(s.periodo.meses) || 12)));
  if (!/^\d{4}-\d{2}$/.test(s.periodo.inicio)) s.periodo.inicio = base.periodo.inicio;
  s.config = Object.assign({}, base.config, s.config || {});
  s.balanceInicial = Object.assign(emptyBalance(), s.balanceInicial || {});
  for (const k of ['grupos', 'lineas', 'clientes', 'productos', 'plan', 'ventas', 'cobros', 'proveedores', 'compras', 'pagos', 'prestamos', 'insumos', 'cuentas', 'fotos']) if (!Array.isArray(s[k])) s[k] = [];
  if (!s.conciliaciones || typeof s.conciliaciones !== 'object') s.conciliaciones = {};
  if (!MONEDAS[s.empresa.moneda]) s.empresa.moneda = /gs|₲|pyg/i.test(s.empresa.simbolo || '') ? 'PYG' : 'USD';
  s.empresa.simbolo = MONEDAS[s.empresa.moneda];
  s.escenarios = Object.assign(defaultEscenarios(), s.escenarios || {});
  if (!ESCENARIOS[s.escenarios.activo]) s.escenarios.activo = 'base';
  for (const c of s.compras) if (!Array.isArray(c.cuotas) || !c.cuotas.length) c.cuotas = [{ vence: c.fecha, monto: c.monto }];
  for (const k of ['valores', 'cerradas']) if (!s[k] || typeof s[k] !== 'object') s[k] = {};
  if (!s.grupos.some((g) => g.auto === 'cxc')) s.grupos.unshift({ id: 'g_cxc', sec: 'ing', nombre: 'Deudas a cobrar', tipo: null, auto: 'cxc' });
  if (!s.grupos.some((g) => g.auto === 'plan')) s.grupos.splice(1, 0, { id: 'g_plan', sec: 'ing', nombre: 'Ventas proyectadas', tipo: null, auto: 'plan' });
  for (const p of s.plan) if (!p.cant || typeof p.cant !== 'object') p.cant = {};
  for (const v of s.ventas) if (!Array.isArray(v.cuotas) || !v.cuotas.length) v.cuotas = [{ vence: v.fecha, monto: v.monto }];
  s.v = APP.version;
  return s;
}

let S = null;          // estado (datos de la empresa)
let MODEL = null;      // resultados calculados (se invalida en cada cambio)
const UI = {

const hoy = () => (S && isISODate(S.config.hoy) ? S.config.hoy : todayISO());
/* =====================================================================
   Motor de cálculo
   Tres capas por semana y por línea:
     proj = proyección cargada,  real = movimientos reales,
     eff  = "actualizado": real en semanas cerradas; en semanas abiertas,
            el real si ya se cargó y si no la proyección.
   Las ventas generan cuentas por cobrar y las compras cuentas por pagar
   (cobros y pagos agendados por vencimiento). El plan comercial pendiente
   genera "ventas proyectadas". Los préstamos generan sus cuotas y el IVA
   su liquidación mensual. Todo se expresa en la moneda base.
   El EERR y el balance se derivan de las mismas capas, así que el
   balance cuadra por construcción.
   ===================================================================== */

const EERR_KEYS = ['ventas', 'cmv', 'cprod', 'gcom', 'gadm', 'dep', 'oing', 'dcambio', 'gfin'];
const DESTINOS_COMPRA = ['compra', 'costo_produccion', 'gasto_comercial', 'gasto_admin', 'inversion'];
const DESTINO_LABEL = {
  compra: 'Materia prima / insumos (inventario)',
  costo_produccion: 'Costo de producción',
  gasto_comercial: 'Gasto de comercialización',
  gasto_admin: 'Gasto de administración u operativo',
  inversion: 'Inversión en bienes de uso',
};

function costoDeVenta(v, cfg) {
  if (isNum(v.costoUnit) && v.costoUnit > 0 && isNum(v.cantidad)) return v.cantidad * v.costoUnit;
  return (v.monto || 0) * (cfg.costoPct || 0) / 100;
}
/* Productos con receta: costo estándar = toneladas de cada insumo × precio del insumo + costo de conversión. */
const tieneReceta = (p) => !!(p && Array.isArray(p.receta) && p.receta.some((r) => r.insumoId && Number(r.t) > 0));
function costoEstandar(p, insById, conConversion = true) {
  let c = conConversion ? Number(p.conversion) || 0 : 0;
  for (const r of p.receta || []) { const ins = insById.get(r.insumoId); if (ins) c += (Number(r.t) || 0) * (Number(ins.precio) || 0); }
  return c;
}
function ratioCostoPlan(line, prodById, cfg, insById) {
  const p = line.productoId ? prodById.get(line.productoId) : null;
  if (p && insById && tieneReceta(p) && line.precio > 0) return costoEstandar(p, insById, false) / line.precio;
  if (p && isNum(p.costo) && p.costo > 0 && line.precio > 0) return p.costo / line.precio;
  return (cfg.costoPct || 0) / 100;
}
const planMonto = (line, mk) => (Number(line.cant[mk]) || 0) * (Number(line.precio) || 0);
/* El tipo de una línea tiene que coincidir con el sentido de su sección (entrada o salida). */
function tipoValido(t, sec) {
  if (TIPOS[t] && TIPOS[t].dir === SEC_DIR[sec]) return t;
  return sec === 'ing' ? 'otros_ingresos' : sec === 'fin' ? 'amortizacion' : 'gasto_admin';
}

/* Estado de un documento (venta o compra): aplica cobros/pagos a las cuotas por orden de vencimiento.
   Todo en la moneda del documento. */
function estadoCuenta(v, cobros) {
  const cs = (cobros || []).slice().sort((a, b) => a.fecha.localeCompare(b.fecha));
  const cuotas = (v.cuotas && v.cuotas.length ? v.cuotas : [{ vence: v.fecha, monto: v.monto }])
    .map((c, i) => ({ ...c, n: i + 1, cobrado: 0 }))
    .sort((a, b) => a.vence.localeCompare(b.vence));
  let pagado = sum(cs.map((c) => c.monto));
  for (const c of cuotas) {
    const a = Math.max(0, Math.min(c.monto, pagado));
    c.cobrado = r6(a);
    pagado = r6(pagado - a);
  }
  const total = r6(sum(cuotas.map((c) => c.monto)));
  const cobrado = r6(sum(cs.map((c) => c.monto)));
  return { cuotas, cobros: cs, total, cobrado, saldo: r6(total - cobrado) };
}

/* Cronograma de un préstamo: sistema francés (cuota fija), alemán (capital fijo)
   o al vencimiento (solo intereses y capital al final). Montos en la moneda del préstamo. */
function addMonthsDate(fecha, k) {
  const mk = addMonths(fecha.slice(0, 7), k);
  return `${mk}-${pad(Math.min(Number(fecha.slice(8, 10)), lastDayOfMonth(mk)))}`;
}
function cronograma(p) {
  const P = Number(p.monto) || 0;
  const n = Math.max(1, Math.round(Number(p.cuotas) || 1));
  const fq = Math.max(1, Math.round(Number(p.frecuencia) || 1));
  const g = Math.max(0, Math.round(Number(p.gracia) || 0));
  const r = ((Number(p.tasa) || 0) / 100) * fq / 12;
  if (!P || !isISODate(p.fecha)) return [];
  const out = [];
  let saldo = P, k = 0;
  for (let j = 1; j <= g; j++) { k++; out.push({ n: k, fecha: addMonthsDate(p.fecha, fq * k), capital: 0, interes: r6(saldo * r), saldo: r6(saldo) }); }
  const cuotaFija = r > 0 ? (P * r) / (1 - Math.pow(1 + r, -n)) : P / n;
  for (let j = 1; j <= n; j++) {
    k++;
    const interes = saldo * r;
    let capital = p.sistema === 'aleman' ? P / n : p.sistema === 'final' ? 0 : cuotaFija - interes;
    if (j === n) capital = saldo;
    saldo -= capital;
    out.push({ n: k, fecha: addMonthsDate(p.fecha, fq * k), capital: r6(capital), interes: r6(interes), saldo: r6(Math.max(0, saldo)) });
  }
  return out;
}

function escenarioActivo(S, override) {
  const k = override || (S.escenarios && S.escenarios.activo) || 'base';
  if (k === 'base') return { k, vol: 0, precio: 0, dias: 0 };
  const e = (S.escenarios && S.escenarios[k]) || {};
  return { k, vol: (Number(e.vol) || 0) / 100, precio: (Number(e.precio) || 0) / 100, dias: Math.round(Number(e.dias) || 0) };
}

function compute(S, opts = {}) {
  const HOY = hoy();
  const cfg = S.config;
  const esc = escenarioActivo(S, opts.escenario);
  const cal = buildCalendar(S.periodo);
  const { months, weeks, widx, midx } = cal;
  const nW = weeks.length, nM = months.length;
  const closed = weeks.map((w) => !!S.cerradas[w.key]);
  const Z = () => new Array(nW).fill(0);
  const ZM = () => new Array(nM).fill(0);
  const wOf = (d) => (d < cal.start ? -1 : d > cal.end ? nW : widx.get(weekKeyOf(d)));
  const mOf = (d) => midx.get(monthOf(d));
  const cur = wOf(HOY);                  // -1: hoy es anterior al período; nW: posterior
  const curC = Math.max(0, cur);
  const curMonth = monthOf(HOY);
  const nextOpen = (i) => { let j = Math.max(0, i); while (j < nW && closed[j]) j++; return j; };
  const toM = (arr) => { const out = ZM(); for (let i = 0; i < nW; i++) out[Math.floor(i / 4)] += arr[i]; return out; };
  const cliById = new Map(S.clientes.map((c) => [c.id, c]));
  const prodById = new Map(S.productos.map((p) => [p.id, p]));
  const provById = new Map(S.proveedores.map((p) => [p.id, p]));
  const insumos = S.insumos || [];
  const insById = new Map(insumos.map((x) => [x.id, x]));
  const curIdx = midx.has(curMonth) ? midx.get(curMonth) : (curMonth < months[0] ? 0 : nM);
  const alerts = [];

  /* ---- grupos: los de la estructura más los automáticos ---- */
  const V = (id, sec, nombre, extra = {}) => ({ id, sec, nombre, tipo: null, virtual: true, ...extra });
  const vg = {
    cxp: V('v_cxp', 'egr', 'Pagos a proveedores', { auto: 'cxp' }),
    iva: V('v_iva', 'egr', 'IVA a pagar', { calc: true }),
    des: V('v_pdes', 'ing', 'Préstamos recibidos', { calc: true }),
    cap: V('v_pcap', 'fin', 'Cuotas · capital', { calc: true }),
    int: V('v_pint', 'fin', 'Cuotas · intereses', { calc: true }),
    mrp: V('v_mrp', 'egr', 'Compras planificadas', { auto: 'mrp' }),
    aju: V('v_aju', 'ing', 'Ajustes de conciliación', { calc: true }),
  };
  const gById = new Map(S.grupos.map((g) => [g.id, g]));
  for (const g of Object.values(vg)) gById.set(g.id, g);

  /* ---- compras registradas que descuentan la proyección de una línea del flujo ---- */
  const descuentoLinea = new Map();       // lineaId -> por mes, monto (moneda base)
  for (const c of S.compras) {
    if (c.origen === 'saldo_inicial' || !c.lineaId) continue;
    const mi = mOf(c.fecha);
    if (mi == null) continue;
    const f = factorBase(c.moneda, c.tc);
    if (!descuentoLinea.has(c.lineaId)) descuentoLinea.set(c.lineaId, ZM());
    descuentoLinea.get(c.lineaId)[mi] += sum(c.cuotas.map((q) => q.monto)) * f;
  }

  /* ---- líneas manuales y líneas calculadas (IVA, préstamos) ---- */
  const lines = [];
  function agregarLinea(l, g, projArr, calc) {
    const vals = S.valores[l.id] || {};
    const proj = Z(), real = Z(), eff = Z(), hasReal = new Array(nW).fill(false);
    for (let i = 0; i < nW; i++) {
      const c = vals[weeks[i].key];
      const p = projArr ? projArr[i] : (c && isNum(c.p) ? c.p : 0);
      const r = c && isNum(c.r) ? c.r : null;
      proj[i] = p;
      if (r != null) { real[i] = r; hasReal[i] = true; }
      eff[i] = closed[i] ? (r ?? 0) : (r ?? p);
    }
    const x = { l, g, sec: g.sec, tipo: tipoValido(l.tipo || g.tipo, g.sec), proj, real, eff, hasReal, calc: !!calc, descontado: null };
    const desc = descuentoLinea.get(l.id);
    if (desc) {
      x.descontado = ZM();
      for (let mi = 0; mi < nM; mi++) {
        if (!(desc[mi] > 0)) continue;
        const ws = [0, 1, 2, 3].map((k) => mi * 4 + k).filter((i) => !closed[i] && !hasReal[i] && proj[i] > 0);
        const tot = sum(ws.map((i) => proj[i]));
        if (tot <= 0) continue;
        const quita = Math.min(tot, desc[mi]);
        for (const i of ws) eff[i] = proj[i] * (1 - quita / tot);
        x.descontado[mi] = quita;
      }
    }
    lines.push(x);
    return x;
  }
  const variables = [];
  for (const l of S.lineas) {
    const g = gById.get(l.grupoId);
    if (!g || g.auto) continue;
    if (Number(l.pctVentas) > 0) { variables.push({ l, g }); continue; }
    agregarLinea(l, g, null, false);
  }

  /* ---- préstamos con cronograma ---- */
  const prestamosInfo = [];
  let prest0Cron = 0;
  for (const p of S.prestamos) {
    const f = factorBase(p.moneda, p.tc);
    const cr = cronograma(p);
    const des = Z(), cap = Z(), int = Z();
    if (isISODate(p.fecha) && p.fecha >= cal.start) { const i = wOf(p.fecha); if (i < nW) des[i] += (Number(p.monto) || 0) * f; }
    else if (isISODate(p.fecha)) {
      const pagadoAntes = sum(cr.filter((q) => q.fecha < cal.start).map((q) => q.capital));
      prest0Cron += Math.max(0, (Number(p.monto) || 0) - pagadoAntes) * f;
    }
    for (const q of cr) { const i = wOf(q.fecha); if (i >= 0 && i < nW) { cap[i] += q.capital * f; int[i] += q.interes * f; } }
    const nombre = p.nombre || 'Préstamo';
    if (hasAny(des) || hasAny(Object.values(S.valores[`__pd:${p.id}`] || {}).map((c) => c.r || 0))) agregarLinea({ id: `__pd:${p.id}`, nombre, tipo: 'prestamo' }, vg.des, des, true);
    agregarLinea({ id: `__pk:${p.id}`, nombre, tipo: 'amortizacion' }, vg.cap, cap, true);
    agregarLinea({ id: `__pi:${p.id}`, nombre, tipo: 'interes' }, vg.int, int, true);
    prestamosInfo.push({ p, cr, f });
  }

  /* ---- cartera: cuentas por cobrar (ventas) y por pagar (compras) ---- */
  const autoRow = (map, id) => { if (!map.has(id)) map.set(id, { proj: Z(), real: Z(), pend: Z(), eff: Z() }); return map.get(id); };
  function cartera(docs, pagosPorDoc, campo, diasExtra) {
    const rows = new Map(), lista = [];
    let saldo0 = 0;
    const fxM = ZM(), costoM = ZM();
    for (const d of docs) {
      const f = factorBase(d.moneda, d.tc);
      const st = estadoCuenta(d, pagosPorDoc.get(d.id));
      const row = autoRow(rows, d[campo]);
      const previo = d.origen === 'saldo_inicial' || d.fecha < cal.start;
      for (const c of st.cuotas) { const i = wOf(c.vence); if (i >= 0 && i < nW) row.proj[i] += c.monto * f; }
      for (const cb of st.cobros) {
        const fp = factorBase(d.moneda, cb.tc || d.tc);
        const bruto = cb.monto * fp, red = cb.monto * f, costo = (Number(cb.costo) || 0) * fp;
        if (cb.fecha < cal.start) { if (previo) saldo0 -= red; continue; }
        const i = wOf(cb.fecha);
        if (i >= nW) continue;
        row.real[i] += bruto - costo;          // un descuento de documentos cobra el neto del costo financiero
        fxM[Math.floor(i / 4)] += bruto - red;
        costoM[Math.floor(i / 4)] += costo;
      }
      let vencido = 0, proximo = null;
      for (const c of st.cuotas) {
        const rem = r6(c.monto - c.cobrado);
        if (rem <= 0.004) continue;
        if (c.vence < HOY) vencido += rem;
        if (!proximo) proximo = c.vence;
        const i = wOf(diasExtra ? addDays(c.vence, diasExtra) : c.vence);
        if (i >= nW) continue; // vence después del período: queda como saldo a cobrar o pagar
        const t = nextOpen(Math.max(i, curC));
        if (t < nW) row.pend[t] += rem * f;
      }
      if (previo) saldo0 += st.total * f;
      const estado = st.saldo <= 0.004 ? 'cobrado' : vencido > 0.004 ? 'vencido' : 'pendiente';
      lista.push({ v: d, ...st, f, vencido: r6(vencido), proximo, estado });
    }
    for (const row of rows.values()) for (let i = 0; i < nW; i++) row.eff[i] = row.real[i] + (closed[i] ? 0 : row.pend[i]);
    return { rows, lista, saldo0, fxM, costoM };
  }
  const CXC = cartera(S.ventas, groupBy(S.cobros, 'ventaId'), 'clienteId', esc.dias);
  const CXP = cartera(S.compras, groupBy(S.pagos, 'compraId'), 'proveedorId', 0);
  const cxcCli = CXC.rows, cxpProv = CXP.rows, cuentas = CXC.lista, cuentasPagar = CXP.lista;
  const ar0 = CXC.saldo0, ap0 = CXP.saldo0;

  /* ---- ventas registradas por mes (EERR, IVA) ---- */
  const ventasReal = ZM(), cmvReal = ZM(), ventasTotalM = ZM(), ivaDebReal = ZM();
  const ventasCliMes = new Map();
  const vcm = (id) => { if (!ventasCliMes.has(id)) ventasCliMes.set(id, { real: ZM(), pend: ZM(), ppto: ZM() }); return ventasCliMes.get(id); };
  const netoBase = new Map();
  const qtyProd = new Map();                 // productoId -> { real, pend } toneladas por mes
  const qtyVenta = (pid, k) => { if (!qtyProd.has(pid)) qtyProd.set(pid, { real: ZM(), pend: ZM() }); return qtyProd.get(pid)[k]; };
  for (const v of S.ventas) {
    if (v.origen === 'saldo_inicial') continue;
    const f = factorBase(v.moneda, v.tc);
    const neto = (v.monto || 0) * f;
    netoBase.set(v.id, neto);
    const mi = mOf(v.fecha);
    if (mi == null) continue;
    const total = sum(v.cuotas.map((q) => q.monto)) * f;
    ventasReal[mi] += neto;
    ventasTotalM[mi] += total;
    ivaDebReal[mi] += total - neto;
    const prod = v.productoId ? prodById.get(v.productoId) : null;
    if (tieneReceta(prod) && isNum(v.cantidad)) qtyVenta(v.productoId, 'real')[mi] += v.cantidad;
    else cmvReal[mi] += costoDeVenta(v, cfg) * f;
    vcm(v.clienteId).real[mi] += neto;
  }

  /* ---- plan comercial: cumplimiento y pendiente ---- */
  const asignado = new Map();                 // `${lineId}|${mes}` -> monto cubierto por ventas
  const ventasPlan = groupBy(S.ventas.filter((v) => v.origen !== 'saldo_inicial' && v.planMes), (v) => `${v.clienteId}|${v.planMes}`);
  for (const [key, vs] of ventasPlan) {
    const [cid, mk] = key.split('|');
    const pls = S.plan.filter((p) => p.clienteId === cid && planMonto(p, mk) > 0);
    if (!pls.length) continue;
    const rest = new Map(pls.map((p) => [p.id, planMonto(p, mk)]));
    for (const v of vs.slice().sort((a, b) => a.fecha.localeCompare(b.fecha))) {
      let a = netoBase.get(v.id) || 0;
      const passes = [
        pls.filter((p) => (p.productoId || null) === (v.productoId || null)),
        pls.filter((p) => !p.productoId),
        v.productoId ? [] : pls,
      ];
      for (const set of passes) for (const p of set) {
        if (a <= 0.004) break;
        const r = rest.get(p.id);
        if (r <= 0.004) continue;
        const x = Math.min(r, a);
        rest.set(p.id, r - x); a -= x;
        asignado.set(`${p.id}|${mk}`, (asignado.get(`${p.id}|${mk}`) || 0) + x);
      }
    }
  }
  const factVentas = (1 + esc.vol) * (1 + esc.precio), factCosto = 1 + esc.vol;
  const pptoVentas = ZM(), pptoCmv = ZM(), pendVentas = ZM(), pendCmv = ZM(), pendTotalM = ZM(), ivaDebPlan = ZM();
  const planCli = new Map();
  const planFilas = [];
  for (const p of S.plan) {
    const ratio = ratioCostoPlan(p, prodById, cfg, insById);
    const conReceta = tieneReceta(p.productoId ? prodById.get(p.productoId) : null);
    const iva = (Number(p.iva) || 0) / 100;
    const fila = { p, ratio, monto: ZM(), cubierto: ZM(), pend: ZM() };
    for (let mi = 0; mi < nM; mi++) {
      const mk = months[mi];
      const amt = planMonto(p, mk);
      if (!amt) continue;
      const cub = Math.min(amt, asignado.get(`${p.id}|${mk}`) || 0);
      const pendBase = mk >= curMonth ? Math.max(0, amt - cub) : 0;
      const pend = pendBase * factVentas;
      fila.monto[mi] = amt; fila.cubierto[mi] = cub; fila.pend[mi] = pend;
      pptoVentas[mi] += amt; pptoCmv[mi] += amt * ratio;
      pendVentas[mi] += pend;
      if (conReceta) { if (p.precio > 0) qtyVenta(p.productoId, 'pend')[mi] += (pendBase / p.precio) * factCosto; }
      else pendCmv[mi] += pendBase * ratio * factCosto;
      pendTotalM[mi] += pend * (1 + iva); ivaDebPlan[mi] += pend * iva;
      const vc = vcm(p.clienteId);
      vc.ppto[mi] += amt; vc.pend[mi] += pend;
      if (pend > 0.004) {
        const row = autoRow(planCli, p.clienteId);
        const plazo = Math.max(0, Math.round(Number(p.plazo) || 0));
        for (let k = 0; k < 4; k++) {
          const portion = (pend * (1 + iva)) / 4;
          const base = `${mk}-${pad(WEEK_MID[k])}`;
          const i0 = wOf(addDays(base, plazo));
          if (i0 >= 0 && i0 < nW) row.proj[i0] += portion;
          const i = wOf(addDays(base, plazo + esc.dias));
          if (i >= nW) continue;
          const t = nextOpen(Math.max(i, curC));
          if (t < nW) row.pend[t] += portion;
        }
      }
    }
    planFilas.push(fila);
  }
  for (const row of planCli.values()) for (let i = 0; i < nW; i++) row.eff[i] = closed[i] ? 0 : row.pend[i];

  /* ---- compras registradas por mes (EERR devengado, inventario, IVA crédito) ---- */
  const compraDest = {};
  for (const d of DESTINOS_COMPRA) compraDest[d] = ZM();
  const comprasTotalM = ZM(), ivaCredM = ZM();
  for (const c of S.compras) {
    if (c.origen === 'saldo_inicial') continue;
    const mi = mOf(c.fecha);
    if (mi == null) continue;
    const f = factorBase(c.moneda, c.tc);
    const neto = (c.monto || 0) * f, total = sum(c.cuotas.map((q) => q.monto)) * f;
    const dest = DESTINOS_COMPRA.includes(c.destino) ? c.destino : 'compra';
    compraDest[dest][mi] += neto;
    comprasTotalM[mi] += total;
    ivaCredM[mi] += total - neto;
  }

  /* ---- producción, stock en toneladas y compras planificadas de materia prima ---- */
  const adelanto = Math.max(0, Math.round(Number(cfg.prodAdelanto) || 0));
  const produccion = new Map();              // productoId -> toneladas a producir por mes
  for (const p of S.productos) {
    if (!tieneReceta(p)) continue;
    const q = qtyProd.get(p.id) || { real: ZM(), pend: ZM() };
    const venta = q.real.map((v, mi) => v + q.pend[mi]);
    const prod = ZM();
    for (let mi = 0; mi < nM; mi++) prod[mi] = mi + adelanto < nM ? venta[mi + adelanto] : 0;
    produccion.set(p.id, { venta, prod });
  }
  const regT = new Map();                    // insumoId -> toneladas y neto (base) de compras registradas por mes
  for (const c of S.compras) {
    if (c.origen === 'saldo_inicial' || !c.insumoId || !(Number(c.toneladas) > 0)) continue;
    const mi = mOf(c.fecha);
    if (mi == null) continue;
    if (!regT.has(c.insumoId)) regT.set(c.insumoId, { t: ZM(), v: ZM() });
    regT.get(c.insumoId).t[mi] += Number(c.toneladas);
    regT.get(c.insumoId).v[mi] += (c.monto || 0) * factorBase(c.moneda, c.tc);
  }
  const mrpRows = new Map(), mrpNetoM = ZM(), mrpIvaM = ZM(), mrpTotalM = ZM();
  const stockMP = [];
  for (const ins of insumos) {
    const consumo = ZM(), comprasPlan = ZM(), comprasReg = ZM(), stock = ZM(), costo = ZM();
    for (const p of S.productos) {
      const r = (p.receta || []).find((x) => x.insumoId === ins.id);
      const pr = produccion.get(p.id);
      if (!r || !pr) continue;
      for (let mi = 0; mi < nM; mi++) consumo[mi] += pr.prod[mi] * (Number(r.t) || 0);
    }
    const precio = Number(ins.precio) || 0, minimo = Number(ins.stockMin) || 0, ivaI = (Number(ins.iva) || 0) / 100;
    const anticipo = Math.max(0, Math.round(Number(ins.anticipo) || 0));
    const plazo = Math.max(0, Math.round(Number(ins.plazo) || 0));
    const reg = regT.get(ins.id) || { t: ZM(), v: ZM() };
    let st = Number(ins.stockInicial) || 0, valor = st * precio;
    for (let mi = 0; mi < nM; mi++) {
      comprasReg[mi] = reg.t[mi];
      let plan = 0;
      if (mi >= curIdx) plan = Math.max(0, consumo[mi] + minimo - (st + reg.t[mi]));
      comprasPlan[mi] = plan;
      st += reg.t[mi] + plan;
      valor += reg.v[mi] + plan * precio;
      costo[mi] = st > 0.0001 ? valor / st : precio;
      valor -= consumo[mi] * costo[mi];
      st -= consumo[mi];
      stock[mi] = st;
      if (plan > 0.0001) {
        const pm = Math.max(Math.min(curIdx, nM - 1), mi - anticipo);
        const neto = plan * precio, total = neto * (1 + ivaI);
        mrpNetoM[pm] += neto; mrpIvaM[pm] += neto * ivaI; mrpTotalM[pm] += total;
        const row = autoRow(mrpRows, ins.id);
        const i0 = wOf(addDays(`${months[pm]}-15`, plazo));
        if (i0 >= 0 && i0 < nW) row.proj[i0] += total;
        if (i0 < nW) { const t = nextOpen(Math.max(i0, curC)); if (t < nW) row.pend[t] += total; }
      }
    }
    stockMP.push({ ins, consumo, comprasPlan, comprasReg, stock, costo });
  }
  for (const row of mrpRows.values()) for (let i = 0; i < nW; i++) row.eff[i] = closed[i] ? 0 : row.pend[i];
  const costoMP = new Map(stockMP.map((x) => [x.ins.id, x.costo]));
  // Costo de materia prima por tonelada (va al costo de ventas). La conversión (energía, mano de obra) ya se paga en las líneas del flujo.
  const costoProd = (p, mi) => {
    let c = 0;
    for (const r of p.receta || []) { const ins = insById.get(r.insumoId); if (!ins) continue; const cm = costoMP.get(r.insumoId); c += (Number(r.t) || 0) * (cm ? cm[mi] : Number(ins.precio) || 0); }
    return c;
  };
  const stockPT = [];
  for (const p of S.productos) {
    const pr = produccion.get(p.id);
    if (!pr) continue;
    const q = qtyProd.get(p.id) || { real: ZM(), pend: ZM() };
    const stock = ZM(), costoU = ZM(), costoMat = ZM();
    let st = Number(p.stockInicial) || 0;
    for (let mi = 0; mi < nM; mi++) {
      costoMat[mi] = costoProd(p, mi);
      costoU[mi] = costoMat[mi] + (Number(p.conversion) || 0);
      cmvReal[mi] += q.real[mi] * costoMat[mi];
      pendCmv[mi] += q.pend[mi] * costoMat[mi];
      st += pr.prod[mi] - pr.venta[mi];
      stock[mi] = st;
    }
    stockPT.push({ p, venta: pr.venta, prod: pr.prod, stock, costoU, costoMat });
  }

  /* ---- gastos variables: porcentaje de las ventas del mes ---- */
  for (const { l, g } of variables) {
    const pct = (Number(l.pctVentas) || 0) / 100;
    const des = Math.max(0, Math.round(Number(l.desfase) || 0));
    const proj = Z(), ppto = Z();
    for (let mi = 0; mi < nM; mi++) {
      const i = (mi + des) * 4 + 3;
      if (i >= nW) continue;
      proj[i] += pct * (ventasReal[mi] + pendVentas[mi]);
      ppto[i] += pct * pptoVentas[mi];
    }
    const x = agregarLinea(l, g, proj, true);
    x.ppto = ppto;
    x.variable = pct;
  }
  const ajusteReal = Object.values(S.valores.__ajuste || {}).some((c) => isNum(c.r));
  if (ajusteReal) agregarLinea({ id: '__ajuste', nombre: 'Diferencias de conciliación bancaria', tipo: 'otros_ingresos' }, vg.aju, Z(), true);

  /* ---- liquidación mensual de IVA (débito − crédito, se paga el mes siguiente) ---- */
  const ivaDebProy = ivaDebReal.map((v, mi) => v + ivaDebPlan[mi]);
  const ivaLiq = ZM(), ivaProj = Z();
  {
    const bi = S.balanceInicial;
    const dia = Math.min(28, Math.max(1, Math.round(Number(cfg.ivaDia) || 25)));
    const pagar = (mi, monto) => { if (mi >= nM || monto <= 0.004) return; const i = wOf(`${months[mi]}-${pad(dia)}`); if (i >= 0 && i < nW) ivaProj[i] += monto; };
    pagar(0, Number(bi.ivaPagar) || 0);
    let favor = 0;
    for (let mi = 0; mi < nM; mi++) {
      const neto = ivaDebProy[mi] - ivaCredM[mi] - mrpIvaM[mi] + favor;
      if (neto > 0) { ivaLiq[mi] = neto; favor = 0; pagar(mi + 1, neto); } else favor = neto;
    }
  }
  const ivaTieneReal = Object.values(S.valores.__iva || {}).some((c) => isNum(c.r));
  if (hasAny(ivaProj) || ivaTieneReal) agregarLinea({ id: '__iva', nombre: 'IVA a pagar (débito − crédito del mes anterior)', tipo: 'pago_iva' }, vg.iva, ivaProj, true);

  /* ---- totales semanales por sección y saldos ---- */
  const LAY = ['proj', 'real', 'eff'];
  const secTot = {};
  for (const sec of ['ing', 'egr', 'fin']) secTot[sec] = { proj: Z(), real: Z(), eff: Z() };
  for (const x of lines) for (const L of LAY) for (let i = 0; i < nW; i++) secTot[x.sec][L][i] += x[L][i];
  const sumarAuto = (map, sec, conReal) => {
    for (const row of map.values()) for (let i = 0; i < nW; i++) {
      secTot[sec].proj[i] += row.proj[i];
      secTot[sec].eff[i] += row.eff[i];
      if (conReal) secTot[sec].real[i] += row.real[i];
    }
  };
  sumarAuto(cxcCli, 'ing', true);
  sumarAuto(planCli, 'ing', false);
  sumarAuto(cxpProv, 'egr', true);
  sumarAuto(mrpRows, 'egr', false);
  const saldo = {};
  for (const L of LAY) {
    const ini = Z(), fin = Z(), net = Z();
    let s = Number(cfg.saldoInicial) || 0;
    for (let i = 0; i < nW; i++) {
      ini[i] = s;
      net[i] = secTot.ing[L][i] - secTot.egr[L][i] - secTot.fin[L][i];
      s += net[i];
      fin[i] = s;
    }
    saldo[L] = { ini, fin, net };
  }

  /* ---- EERR por capa ---- */
  const tipoMes = {};
  for (const L of LAY) {
    tipoMes[L] = {};
    for (const t of Object.keys(TIPOS)) tipoMes[L][t] = ZM();
    for (const x of lines) {
      const m = toM(L === 'proj' && x.ppto ? x.ppto : x[L]);
      const arr = tipoMes[L][x.tipo];
      if (arr) for (let mi = 0; mi < nM; mi++) arr[mi] += m[mi];
    }
  }
  const lineaMes = new Map(lines.map((x) => [x.l.id, { proj: toM(x.proj), real: toM(x.real), eff: toM(x.eff) }]));
  const vida = Math.max(1, Number(cfg.vidaUtil) || 10) * 12;
  const depExist = Number(cfg.depMensual) || 0;
  const tasa = (Number(cfg.ire) || 0) / 100;
  const add = (a, b) => a.map((v, i) => v + (b ? b[i] : 0));
  function armarEERR(base) {
    const e = {};
    for (const k of EERR_KEYS) e[k] = base[k] || ZM();
    const ub = ZM(), ebitda = ZM(), ebit = ZM(), rai = ZM(), ire = ZM(), rn = ZM();
    let acumAnio = 0, provAnio = 0, anio = null;
    for (let mi = 0; mi < nM; mi++) {
      const y = months[mi].slice(0, 4);
      if (y !== anio) { anio = y; acumAnio = 0; provAnio = 0; }
      ub[mi] = e.ventas[mi] - e.cmv[mi] - e.cprod[mi];
      ebitda[mi] = ub[mi] - e.gcom[mi] - e.gadm[mi];
      ebit[mi] = ebitda[mi] - e.dep[mi];
      rai[mi] = ebit[mi] + e.oing[mi] + e.dcambio[mi] - e.gfin[mi];
      acumAnio += rai[mi];
      const prov = tasa * Math.max(0, acumAnio);
      ire[mi] = base.ire ? base.ire[mi] : prov - provAnio;
      provAnio = prov;
      rn[mi] = rai[mi] - ire[mi];
    }
    return { ...e, ub, ebitda, ebit, rai, ire, rn };
  }
  function depreciacion(capexM) {
    const out = ZM(); let acum = 0;
    for (let mi = 0; mi < nM; mi++) { out[mi] = depExist + acum / vida; acum += capexM[mi]; }
    return out;
  }
  const dcambio = CXC.fxM.map((v, mi) => v - CXP.fxM[mi]);
  const eerrBase = (L, ventas, cmv, conDocs) => ({
    ventas, cmv,
    cprod: add(tipoMes[L].costo_produccion, conDocs && compraDest.costo_produccion),
    gcom: add(tipoMes[L].gasto_comercial, conDocs && compraDest.gasto_comercial),
    gadm: add(tipoMes[L].gasto_admin, conDocs && compraDest.gasto_admin),
    oing: tipoMes[L].otros_ingresos, gfin: add(tipoMes[L].interes, conDocs && CXC.costoM),
    dcambio: conDocs ? dcambio : ZM(),
    dep: depreciacion(add(tipoMes[L].inversion, conDocs && compraDest.inversion)),
  });
  const ventasProy = ventasReal.map((v, mi) => v + pendVentas[mi]);
  const cmvProy = cmvReal.map((v, mi) => v + pendCmv[mi]);
  const eerrPptoVivo = armarEERR(eerrBase('proj', pptoVentas, pptoCmv, false));
  let eerrPpto = eerrPptoVivo;
  if (S.presupuesto && S.presupuesto.meses) {
    const base = { ire: ZM() };
    for (const k of EERR_KEYS) base[k] = ZM();
    for (let mi = 0; mi < nM; mi++) {
      const snap = S.presupuesto.meses[months[mi]];
      if (!snap) continue;
      for (const k of EERR_KEYS) base[k][mi] = snap[k] || 0;
      base.ire[mi] = snap.ire || 0;
    }
    eerrPpto = armarEERR(base);
  }
  const eerr = {
    ppto: eerrPpto,
    pptoVivo: eerrPptoVivo,
    real: armarEERR(eerrBase('real', ventasReal, cmvReal, true)),
    proy: armarEERR(eerrBase('eff', ventasProy, cmvProy, true)),
  };

  /* ---- balance proyectado (capa actualizada) ---- */
  const bi = S.balanceInicial;
  const cobranzasM = ZM(), pagosProvM = ZM();
  for (const map of [cxcCli, planCli]) for (const row of map.values()) { const m = toM(row.eff); for (let mi = 0; mi < nM; mi++) cobranzasM[mi] += m[mi]; }
  for (const map of [cxpProv, mrpRows]) for (const row of map.values()) { const m = toM(row.eff); for (let mi = 0; mi < nM; mi++) pagosProvM[mi] += m[mi]; }
  const TE = tipoMes.eff, E = eerr.proy;
  const keys = ['caja', 'cxc', 'inv', 'oc', 'bu', 'oanc', 'prov', 'otras', 'prestCP', 'prestLP', 'prest', 'iva', 'imp', 'cap', 'res', 'ra', 're'];
  const bal = {}; for (const k of keys) bal[k] = [];
  const ini = {
    caja: Number(cfg.saldoInicial) || 0, cxc: ar0, inv: bi.inventarios, oc: bi.otrosCreditos, bu: bi.bienesUso, oanc: bi.otrosActivosNC,
    prov: ap0, otras: bi.proveedores, prest: (Number(bi.prestamos) || 0) + prest0Cron, iva: Number(bi.ivaPagar) || 0, imp: bi.impuestos,
    cap: bi.capital, res: bi.reservas, ra: bi.resultadosAcumulados, re: 0,
  };
  const partirPrestamo = (total, desde) => {
    let cp = 0;
    for (let k = desde; k < Math.min(nM, desde + 12); k++) cp += TE.amortizacion[k];
    cp = Math.max(0, Math.min(total, cp));
    return { cp, lp: total - cp };
  };
  { const p = partirPrestamo(ini.prest, 0); ini.prestCP = p.cp; ini.prestLP = p.lp; }
  let cxc = ini.cxc, inv = ini.inv, oc = ini.oc, bu = ini.bu, prov = ini.prov, otras = ini.otras, prest = ini.prest, iva = ini.iva, imp = ini.imp, cap = ini.cap, ra = ini.ra, re = 0;
  let anio = months[0].slice(0, 4);
  for (let mi = 0; mi < nM; mi++) {
    const y = months[mi].slice(0, 4);
    if (y !== anio) { ra += re; re = 0; anio = y; }
    cxc += ventasTotalM[mi] + pendTotalM[mi] - (cobranzasM[mi] - CXC.fxM[mi] + CXC.costoM[mi]);
    inv += TE.compra[mi] + compraDest.compra[mi] + mrpNetoM[mi] - cmvProy[mi];
    oc -= TE.cobro_credito[mi];
    bu += TE.inversion[mi] + compraDest.inversion[mi] - E.dep[mi];
    prov += comprasTotalM[mi] + mrpTotalM[mi] - (pagosProvM[mi] - CXP.fxM[mi]);
    otras -= TE.pago_deuda[mi];
    prest += TE.prestamo[mi] - TE.amortizacion[mi];
    iva += ivaDebProy[mi] - ivaCredM[mi] - mrpIvaM[mi] - TE.pago_iva[mi];
    imp += E.ire[mi] - TE.impuesto[mi];
    cap += TE.aporte[mi];
    ra -= TE.retiro[mi];
    re += E.rn[mi];
    const p = partirPrestamo(prest, mi + 1);
    const vals = { caja: saldo.eff.fin[mi * 4 + 3], cxc, inv, oc, bu, oanc: ini.oanc, prov, otras, prestCP: p.cp, prestLP: p.lp, prest, iva, imp, cap, res: ini.res, ra, re };
    for (const k of keys) bal[k].push(vals[k]);
  }
  const totales = (g) => {
    const ac = g.caja + g.cxc + g.inv + g.oc, anc = g.bu + g.oanc;
    const pc = g.prov + g.otras + g.prestCP + g.iva + g.imp, pnc = g.prestLP;
    const pn = g.cap + g.res + g.ra + g.re;
    return { ac, anc, activo: ac + anc, pc, pnc, pasivo: pc + pnc, pn, pasivoPn: pc + pnc + pn, dif: ac + anc - (pc + pnc + pn) };
  };
  const balIni = { ...ini, ...totales(ini) };
  const balMes = months.map((m, mi) => {
    const g = {}; for (const k of keys) g[k] = bal[k][mi];
    return { ...g, ...totales(g) };
  });

  /* ---- indicadores para el tablero ---- */
  let ultimaCerrada = -1;
  for (let i = 0; i < Math.min(nW, Math.max(cur, 0) + 1); i++) if (closed[i]) ultimaCerrada = i;
  const semanasSinCerrar = [];
  for (let i = 0; i < Math.min(cur, nW); i++) if (!closed[i]) semanasSinCerrar.push(i);
  let minIdx = -1;
  for (let i = Math.min(curC, nW - 1); i < nW; i++) if (minIdx < 0 || saldo.eff.fin[i] < saldo.eff.fin[minIdx]) minIdx = i;
  let primerNegativo = -1;
  for (let i = Math.min(curC, nW); i < nW; i++) if (saldo.eff.fin[i] < -0.5) { primerNegativo = i; break; }
  const invNeg = balMes.findIndex((b) => b.inv < -0.5);
  const vencidas = cuentas.filter((c) => c.saldo > 0.004 && c.vencido > 0.004);
  const vencidasPagar = cuentasPagar.filter((c) => c.saldo > 0.004 && c.vencido > 0.004);

  if (semanasSinCerrar.length) alerts.push({ nivel: 'warn', tipo: 'cierre', n: semanasSinCerrar.length, idx: semanasSinCerrar });
  if (primerNegativo >= 0) alerts.push({ nivel: 'crit', tipo: 'negativo', idx: primerNegativo, valor: saldo.eff.fin[primerNegativo] });
  if (vencidas.length) alerts.push({ nivel: 'crit', tipo: 'vencidas', n: new Set(vencidas.map((c) => c.v.clienteId)).size, valor: sum(vencidas.map((c) => c.vencido * c.f)) });
  if (vencidasPagar.length) alerts.push({ nivel: 'warn', tipo: 'pagar', n: new Set(vencidasPagar.map((c) => c.v.proveedorId)).size, valor: sum(vencidasPagar.map((c) => c.vencido * c.f)) });
  if (invNeg >= 0) alerts.push({ nivel: 'warn', tipo: 'inventario', mi: invNeg, valor: balMes[invNeg].inv });
  if (Math.abs(balIni.dif) > 0.5) alerts.push({ nivel: 'warn', tipo: 'balance', valor: balIni.dif });

  const grupos = [
    ...S.grupos.filter((g) => g.sec === 'ing'), vg.des, vg.aju,
    vg.cxp, vg.mrp, ...S.grupos.filter((g) => g.sec === 'egr'), vg.iva,
    vg.cap, vg.int, ...S.grupos.filter((g) => g.sec === 'fin'),
  ].filter((g) => !g.virtual || (g.auto === 'cxp' ? cxpProv.size > 0 : g.auto === 'mrp' ? mrpRows.size > 0 : lines.some((x) => x.g === g)));

  return {
    HOY, esc, cal, months, weeks, nW, nM, closed, cur, curC, curMonth, wOf, toM,
    grupos, lines, lineaMes, cxcCli, cxpProv, mrpRows, planCli, cuentas, cuentasPagar, ar0, ap0, prestamosInfo, prest0Cron,
    stockMP, stockPT, produccion, mrpNetoM, mrpTotalM, insById, curIdx, descCostoM: CXC.costoM,
    secTot, saldo, tipoMes,
    ventasReal, cmvReal, pptoVentas, pptoCmv, pendVentas, pendCmv, ventasProy, cmvProy, ventasCliMes, planFilas,
    compraDest, comprasTotalM, ivaDebProy, ivaCredM, ivaLiq,
    eerr, balIni, balMes, cobranzasM, pagosProvM,
    ultimaCerrada, semanasSinCerrar, minIdx, primerNegativo, alerts,
    cliById, prodById, provById, gById,
  };
}

/* Instantánea del presupuesto (para "aprobar presupuesto"). */
function snapshotPresupuesto(M) {
  const meses = {};
  M.months.forEach((mk, mi) => {
    const o = {};
    for (const k of EERR_KEYS) o[k] = r2(M.eerr.pptoVivo[k][mi]);
    o.ire = r2(M.eerr.pptoVivo.ire[mi]);
    meses[mk] = o;
  });
  return { fecha: hoy(), meses };
}

/* Foto de la proyección: se guarda para comparar después contra lo que realmente pasó. */
function fotoProyeccion(M, etiqueta) {
  const meses = {};
  M.months.forEach((mk, mi) => {
    const s4 = (arr) => arr.slice(mi * 4, mi * 4 + 4).reduce((a, b) => a + b, 0);
    meses[mk] = {
      ventas: r2(M.ventasProy[mi]),
      cobranzas: r2(s4(M.secTot.ing.eff)),
      egresos: r2(s4(M.secTot.egr.eff) + s4(M.secTot.fin.eff)),
      saldo: r2(M.saldo.eff.fin[mi * 4 + 3]),
      rn: r2(M.eerr.proy.rn[mi]),
    };
  });
  return { id: uid('f'), fecha: M.HOY, mes: M.curMonth, etiqueta: etiqueta || `Foto del ${fmtDate(M.HOY)}`, escenario: M.esc.k, meses };
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Reparte un monto mensual en las 4 semanas. modo: 'eq' | 's1' | 's2' | 's3' | 's4' */
function distribuir(total, modo = 'eq') {
  const t = r6(total);
  if (/^s[1-4]$/.test(modo)) { const out = [0, 0, 0, 0]; out[Number(modo[1]) - 1] = t; return out; }
  const q = r6(t / 4);
  return [q, q, q, r6(t - q * 3)];
}
function setValor(st, lineaId, weekKey, capa, v) {
  if (!st.valores[lineaId]) st.valores[lineaId] = {};
  const c = st.valores[lineaId][weekKey] || (st.valores[lineaId][weekKey] = {});
  if (v == null) delete c[capa]; else c[capa] = r6(v);
  delete c[capa + 'f'];
  if (c.p == null && c.r == null) delete st.valores[lineaId][weekKey];
}

  // Semanas pasadas cerradas con su real (queda abierta la última para mostrar el recordatorio).
  const pasadas = cal.weeks.filter((w) => w.end < H);

  // Conciliación de las últimas semanas cerradas (una con gastos bancarios sin cargar).
  const [cCaja, cUsd, cGs] = st.cuentas;
  cerrar.slice(-3).forEach((w, n) => {

  });
  // Fotos de la proyección tomadas al inicio de los meses anteriores (solo con lo que se sabía en ese momento).
  st.fotos = [];
  for (const mk of [inicio, addMonths(inicio, 1)]) {
    const d0 = `${mk}-01`;

    sf.compras = sf.compras.filter((c) => c.fecha < d0);
    sf.pagos = sf.pagos.filter((p) => p.fecha < d0);
    for (const lid of Object.keys(sf.valores)) for (const wk of Object.keys(sf.valores[lid])) if (wk.slice(0, 7) >= mk) { delete sf.valores[lid][wk].r; if (!isNum(sf.valores[lid][wk].p)) delete sf.valores[lid][wk]; }
    for (const wk of Object.keys(sf.cerradas)) if (wk.slice(0, 7) >= mk) delete sf.cerradas[wk];
    S = sf;
    const f = fotoProyeccion(compute(sf), `Inicio de ${mLabel(mk)}`);

    st.fotos.push(f);
  }
  S = antes;
  return st;
